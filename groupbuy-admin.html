<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>團GO 後台</title>
<style>
/* ── 設計系統 ── */
:root{
  --c-bg:#F8F6F0; --c-surface:#fff; --c-ink:#1A1A1A; --c-muted:#6B6B6B;
  --c-border:#E2D9CE; --c-hover:#F0EDE6;
  --c-green:#DDEAD1; --c-yellow:#FAEEC7; --c-blue:#D9E5EE;
  --c-pink:#FAE1DD; --c-mint:#D4E3DD;
  --c-primary:#82ABA3; --c-primary-dark:#628E87;
  --c-danger:#C8645D; --c-danger-bg:#FAE1DD;
  --c-sidebar:#F0EDE6; --c-sidebar-active:#E2D9CE;
  --sidebar-w:220px; --header-h:52px;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --safe-b:env(safe-area-inset-bottom,0px)
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;
  font-size:14px;line-height:1.5;color:var(--c-ink);background:var(--c-bg);
  height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}

/* ── Login ── */
#login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--c-bg);z-index:200
}
.lc{width:360px;background:var(--c-surface);border-radius:16px;
  padding:36px 32px;box-shadow:var(--shadow-lg)}
.lc-logo{width:56px;height:56px;object-fit:contain;border-radius:12px;
  display:block;margin:0 auto 14px}
.lc h1{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px}
.lc p{font-size:13px;color:var(--c-muted);text-align:center;margin-bottom:24px}
.lf{margin-bottom:12px}
.lf label{display:block;font-size:12px;font-weight:700;color:var(--c-muted);
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.lf input{width:100%;padding:11px 12px;border:1.5px solid var(--c-border);
  border-radius:var(--r);font-size:15px;background:#fff;transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--c-primary)}
.lbtn{width:100%;padding:13px;border-radius:var(--r);border:none;
  background:var(--c-primary);color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;transition:background .15s;margin-top:4px}
.lbtn:hover{background:var(--c-primary-dark)}
.lerr{font-size:13px;color:var(--c-danger);text-align:center;
  margin-top:10px;min-height:18px}
.lfoot{font-size:11px;color:var(--c-muted);text-align:center;margin-top:18px}

/* ── App Shell ── */
#app{display:none;height:100dvh;flex-direction:column}
#app.show{display:flex}

/* Header */
#hdr{
  height:var(--header-h);background:var(--c-surface);
  border-bottom:1px solid var(--c-border);
  display:flex;align-items:center;padding:0 16px 0 0;gap:0;flex-shrink:0;
  z-index:30;position:relative
}
.hdr-brand{
  width:var(--sidebar-w);flex-shrink:0;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  border-right:1px solid var(--c-border);height:100%
}
.hdr-logo{height:28px;object-fit:contain;border-radius:6px}
.hdr-name{font-size:15px;font-weight:900;color:var(--c-ink)}
.hdr-center{flex:1;min-width:0;padding:0 16px;display:flex;align-items:center;gap:8px}
.hdr-session-label{font-size:12px;color:var(--c-muted);font-weight:600;white-space:nowrap}
#sessionPicker{
  font-size:14px;font-weight:700;color:var(--c-ink);
  background:none;border:none;cursor:pointer;
  max-width:280px;padding:6px 8px;border-radius:var(--r-sm);
  border:1px solid transparent
}
#sessionPicker:hover{background:var(--c-hover);border-color:var(--c-border)}
#sessionPicker:focus{outline:none;border-color:var(--c-primary)}
.hdr-right{display:flex;align-items:center;gap:6px;padding-right:4px}
.hdr-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:99px;
  border:1px solid var(--c-border);background:var(--c-surface);
  font-size:13px;font-weight:700;cursor:pointer;
  color:var(--c-muted);transition:all .1s
}
.hdr-pill:hover{background:var(--c-hover);color:var(--c-ink)}
.hdr-pill.danger{color:var(--c-danger)}
.hdr-pill.danger:hover{background:var(--c-danger-bg)}
.dot{
  min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--c-danger);color:#fff;
  font-size:11px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center
}

/* Body = Sidebar + Main */
#body{display:flex;flex:1;overflow:hidden}

/* Sidebar */
#sb{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--c-sidebar);border-right:1px solid var(--c-border);
  display:flex;flex-direction:column;overflow-y:auto
}
.sb-sec{
  font-size:11px;font-weight:800;color:var(--c-muted);
  letter-spacing:.6px;text-transform:uppercase;
  padding:16px 14px 5px
}
.sb-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px 9px 14px;
  border:none;background:none;cursor:pointer;
  width:100%;text-align:left;
  font-size:13.5px;font-weight:700;color:var(--c-muted);
  border-left:3px solid transparent;transition:all .1s;
  position:relative
}
.sb-item:hover{background:var(--c-sidebar-active);color:var(--c-ink)}
.sb-item.on{
  background:var(--c-surface);color:var(--c-primary-dark);
  border-left-color:var(--c-primary);
  box-shadow:inset -1px 0 0 var(--c-border)
}
.sb-ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-badge{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;background:var(--c-danger);color:#fff;
  font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center
}
.sb-spacer{flex:1}
.sb-bottom{border-top:1px solid var(--c-border);padding:8px 0}

/* Main Content */
#main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden}
.pane{display:none;padding:28px 32px}
.pane.on{display:block}
.pane-hdr{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:22px;gap:12px
}
.pane-title{font-size:20px;font-weight:900;line-height:1.2}
.pane-sub{font-size:13px;color:var(--c-muted);margin-top:3px}
.pane-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{
  background:var(--c-surface);border-radius:var(--r);
  padding:18px 20px;border:1px solid var(--c-border);
  cursor:pointer;transition:box-shadow .15s
}
.stat:hover{box-shadow:var(--shadow)}
.stat-n{font-size:30px;font-weight:900;line-height:1;margin-bottom:4px;
  font-variant-numeric:tabular-nums}
.stat-l{font-size:12px;color:var(--c-muted);font-weight:600}
.stat.red .stat-n{color:var(--c-danger)}
.stat.amber .stat-n{color:#9A7000}
.stat.teal .stat-n{color:var(--c-primary-dark)}

/* Data table */
.tbl-wrap{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--r);overflow:hidden
}
.tbl-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--c-border);gap:8px
}
.tbl-title{font-size:14px;font-weight:800}
table{width:100%;border-collapse:collapse}
thead th{
  padding:9px 14px;text-align:left;
  font-size:11.5px;font-weight:800;color:var(--c-muted);
  letter-spacing:.2px;border-bottom:1px solid var(--c-border);
  background:var(--c-bg);white-space:nowrap
}
thead th.r{text-align:right}
tbody td{padding:11px 14px;border-bottom:1px solid var(--c-border);
  font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .08s}
tbody tr:hover{background:var(--c-hover)}
.td-id{font-family:ui-monospace,monospace;font-size:12px;color:var(--c-muted)}
.td-name{font-weight:700}
.td-amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.td-act{text-align:right}

/* Chips */
.chip{
  display:inline-flex;align-items:center;
  padding:2px 9px;border-radius:99px;
  font-size:12px;font-weight:700;white-space:nowrap
}
.chip-green{background:var(--c-green);color:#2b5f24}
.chip-yellow{background:var(--c-yellow);color:#8a6200}
.chip-blue{background:var(--c-blue);color:#2a4470}
.chip-red{background:var(--c-pink);color:#8B3330}
.chip-gray{background:var(--c-hover);color:var(--c-muted)}

/* Filter bar */
.filters{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.fc{
  padding:5px 13px;border-radius:99px;
  border:1.5px solid var(--c-border);background:var(--c-surface);
  font-size:13px;font-weight:700;cursor:pointer;color:var(--c-muted);
  transition:all .1s
}
.fc:hover{border-color:var(--c-primary);color:var(--c-primary-dark)}
.fc.on{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:var(--r);border:none;
  font-size:13px;font-weight:800;cursor:pointer;
  transition:all .1s;white-space:nowrap
}
.btn-p{background:var(--c-primary);color:#fff}
.btn-p:hover{background:var(--c-primary-dark)}
.btn-o{background:var(--c-surface);color:var(--c-ink);border:1.5px solid var(--c-border)}
.btn-o:hover{background:var(--c-hover)}
.btn-d{background:var(--c-surface);color:var(--c-danger);border:1.5px solid var(--c-pink)}
.btn-d:hover{background:var(--c-danger-bg)}
.btn-red{background:var(--c-danger);color:#fff}
.btn-red:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-w{width:100%}
.btn-row{display:flex;flex-direction:column;gap:8px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--c-muted)}
.empty-ic{font-size:36px;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:800;color:var(--c-ink);margin-bottom:5px}

/* Right panel (drawer) */
#panel-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.25);
  z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s
}
#panel-overlay.show{opacity:1;pointer-events:all}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:min(500px,45vw);
  background:var(--c-surface);border-left:1px solid var(--c-border);
  z-index:51;display:flex;flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,.06);
  transform:translateX(100%);transition:transform .22s ease
}
#panel.show{transform:translateX(0)}
.pan-hdr{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 20px 14px;border-bottom:1px solid var(--c-border);flex-shrink:0
}
.pan-title{font-size:17px;font-weight:900}
.pan-sub{font-size:12px;color:var(--c-muted);margin-top:3px}
.pan-x{
  width:30px;height:30px;border-radius:var(--r-sm);
  border:1px solid var(--c-border);background:var(--c-surface);
  font-size:17px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:var(--c-muted)
}
.pan-x:hover{background:var(--c-hover);color:var(--c-ink)}
.pan-body{flex:1;overflow-y:auto;padding:18px 20px}
.pan-foot{
  padding:14px 20px;border-top:1px solid var(--c-border);
  display:flex;flex-direction:column;gap:8px;flex-shrink:0
}

/* Detail rows */
.dr{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--c-border);gap:10px;font-size:14px
}
.dr:last-child{border:none}
.dk{color:var(--c-muted);font-weight:600;flex-shrink:0;font-size:13px}
.dv{font-weight:700;text-align:right;word-break:break-all}

/* Section in panel */
.psec{margin-bottom:18px}
.psec-t{font-size:11px;font-weight:800;color:var(--c-muted);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}

/* Form fields */
.ff{margin-bottom:12px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--c-muted);margin-bottom:4px}
.fi{
  width:100%;padding:9px 11px;border:1.5px solid var(--c-border);
  border-radius:var(--r-sm);font-size:14px;background:#fff;
  transition:border-color .15s
}
.fi:focus{outline:none;border-color:var(--c-primary)}
.fi-ta{resize:vertical;min-height:68px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcheck{display:flex;align-items:center;gap:7px;cursor:pointer;
  font-size:14px;font-weight:700}
.fcheck input{width:17px;height:17px;cursor:pointer;accent-color:var(--c-primary-dark)}

/* Product cards */
.pcard{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--r);padding:13px 15px;margin-bottom:7px;
  display:flex;align-items:flex-start;gap:10px;
  transition:border-color .1s
}
.pcard:hover{border-color:var(--c-primary)}
.pcard-cb{width:17px;height:17px;cursor:pointer;flex-shrink:0;margin-top:2px;
  accent-color:var(--c-primary-dark)}
.pcard-info{flex:1;min-width:0}
.pcard-name{font-size:14px;font-weight:800;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-price{font-size:13px;font-weight:700;color:var(--c-primary-dark);margin-bottom:3px}
.pcard-meta{font-size:12px;color:var(--c-muted)}
.pcard-tiers{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px}
.tc{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:var(--c-green);color:#2b5f24}
.tc.p{background:var(--c-yellow);color:#8a6200}

/* Batch panel */
.batch{
  background:var(--c-yellow);border:1px solid #e8d589;
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px
}
.batch-hdr{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap
}
.batch-t{font-size:13px;font-weight:900;color:#6B4D00}
.batch-ct{font-size:12px;color:#8a6200;margin-left:auto}
.batch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.bff label{font-size:11px;font-weight:800;color:#8a6200;display:block;margin-bottom:3px}
.bff input{width:100%;padding:7px 9px;border:1px solid #e8d589;border-radius:7px;
  font-size:13px;background:rgba(255,255,255,.7)}
.bff input:focus{outline:none;border-color:var(--c-primary)}
.bsec{background:rgba(255,255,255,.5);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.bsec-t{font-size:11px;font-weight:800;color:var(--c-muted);margin-bottom:6px}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.ti{flex:1;padding:6px 8px;border:1px solid var(--c-border);border-radius:7px;
  font-size:13px;background:#fff}
.tdel{
  width:27px;height:27px;border:none;border-radius:7px;
  background:var(--c-pink);color:var(--c-danger);cursor:pointer;
  font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center
}

/* Settings */
.scard{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--r);padding:18px 20px;margin-bottom:12px
}
.scard-t{font-size:13px;font-weight:900;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--c-border);color:var(--c-ink)}

/* Apply card */
.acard{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--r);padding:13px 15px;margin-bottom:7px;
  cursor:pointer;transition:border-color .1s
}
.acard:hover{border-color:var(--c-primary)}
.acard-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;margin-bottom:4px}
.acard-name{font-size:14px;font-weight:800}
.acard-meta{font-size:13px;color:var(--c-muted);line-height:1.6}

/* Toast */
#toast{
  position:fixed;top:64px;right:20px;z-index:100;
  background:var(--c-ink);color:#fff;padding:10px 16px;
  border-radius:var(--r);font-size:13px;font-weight:700;
  opacity:0;transform:translateX(20px);
  transition:.2s;pointer-events:none;max-width:300px
}
#toast.show{opacity:1;transform:translateX(0)}
#toast.err{background:var(--c-danger)}

/* Pane title section separator */
.sec-t{font-size:13px;font-weight:800;margin:20px 0 10px;
  display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--c-border)}
.loading{text-align:center;padding:48px;color:var(--c-muted)}

/* ── Responsive: mobile ── */
@media(max-width:860px){
  #app{overflow:auto;height:auto;min-height:100dvh}
  #body{flex-direction:column}
  #sb{display:none}
  .hdr-brand{width:auto}
  #main{overflow:visible}
  .pane{padding:14px 14px 80px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .batch-grid{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  #panel{
    top:auto;left:0;width:100%;height:85dvh;
    border-left:none;border-top:1px solid var(--c-border);
    border-radius:16px 16px 0 0;
    transform:translateY(100%)
  }
  #panel.show{transform:translateY(0)}
  #mobnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(240,237,230,.97);border-top:1px solid var(--c-border);
    padding-bottom:var(--safe-b);z-index:30
  }
  .mn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:7px 4px;border:none;background:none;cursor:pointer;
    font-size:10.5px;font-weight:700;color:var(--c-muted);position:relative
  }
  .mn.on{color:var(--c-primary-dark)}
  .mn-ic{font-size:19px;line-height:1}
  .mn-dot{
    position:absolute;top:5px;right:calc(50% - 13px);
    width:7px;height:7px;background:var(--c-danger);
    border-radius:50%;border:1.5px solid rgba(240,237,230,.97)
  }
}
@media(min-width:861px){#mobnav{display:none}}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login">
  <div class="lc">
    <img class="lc-logo" src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO">
    <h1>後台管理</h1>
    <p>場次管理員 / 平台管理員</p>
    <div class="lf"><label>Email</label>
      <input id="lEmail" type="email" autocomplete="email" placeholder="your@email.com"></div>
    <div class="lf"><label>手機號碼</label>
      <input id="lPhone" type="tel" placeholder="0912345678" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="lbtn" onclick="doLogin()">登入管理後台</button>
    <div class="lerr" id="lerr"></div>
    <div class="lfoot">www.2b-Love.com　兔彼樂共創活動</div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <!-- Header -->
  <header id="hdr">
    <div class="hdr-brand">
      <img class="hdr-logo" src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO">
      <span class="hdr-name">後台</span>
    </div>
    <div class="hdr-center">
      <span class="hdr-session-label">場次：</span>
      <select id="sessionPicker" onchange="onPickerChange()">
        <option>載入中…</option>
      </select>
    </div>
    <div class="hdr-right">
      <button class="hdr-pill" onclick="refreshAll()">↻ 更新</button>
      <button class="hdr-pill danger" onclick="doLogout()" id="userPill">登出</button>
    </div>
  </header>

  <div id="body">
    <!-- Sidebar -->
    <nav id="sb">
      <div class="sb-sec">管理</div>
      <button class="sb-item on" id="si-home" onclick="goTo('home')">
        <span class="sb-ic">⌂</span>首頁
        <span id="sdot-home" class="sb-badge" style="display:none"></span>
      </button>
      <button class="sb-item" id="si-orders" onclick="goTo('orders')">
        <span class="sb-ic">☰</span>訂單管理
        <span id="sdot-orders" class="sb-badge" style="display:none"></span>
      </button>

        <span id="sdot-apply" class="sb-badge" style="display:none"></span>

      <button class="sb-item" id="si-settings" onclick="goTo('settings')">

      </button>

    <!-- Main -->
    <main id="main">

      <div class="pane on" id="p-home">

          <div>
            <div class="pane-title">總覽</div>

          </div>
          <div class="pane-actions">
            <button class="btn btn-o btn-sm" onclick="refreshAll()">↻ 重新整理</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat red" onclick="goTo('orders');setFilter('reported')">
            <div class="stat-n" id="cnt-pay">—</div>
            <div class="stat-l">待確認付款</div>
          </div>
          <div class="stat amber" onclick="goTo('orders');setFilter('shipping')">
            <div class="stat-n" id="cnt-ship">—</div>
            <div class="stat-l">待出貨</div>
          </div>
          <div class="stat amber" onclick="goTo('apply')">
            <div class="stat-n" id="cnt-apply">—</div>
            <div class="stat-l">申請待審</div>
          </div>
          <div class="stat teal">
            <div class="stat-n" id="cnt-rev">—</div>
            <div class="stat-l">付款收入</div>
          </div>
        </div>
        <div class="tbl-wrap">
          <div class="tbl-head">
            <span class="tbl-title">最近訂單</span>
            <button class="btn btn-o btn-sm" onclick="goTo('orders')">查看全部 →</button>
          </div>
          <div id="home-orders"><div class="loading">載入中…</div></div>
        </div>

      <div class="pane" id="p-orders">
        <div class="pane-hdr">
          <div class="pane-title">訂單管理</div>
          <button class="btn btn-o btn-sm" onclick="loadOrders()">↻</button>
        </div>
        <div class="filters" id="filterBar">
          <button class="fc on" data-f="all" onclick="setFilter('all')">全部</button>
          <button class="fc" data-f="reported" onclick="setFilter('reported')">待確認</button>
          <button class="fc" data-f="unpaid" onclick="setFilter('unpaid')">待付款</button>
          <button class="fc" data-f="paid" onclick="setFilter('paid')">已付款</button>

      <div class="pane" id="p-settings">
        <div class="pane-title" style="margin-bottom:20px">場次設定</div>

      </div>

      <!-- 其他 -->
      <div class="pane" id="p-more">

  <!-- Mobile nav -->
  <nav id="mobnav">
    <button class="mn on" id="mn-home" onclick="goTo('home')"><span class="mn-ic">⌂</span>首頁<span id="mdot-home" class="mn-dot" style="display:none"></span></button>
    <button class="mn" id="mn-orders" onclick="goTo('orders')"><span class="mn-ic">☰</span>訂單<span id="mdot-orders" class="mn-dot" style="display:none"></span></button>
    <button class="mn" id="mn-apply" onclick="goTo('apply')"><span class="mn-ic">✎</span>申請<span id="mdot-apply" class="mn-dot" style="display:none"></span></button>
    <button class="mn" id="mn-products" onclick="goTo('products')"><span class="mn-ic">📦</span>商品</button>
    <button class="mn" id="mn-settings" onclick="goTo('settings')"><span class="mn-ic">⚙️</span>設定</button>
    <button class="mn" id="mn-more" onclick="goTo('more')"><span class="mn-ic">≡</span>更多</button>
  </nav>
</div><!-- /app -->

<!-- Right Panel -->
<div id="panel-overlay" onclick="closePanel()"></div>
<div id="panel">
  <div class="pan-hdr">
    <div><div class="pan-title" id="panTitle">—</div><div class="pan-sub" id="panSub"></div></div>
    <button class="pan-x" onclick="closePanel()">×</button>
  </div>
  <div class="pan-body" id="panBody"></div>
  <div class="pan-foot" id="panFoot"></div>
</div>
<div id="toast"></div>

<script>
'use strict';

/* ── Config ── */
const API = location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname)
  ? location.origin+'/s/api' : 'https://2bl-v7.ndiangrace.workers.dev';
const TENANT='tuibile', TK='2bl_member_token';

/* ── State ── */
const S={token:'',name:'',email:'',role:'',isPlatform:false,
  sessions:[],sid:'',orders:[],products:[],applications:{m:[],p:[]},
  filter:'all',pane:'home'};

/* ── Helpers ── */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'NT$'+Number(n||0).toLocaleString();
const fmt=d=>{if(!d)return'—';return new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})};

/* ── API ── */
async function api(action,data={},method='POST'){
  const payload={action,tenant:TENANT,memberToken:S.token,...data};
  if(method==='GET'){
    const r=await fetch(`${API}?${new URLSearchParams(payload)}`,{cache:'no-store'});
    const j=await r.json().catch(()=>({error:'格式錯誤'}));
    if(j.error)throw new Error(j.error);
    return j;
  }
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),cache:'no-store'});
  const j=await r.json().catch(()=>({error:'格式錯誤'}));
  if(j.error)throw new Error(j.error);
  return j;
}

/* ── Auth ── */
async function doLogin(){
  const em=($('lEmail')?.value||'').trim(), ph=($('lPhone')?.value||'').trim();
  if(!em||!ph){$('lerr').textContent='請填 Email 和手機';return}
  $('lerr').textContent='';
  const btn=document.querySelector('.lbtn');
  btn.disabled=true;btn.textContent='登入中…';
  try{
    const j=await api('memberEmailPhoneLogin',{email:em,phone:ph});
    const check=await fetch(`${API}?${new URLSearchParams({action:'groupBuyAdminData',tenant:TENANT,memberToken:j.token,_t:Date.now()})}`,{cache:'no-store'}).then(r=>r.json());
    if(check.error)throw new Error('此帳號沒有後台管理權限');
    localStorage.setItem(TK,j.token);
    S.token=j.token;S.email=em;S.name=j.name||j.display_name||em;
    S.role=check.authorization?.role||'session_admin';
    S.isPlatform=S.role==='platform_super_admin';
    await startApp(check);
  }catch(e){$('lerr').textContent=e.message||'登入失敗'}
  btn.disabled=false;btn.textContent='登入管理後台';
}
function doLogout(){localStorage.removeItem(TK);location.reload()}
function showLogin(msg){
  $('login').style.display='flex';$('app').classList.remove('show');
  if(msg)$('lerr').textContent=msg;
}

/* ── Toast ── */
let _tt;
function toast(msg,err=false){
  const el=$('toast');el.textContent=msg;el.className=err?'show err':'show';
  clearTimeout(_tt);_tt=setTimeout(()=>el.className='',3200);
}

/* ── Panel (right drawer) ── */
function openPanel(title,sub,bodyHtml,footHtml){
  $('panTitle').textContent=title||'';
  $('panSub').textContent=sub||'';
  $('panBody').innerHTML=bodyHtml||'';
  $('panFoot').innerHTML=footHtml||'';
  $('panel-overlay').classList.add('show');
  requestAnimationFrame(()=>$('panel').classList.add('show'));
}
function closePanel(){
  $('panel').classList.remove('show');
  $('panel-overlay').classList.remove('show');
}

/* ── Navigation ── */
const PANES=['home','orders','apply','products','settings','more'];
function goTo(name){
  PANES.forEach(n=>{
    const p=$('p-'+n),si=$('si-'+n),mn=$('mn-'+n);
    const on=n===name;
    if(p)p.className=on?'pane on':'pane';
    if(si)si.className=on?'sb-item on':'sb-item';
    if(mn)mn.className=on?'mn on':'mn';
  });
  S.pane=name;
  if(name==='orders'&&!S.orders.length)loadOrders();
  else if(name==='orders')renderOrders();
  if(name==='apply')loadApply();
  if(name==='products')loadProducts();
  if(name==='settings')loadSettings();
  if(name==='more')loadMore();
}

/* ── Session picker ── */
function buildPicker(){
  const opts=S.sessions.length
    ?S.sessions.map(s=>`<option value="${esc(s.id)}"${s.id===S.sid?' selected':''}>${esc(s.name)}</option>`).join('')
    :'<option>無可用場次</option>';
  $('sessionPicker').innerHTML=opts;
  updateSubtitle();
}
function onPickerChange(){
  S.sid=$('sessionPicker').value;
  S.orders=[];S.products=[];
  updateSubtitle();
  if(S.pane==='orders')loadOrders();
  else if(S.pane==='products')loadProducts();
  else if(S.pane==='settings')loadSettings();
  updateStats();
}
function updateSubtitle(){
  const ses=S.sessions.find(s=>s.id===S.sid);
  const el=$('homeSubtitle');
  if(el)el.textContent=ses?ses.name:' ';
}

/* ── Status helpers ── */
function isClosed(o){return['cancelled','refunded','已取消','已退款'].includes(String(o.order_status||'').toLowerCase())||String(o.payment_status||'').toLowerCase()==='cancelled'}
function isPaid(o){return['paid','已付款'].includes(String(o.payment_status||'').toLowerCase())}
function isReported(o){return['reported','已回報'].includes(String(o.payment_status||'').toLowerCase())}
function refundReq(o){return String(o.refund_status||'').toLowerCase()==='requested'}

function payChip(o){
  const cl=isClosed(o),pd=isPaid(o),rp=isReported(o),rr=refundReq(o);
  if(cl)return'<span class="chip chip-gray">已關閉</span>';
  if(rr)return'<span class="chip chip-red">申請退款</span>';
  if(pd)return'<span class="chip chip-green">已付款</span>';
  if(rp)return'<span class="chip chip-yellow">待確認</span>';
  return'<span class="chip chip-gray">待付款</span>';
}
function fulfillChip(o){
  const m={pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成'};
  const l=m[String(o.order_status||'').toLowerCase()]||'';
  if(!l||isClosed(o))return'';
  const os=String(o.order_status||'').toLowerCase();
  if(['shipped','ready_pickup'].includes(os))return`<span class="chip chip-blue">${l}</span>`;
  if(os==='completed')return`<span class="chip chip-green">${l}</span>`;
  return`<span class="chip chip-gray">${l}</span>`;
}

/* ── Orders ── */
async function loadOrders(){
  $('order-list').innerHTML='<div class="loading">載入訂單中…</div>';
  if(!S.sid){$('order-list').innerHTML='<div class="empty"><div class="empty-t">請先選擇場次</div></div>';return}
  try{
    const d=await api('getGroupBuySessionOrders',{sessionId:S.sid},'GET');
    S.orders=d.orders||[];
    renderOrders();
    updateStats();
    renderRecentOrders();
  }catch(e){$('order-list').innerHTML=`<div class="empty"><div class="empty-t">載入失敗</div><div class="empty-ic">⚠️</div></div>`}
}

function setFilter(f){
  S.filter=f;
  document.querySelectorAll('.fc').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
  renderOrders();
}

function renderOrders(){
  let rows=S.orders;
  const f=S.filter;
  if(f==='reported')rows=rows.filter(o=>!isClosed(o)&&isReported(o));
  else if(f==='unpaid')rows=rows.filter(o=>!isClosed(o)&&!isPaid(o)&&!isReported(o));
  else if(f==='paid')rows=rows.filter(o=>!isClosed(o)&&isPaid(o)&&!refundReq(o));
  else if(f==='shipping')rows=rows.filter(o=>!isClosed(o)&&isPaid(o)&&['processing','shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase()));
  else if(f==='done')rows=rows.filter(o=>String(o.order_status||'').toLowerCase()==='completed');
  else if(f==='closed')rows=rows.filter(isClosed);
  $('order-list').innerHTML=orderTableHtml(rows);
}

function orderTableHtml(rows){
  if(!rows.length)return'<div class="empty" style="padding:40px"><div class="empty-ic">📭</div><div class="empty-t">沒有符合的訂單</div></div>';
  return`<table><thead><tr>
    <th>訂單</th><th>買家</th><th>付款</th><th>出貨</th>
    <th class="r">金額</th><th>時間</th><th></th>
  </tr></thead><tbody>
  ${rows.map(o=>{
    const id=String(o.id||'').slice(-8).toUpperCase();
    const cl=isClosed(o);
    return`<tr onclick="openOrder('${esc(o.id)}')">
      <td class="td-id">#${id}</td>
      <td class="td-name">${esc(o.recipient_name||o.member_email||'—')}</td>
      <td>${payChip(o)}</td>
      <td>${fulfillChip(o)||'<span style="color:var(--c-muted);font-size:12px">—</span>'}</td>
      <td class="td-amt">${money(o.total_amount)}</td>
      <td style="font-size:12px;color:var(--c-muted)">${fmt(o.created_at)}</td>
      <td class="td-act" onclick="event.stopPropagation()">
        ${!cl?`<button class="btn btn-o btn-sm" onclick="openOrder('${esc(o.id)}')">操作</button>`:''}
      </td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

function renderRecentOrders(){
  const el=$('home-orders');if(!el)return;
  const rows=S.orders.slice(0,8);
  el.innerHTML=orderTableHtml(rows);
}

function updateStats(){
  const rp=S.orders.filter(o=>!isClosed(o)&&isReported(o)).length;
  const sh=S.orders.filter(o=>!isClosed(o)&&isPaid(o)&&!['shipped','ready_pickup','completed'].includes(String(o.order_status||'').toLowerCase())&&!refundReq(o)).length;
  $('cnt-pay').textContent=rp;
  $('cnt-ship').textContent=sh;
  const pendA=(S.applications.m||[]).filter(a=>a.status==='pending').length+(S.applications.p||[]).filter(a=>a.status==='pending').length;
  $('cnt-apply').textContent=pendA;
  // Revenue
  const ses=S.sessions.find(s=>s.id===S.sid)||{};
  const rev=ses.paidTotalAmount||0;
  $('cnt-rev').textContent=rev>0?'NT$'+Number(rev).toLocaleString():'—';
  // Dots
  [['sdot-home',rp>0],['sdot-orders',rp>0],['sdot-apply',pendA>0],
   ['mdot-home',rp>0],['mdot-orders',rp>0],['mdot-apply',pendA>0]]
    .forEach(([id,show])=>{const el=$(id);if(el)el.style.display=show?'':'none'});
}

/* ── Order panel ── */
function openOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const shortId=String(o.id||'').slice(-8).toUpperCase();
  const cl=isClosed(o),pd=isPaid(o),rp=isReported(o),rr=refundReq(o);
  const os=String(o.order_status||'pending').toLowerCase();
  const delivery=String(o.fulfillment_type||'').toLowerCase();
  const osLabel={pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成',cancelled:'已取消',refunded:'已退款'}[os]||os;

  const body=`
    <div class="dr"><span class="dk">買家</span><span class="dv">${esc(o.member_email||'—')}</span></div>
    <div class="dr"><span class="dk">收件人</span><span class="dv">${esc(o.recipient_name||'—')} ${esc(o.recipient_phone||'')}</span></div>
    <div class="dr"><span class="dk">取貨方式</span><span class="dv">${delivery==='pickup'?'自取':'宅配'}</span></div>
    ${o.shipping_address?`<div class="dr"><span class="dk">地址</span><span class="dv">${esc(o.shipping_address)}</span></div>`:''}
    ${o.fulfillment_note?`<div class="dr"><span class="dk">備註</span><span class="dv">${esc(o.fulfillment_note)}</span></div>`:''}
    ${o.tracking_no?`<div class="dr"><span class="dk">物流單號</span><span class="dv">${esc(o.tracking_no)}</span></div>`:''}
    ${o.payment_last5?`<div class="dr"><span class="dk">帳號末5碼</span><span class="dv">${esc(o.payment_last5)}</span></div>`:''}
    <div class="dr"><span class="dk">付款狀態</span><span class="dv">${payChip(o)}</span></div>
    <div class="dr"><span class="dk">出貨狀態</span><span class="dv">${osLabel}</span></div>
    <div class="dr"><span class="dk">金額</span><span class="dv" style="font-size:17px;font-weight:900;color:var(--c-primary-dark)">${money(o.total_amount)}</span></div>
    <div class="dr"><span class="dk">下單時間</span><span class="dv">${fmt(o.created_at)}</span></div>`;

  let foot='';
  if(cl){
    foot='<div style="text-align:center;color:var(--c-muted);font-size:13px;padding:8px">此單已關閉</div>';
  }else if(rp&&S.isPlatform){
    foot=`<button class="btn btn-p btn-w" onclick="doConfirmPay('${id}')">✓ 確認已收款</button>
      <button class="btn btn-o btn-w" onclick="doRejectPay('${id}')">退回付款回報</button>
      <button class="btn btn-d btn-w" onclick="doRejectCancel('${id}')">退回並取消訂單</button>`;
  }else if(pd&&rr&&S.isPlatform){
    foot=`<button class="btn btn-red btn-w" onclick="doConfirmRefund('${id}',${Number(o.total_amount||0)})">確認整筆退款</button>`;
  }else if(pd){
    const acts=[];
    if(!['shipped','ready_pickup','completed'].includes(os))acts.push(`<button class="btn btn-p btn-w" onclick="doFulfill('${id}','processing')">開始處理</button>`);
    if(delivery==='pickup'&&!['ready_pickup','completed'].includes(os))acts.push(`<button class="btn btn-p btn-w" onclick="doFulfill('${id}','ready_pickup')">標記可取貨</button>`);
    if(delivery==='shipping'&&!['shipped','completed'].includes(os))acts.push(`<button class="btn btn-p btn-w" onclick="doFulfillShip('${id}')">填物流單號並出貨</button>`);
    if(['shipped','ready_pickup'].includes(os))acts.push(`<button class="btn btn-p btn-w" onclick="doFulfill('${id}','completed')">標記完成</button>`);
    if(S.isPlatform)acts.push(`<button class="btn btn-d btn-w" onclick="doAdminRefund('${id}',${Number(o.total_amount||0)})">辦理整筆退款</button>`);
    foot=acts.join('')||'<div style="text-align:center;color:var(--c-muted);font-size:13px">訂單已完成</div>';
  }else{
    foot='<div style="text-align:center;color:var(--c-muted);font-size:13px;padding:8px">等待買家付款</div>';
    if(S.isPlatform)foot+=`<button class="btn btn-d btn-w" onclick="doCancelOrder('${id}')">取消未付款訂單</button>`;
  }
  openPanel(`訂單 #${shortId}`,o.recipient_name||o.member_email||'',body,foot);
}

/* ── Order actions ── */
async function doConfirmPay(id){
  if(!confirm('確認已實際收到款項？'))return;
  try{await api('confirmGroupBuyOrderPayment',{orderId:id});toast('付款已確認 ✓');closePanel();await loadOrders()}catch(e){toast(e.message,true)}
}
async function doRejectPay(id){
  const note=prompt('退回原因：','付款資料尚未核對，請確認後重新回報。');
  if(note===null)return;
  try{await api('rejectGroupBuyPaymentReport',{sessionId:S.sid,orderId:id,note});toast('已退回');closePanel();await loadOrders()}catch(e){toast(e.message,true)}
}
async function doRejectCancel(id){
  const reason=prompt('退回並取消的原因（必填）：','');
  if(!reason||reason.trim().length<2){toast('請填寫原因',true);return}
  if(!confirm('確定退回並取消這筆訂單？'))return;

async function loadApply(){
  $('apply-content').innerHTML='<div class="loading">載入中…</div>';
  try{
    let m=[],p=[];
    if(S.isPlatform){
      const d=await api('groupBuyPromoterAdminData',{},'GET');
      S.applySessions=d.sessions||[];S.applyPromoters=d.promoters||[];
      m=(d.applications||[]).filter(a=>a.source_entry==='groupbuy_general'&&!a.source_session_id);
      p=(d.applications||[]).filter(a=>!m.includes(a));
    }else if(S.sid){
      const d=await api('sessionProductsAdmin',{sessionId:S.sid},'GET');
      p=d.applications||[];
    }
    S.applications={m,p};
    const pendAll=[...m,...p].filter(a=>a.status==='pending').length;
    ['cnt-apply','sdot-apply','mdot-apply'].forEach(id=>{
      const el=$(id);if(!el)return;
      if(id==='cnt-apply')el.textContent=pendAll;
      else el.style.display=pendAll>0?'':'none';
    });
    let html='';
    if(S.isPlatform){
      html+=`<div class="sec-t">通用團購主申請</div>`;
      html+=m.length?m.map(a=>applyCardHtml(a)).join(''):'<div class="empty" style="padding:20px"><div class="empty-t">目前沒有申請</div></div>';
      html+=`<div class="sec-t" style="margin-top:20px">原場次團購主申請</div>`;
    }
    html+=p.length?p.map(a=>applyCardHtml(a)).join(''):'<div class="empty" style="padding:20px"><div class="empty-t">目前沒有申請</div></div>';
    $('apply-content').innerHTML=html;
  }catch(e){$('apply-content').innerHTML=`<div class="empty"><div class="empty-t">載入失敗：${esc(e.message)}</div></div>`}
}

async function applyBatch(){
  const ids=[...document.querySelectorAll('.prod-ck:checked')].map(c=>c.dataset.id).filter(Boolean);
  if(!ids.length){toast('請先勾選商品',true);return}
  const price=$('bp_price')?.value,orig=$('bp_orig')?.value,cost=$('bp_cost')?.value,stock=$('bp_stock')?.value;
  const qt=readTiers('bq_tiers').map(t=>({minQty:t.minQty,unitPrice:t.price}));
  const pt=readTiers('bp_tiers').map(t=>({minQty:t.minQty,basePrice:t.price}));
  const hasBg=$('bp_bg')?.checked,bq=Number($('bp_bq')?.value||0),fq=Number($('bp_fq')?.value||0);
  if(!price&&!orig&&!cost&&!stock&&!qt.length&&!pt.length&&!hasBg){toast('請至少填一個要套用的欄位',true);return}
  if(!confirm(`套用到 ${ids.length} 件商品？`))return;
  let ok=0,fail=0;
  for(const id of ids){
    const b=PRODS.find(p=>p.id===id)||{};
    try{
      await api('saveSessionProduct',{sessionId:S.sid,id,status:b.status||'active',
        name:b.name||'',category:b.category||'',description:b.description||'',imageUrl:b.image_url||'',
        price:price?Number(price):Number(b.price||0),
        originalPrice:orig?Number(orig)||null:Number(b.original_price||0)||null,
        supplyCost:cost?Number(cost)||null:Number(b.supply_cost||0)||null,
        stockQty:stock?Number(stock):b.stock_qty,perMemberLimit:b.per_member_limit,
        quantityTiers:qt.length?qt:(b.quantity_tiers_json||[]).map(t=>({minQty:t.minQty,unitPrice:t.unitPrice||0})),
        promoterTiers:pt.length?pt:(b.default_promoter_tiers_json||[]).map(t=>({minQty:t.minQty,basePrice:t.basePrice||0})),
        buyGetEnabled:hasBg?$('bp_bg').checked:(b.buy_get_enabled||false),
        buyQty:hasBg&&bq?bq:(b.buy_qty||0),freeQty:hasBg&&fq?fq:(b.free_qty||0)
      });ok++;
    }catch(e){fail++}
  }
  toast(fail?`完成 ${ok}，失敗 ${fail}`:`✓ 已套用到 ${ok} 件商品`);
  await loadProducts();
}

let SESS_DATA=null;
async function loadSettings(){
  $('settings-content').innerHTML='<div class="loading">載入設定中…</div>';
  if(!S.sid){$('settings-content').innerHTML='<div class="empty"><div class="empty-t">請先選擇場次</div></div>';return}
  try{
    const d=await api('groupBuyAdminData',{},'GET');
    SESS_DATA=(d.sessions||[]).find(s=>s.id===S.sid)||null;
    renderSettings();
  }catch(e){$('settings-content').innerHTML=`<div class="empty"><div class="empty-t">載入失敗：${esc(e.message)}</div></div>`}
}
function renderSettings(){
  const s=SESS_DATA;if(!s)return;
  const g=s.groupBuySettings||{};
  $('settings-content').innerHTML=`
    <div style="max-width:600px">
      <div class="scard">
        <div class="scard-t">開放狀態</div>
        <label class="fcheck" style="margin-bottom:8px">
          <input type="checkbox" id="ss_open" ${s.status==='團購中'?'checked':''}> 開放購買
        </label>
        <p style="font-size:12px;color:var(--c-muted)">關閉後買家無法下新訂單，現有訂單不受影響</p>
      </div>
      <div class="scard">
        <div class="scard-t">買家配送設定</div>
        <div class="fgrid" style="margin-bottom:10px">
          <label class="fcheck"><input type="checkbox" id="ss_pickup" ${g.pickupEnabled!==false?'checked':''}> 自取</label>
          <label class="fcheck"><input type="checkbox" id="ss_ship" ${g.shippingEnabled!==false?'checked':''}> 宅配</label>
        </div>
        <div class="fgrid">
          <div class="ff"><label class="fl">運費 NT$</label><input class="fi" id="ss_fee" type="number" value="${Number(g.shippingFee||0)}"></div>
          <div class="ff"><label class="fl">免運門檻 NT$（0=不設）</label><input class="fi" id="ss_free" type="number" value="${Number(g.freeShippingThreshold||0)}"></div>
        </div>
      </div>
      <div class="scard">
        <div class="scard-t">團購主採購配送</div>
        <div class="fgrid" style="margin-bottom:10px">
          <label class="fcheck"><input type="checkbox" id="ss_pp" ${g.promoterPickupEnabled!==false?'checked':''}> 自取</label>
          <label class="fcheck"><input type="checkbox" id="ss_ps" ${g.promoterShippingEnabled!==false?'checked':''}> 宅配</label>
        </div>
        <div class="fgrid">
          <div class="ff"><label class="fl">採購運費 NT$</label><input class="fi" id="ss_pf" type="number" value="${Number(g.promoterShippingFee||0)}"></div>
          <div class="ff"><label class="fl">採購免運門檻 NT$</label><input class="fi" id="ss_pfr" type="number" value="${Number(g.promoterFreeShippingThreshold||0)}"></div>
        </div>
      </div>
      <div class="scard">
        <div class="scard-t">封面圖片</div>
        <p style="font-size:12px;color:var(--c-muted);margin-bottom:8px">多張圖片請用逗號或換行分隔</p>
        <textarea class="fi fi-ta" id="ss_covers">${esc((g.coverImages||[]).join(',\n'))}</textarea>
      </div>
      <div class="scard" style="background:var(--c-pink)">
        <div style="font-size:13px;color:#8B3330"><strong>安全提醒：</strong>團購主申請必須人工審核，採購價顯示需本人主動切換。這些限制已從程式碼層面鎖定，無法透過設定開啟自動通過。</div>
      </div>
      <button class="btn btn-p" onclick="saveSettings()">儲存設定</button>
    </div>`;
}
async function saveSettings(){
  if(!S.sid)return;
  const covers=($('ss_covers')?.value||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const btn=document.querySelector('#settings-content .btn-p');
  if(btn){btn.disabled=true;btn.textContent='儲存中…'}
  try{
    await api('saveGroupBuy',{
      sessionId:S.sid,
      isOpen:$('ss_open')?.checked||false,
      pickupEnabled:$('ss_pickup')?.checked||false,
      shippingEnabled:$('ss_ship')?.checked||false,
      shippingFee:Number($('ss_fee')?.value||0),
      freeShippingThreshold:Number($('ss_free')?.value||0),
      promoterPickupEnabled:$('ss_pp')?.checked||false,
      promoterShippingEnabled:$('ss_ps')?.checked||false,
      promoterShippingFee:Number($('ss_pf')?.value||0),
      promoterFreeShippingThreshold:Number($('ss_pfr')?.value||0),
      coverImages:covers,
      promoterAutoApprove:false // 永遠鎖定為 false
    });
    toast('設定已儲存 ✓');await loadSettings();
  }catch(e){toast(e.message,true)}
  if(btn){btn.disabled=false;btn.textContent='儲存設定'}
}

/* ── More ── */
function loadMore(){
  $('more-content').innerHTML=`
    <div class="scard" style="max-width:480px;cursor:pointer" onclick="loadPayouts()">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:24px">💰</span>
        <div><div style="font-weight:800;font-size:15px">分潤結算申請</div>
          <div style="font-size:13px;color:var(--c-muted)">查看並處理結算申請</div></div>
        <span style="margin-left:auto;color:var(--c-muted)">›</span>
      </div>
    </div>
    <div class="scard" style="max-width:480px;cursor:pointer;margin-top:8px" onclick="window.open('groupbuy.html','_blank')">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:24px">🏪</span>
        <div><div style="font-weight:800;font-size:15px">查看前台</div>
          <div style="font-size:13px;color:var(--c-muted)">開啟 groupbuy.html 前台</div></div>
        <span style="margin-left:auto;color:var(--c-muted)">↗</span>
      </div>
    </div>`;
}
async function loadPayouts(){
  try{
    const d=await api('getGroupBuyPayoutRequests',{},'GET');
    const rows=d.requests||d||[];
    if(!rows.length){toast('目前沒有結算申請');return}
    const body=rows.map(r=>`
      <div class="dr"><span class="dk">${esc(r.promoter_name||r.member_email||'')}</span>
      <span class="dv">${money(r.amount)} <span class="chip chip-${r.status==='paid'?'green':r.status==='approved'?'blue':'yellow'}">${{requested:'待審核',approved:'核准',paid:'已匯款'}[r.status]||r.status}</span></span></div>`).join('');
    openPanel('分潤結算申請','',body,'');
  }catch(e){toast(e.message,true)}
}

/* ── Refresh ── */
async function refreshAll(){
  if(!S.sid)return;
  toast('更新中…');
  try{await loadOrders();await loadApply();toast('已更新 ✓')}catch(e){toast(e.message,true)}
}

/* ── Start app ── */
async function startApp(adminData){
  $('login').style.display='none';
  $('app').classList.add('show');
  S.sessions=adminData.sessions||[];
  S.isPlatform=S.role==='platform_super_admin';
  if(!S.sessions.length){
    $('sessionPicker').innerHTML='<option>無可用場次</option>';
    return;
  }
  S.sid=S.sessions[0].id;
  $('sessionPicker').innerHTML=S.sessions.map(s=>
    `<option value="${esc(s.id)}"${s.id===S.sid?' selected':''}>${esc(s.name)}</option>`).join('');
  const n=S.name||S.email;
  const up=$('userPill');if(up)up.textContent=`登出 (${n.split('@')[0]})`;
  updateSubtitle();
  await Promise.all([loadOrders(),loadApply()]);
}

/* ── Boot ── */
async function boot(){
  const tok=localStorage.getItem(TK);
  if(!tok){$('login').style.display='flex';return}
  S.token=tok;
  try{
    const d=await api('groupBuyAdminData',{},'GET');
    S.role=d.authorization?.role||'session_admin';
    S.email=d.authorization?.email||'';
    S.name=d.authorization?.name||S.email;
    await startApp(d);
  }catch(e){
    localStorage.removeItem(TK);
    $('login').style.display='flex';
    $('lerr').textContent='登入已過期，請重新登入';
  }
}
boot();
</script>
</body>
</html>
