<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store">
<title>團GO 後台</title>
<style>
:root{
  --bg:#F8F6F0; --paper:#fff; --ink:#1f1f1f; --muted:#6f6f6f; --line:#E8DFD4;
  --green:#DDEAD1; --yellow:#FAEEC7; --blue:#D9E5EE; --pink:#FAE1DD; --purple:#DCD7ED;
  --mint:#D4E3DD; --main:#82ABA3; --main2:#628E87; --danger:#C8645D;
  --shadow:0 12px 30px rgba(45,39,32,.08); --shadow2:0 18px 48px rgba(45,39,32,.16);
  --card:#fff; --text:#1f1f1f; --r:14px;
  --hdr:56px; --nav:calc(60px + env(safe-area-inset-bottom,0px));
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior:none}
button,input,select,textarea{font:inherit}
img{display:block;max-width:100%}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ── Login ── */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#fff 0%,var(--bg) 42%,var(--blue) 100%)}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-badge{width:64px;height:64px;background:linear-gradient(135deg,var(--main),var(--main2));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px}
.login-title{font-size:22px;font-weight:900;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-google:active{background:#F8FAFC}
.login-err{color:var(--red);font-size:13px;margin-top:14px;min-height:18px}

/* ── App Shell ── */
#app{display:flex;flex-direction:column;min-height:100dvh}
header{background:rgba(248,246,240,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-shrink:0}.hdr-in{max-width:1180px;margin:0 auto;padding:0 14px;height:var(--hdr);display:flex;align-items:center;gap:10px}
.hdr-logo{color:var(--ink);font-size:18px;font-weight:900;letter-spacing:-.5px;flex-shrink:0}
.hdr-session{flex:1;min-width:0}
#sessionPicker{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px;font-weight:600;width:100%;max-width:200px;cursor:pointer}

.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.icon-btn:active{background:var(--green)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy)}
.badge.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0)}}

/* ── Main ── */
#main{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 30px)}
.tab{display:none;padding:14px 14px 0}.tab-inner{max-width:1180px;margin:0 auto}
.tab.active{display:block}

/* ── Summary Cards ── */
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum-card{background:var(--paper);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.sum-card:active{transform:scale(.97)}
.sum-num{font-size:28px;font-weight:900;line-height:1;margin-bottom:4px}
.sum-label{font-size:12px;color:var(--muted);font-weight:600}
.sum-card.s-amber .sum-num{color:#B99745}
.sum-card.s-blue .sum-num{color:#628E87}
.sum-card.s-purple .sum-num{color:#7B6AA8}
.sum-card.s-green .sum-num{color:var(--main2)}

/* ── Revenue Card ── */
.rev-card{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.rev-title{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px}
.rev-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.rev-row:last-child{border:none;font-weight:800;font-size:15px}
.rev-val{font-weight:700;font-variant-numeric:tabular-nums}

/* ── Section heading ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.section-hd h3{font-size:15px;font-weight:800}
.section-hd .see-all{font-size:13px;color:var(--green);font-weight:700;border:none;background:none;padding:4px 0;cursor:pointer}

/* ── Order Cards ── */
.order-card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.order-card:active{transform:scale(.99)}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.order-id{font-size:12px;color:var(--muted);font-family:monospace}
.order-name{font-size:15px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip-amber{background:var(--yellow);color:#7A5C00}
.chip-green{background:var(--green);color:#2b5f24}
.chip-red{background:var(--pink);color:#8B3330}
.chip-blue{background:var(--blue);color:#2a4a70}
.chip-purple{background:var(--purple);color:#5B21B6}
.chip-gray{background:#F4F0EA;color:var(--muted)}
.order-meta{font-size:13px;color:var(--muted);line-height:1.6}
.order-amount{font-size:18px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}

/* ── Urgent banner ── */
.urgent-bar{background:var(--yellow);border:1px solid #d5bd77;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:14px;font-weight:700;color:#7A5C00;display:flex;align-items:center;gap:8px}

/* ── Filter Bar ── */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.f-chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.15s;flex-shrink:0}
.f-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── Apply Cards ── */
.apply-card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.apply-card:active{transform:scale(.99)}
.apply-name{font-size:16px;font-weight:800}
.apply-meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.55}
.apply-session{font-size:12px;font-weight:700;color:var(--blue);margin-top:4px}

/* ── Promoter Cards ── */
.promo-card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.promo-avatar{width:44px;height:44px;border-radius:50%;background:var(--green-lt);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--main2);flex-shrink:0}
.promo-info{flex:1;min-width:0}
.promo-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-handle{font-size:13px;color:var(--muted)}
.promo-session{font-size:12px;color:var(--blue);font-weight:700;margin-top:2px}

/* ── Empty State ── */
.empty{text-align:center;padding:44px 24px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-text{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.empty-sub{font-size:14px}

/* ── Loading ── */
.loading{text-align:center;padding:36px 24px;color:var(--muted);font-size:14px}

/* ── Bottom Nav ── */
#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 20px));height:60px;background:rgba(221,234,209,.97);backdrop-filter:blur(12px);border:1px solid #b9cfae;border-radius:24px;display:flex;z-index:20;box-shadow:var(--shadow2);padding:8px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);cursor:pointer;position:relative;padding:4px 0;border-radius:16px}
.nav-btn.active{color:var(--main2);background:rgba(255,255,255,.6)}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:11px;font-weight:700}
.nav-btn.active .nav-icon,.nav-btn.active .nav-label{color:var(--main2)}
.nav-dot{position:absolute;top:6px;right:calc(50% - 14px);width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff}

/* ── Bottom Sheet Modal ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
#overlay.show{opacity:1}
#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:min(580px,100vw);background:#fff;border-radius:20px 20px 0 0;z-index:50;max-height:90dvh;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,0,.67,0);padding-bottom:var(--safe-b)}
#sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:40px;height:4px;background:#D1D5DB;border-radius:2px;margin:12px auto 8px;flex-shrink:0}
#sheet-head{padding:0 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.sh-title{font-size:18px;font-weight:900}
.sh-sub{font-size:13px;color:var(--muted);margin-top:2px}
#sheet-body{overflow-y:auto;flex:1;padding:16px 18px}
#sheet-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* ── Detail Lines ── */
.detail-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14px}
.detail-row:last-child{border:none}
.detail-key{color:var(--muted);font-weight:600;flex-shrink:0}
.detail-val{font-weight:700;text-align:right;word-break:break-all}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;transition:.15s}
.btn:active{opacity:.85}
.btn-green{background:var(--main);color:#fff}
.btn-red{background:var(--danger);color:#fff}
.btn-amber{background:#B99745;color:#fff}
.btn-blue{background:var(--main2);color:#fff}
.btn-outline{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:10px 14px;font-size:14px;width:auto}
.btn-danger-outline{background:#fff;color:var(--danger);border:1.5px solid var(--danger)}

/* ── Form fields in sheet ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--main)}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

/* ── User Menu ── */
#userMenu{position:fixed;top:calc(var(--hdr) + 6px);right:14px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:30;min-width:180px;overflow:hidden}
.um-item{display:block;width:100%;text-align:left;padding:14px 18px;border:none;background:none;font-size:15px;font-weight:700;cursor:pointer;border-bottom:1px solid var(--line)}
.um-item:last-child{border:none;color:var(--red)}
.um-item:active{background:var(--bg)}
.um-name{padding:14px 18px 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}

/* ── More Tab ── */
.more-section{margin-bottom:16px}
.more-section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.more-row{background:var(--paper);border-radius:var(--r);margin-bottom:2px;cursor:pointer;transition:.1s}
.more-row:active{background:var(--bg)}
.more-row-inner{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.more-row:last-child .more-row-inner{border:none}
.more-row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.more-row-label{font-size:15px;font-weight:700;flex:1}
.more-row-arrow{color:var(--muted);font-size:18px}

/* ── Add Promoter Search ── */
.member-result{background:var(--bg);border-radius:10px;padding:12px;margin-top:8px;cursor:pointer;border:1.5px solid var(--line)}
.member-result:active{background:var(--line)}
.member-result-name{font-weight:800;font-size:15px}
.member-result-email{font-size:13px;color:var(--muted)}

/* ── Payout Cards ── */
.payout-card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.payout-amount{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--main2)}
.payout-meta{font-size:13px;color:var(--muted);margin-top:4px}


/* ── 電腦版側邊導覽 ── */
@media(min-width:900px){
  #app{flex-direction:column}
  #appBody{display:flex;flex:1;overflow:hidden}
  .sidebar{
    width:220px;flex-shrink:0;
    background:var(--paper);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    height:calc(100dvh - var(--hdr));
    position:sticky;top:var(--hdr);
    overflow-y:auto;padding:12px 8px;gap:2px
  }
  .sb-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:10px;
    border:none;background:none;
    font-size:14px;font-weight:700;color:var(--muted);
    cursor:pointer;width:100%;text-align:left;position:relative
  }
  .sb-item:hover{background:var(--bg)}
  .sb-item.active{background:var(--green);color:var(--ink)}
  .sb-item .sb-icon{font-size:18px;width:24px;text-align:center}
  .sb-dot{position:absolute;top:8px;right:10px;width:8px;height:8px;background:var(--danger);border-radius:50%}
  .sb-section{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:14px 14px 4px}
  #nav{display:none!important}
  #main{flex:1;overflow-y:auto;padding-bottom:20px;min-width:0}
  .tab{padding:20px 28px 0}
  .tab-inner{max-width:1200px;margin:0 auto}
  #sheet{width:min(560px,90vw)}
  .summary-row{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1200px){
  .sidebar{width:240px}
  .tab{padding:24px 36px 0}
}

@media(min-width:768px){
  .summary-row{grid-template-columns:repeat(4,1fr)}
  .tab{padding:20px 24px 0}
  #sheet{width:min(580px,96vw)}
}
@media(min-width:1024px){
  .tab{padding:24px 40px 0}
}
}
</style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="login">
  <div class="login-card">
    <img src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO" style="width:80px;height:80px;object-fit:contain;border-radius:16px;margin:0 auto 12px;display:block">
    <h1 class="login-title">後台管理</h1>
    <p class="login-sub">場次管理員 / 平台管理員登入</p>
    <div class="field" style="margin-bottom:12px">
      <label style="display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com"
        style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label style="display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px">手機號碼</label>
      <input id="loginPhone" type="tel" autocomplete="tel" placeholder="0912345678" inputmode="tel"
        style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px">
    </div>
    <button onclick="doLogin()" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--main);color:#fff;font-size:16px;font-weight:800;cursor:pointer">登入管理後台</button>
    <div id="loginErr" class="login-err"></div>
    <div style="text-align:center;padding:8px;font-size:11px;color:var(--muted)">www.2b-Love.com　兔彼樂共創活動</div>
  </div>
</div>

<!-- ── App ── -->
<div id="app" hidden>
  <header>
    <img src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO" style="height:36px;object-fit:contain;border-radius:8px;flex-shrink:0">
    <div class="hdr-session">
      <select id="sessionPicker" onchange="onSessionChange()">
        <option>載入中…</option>
      </select>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" onclick="refreshAll()" title="重新整理">↻</button>
      <button class="icon-btn" id="userBtn" onclick="toggleUserMenu()">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20"><path d="M10 10a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v1h16v-1c0-2.21-3.58-4-8-4z"/></svg>
      </button>
    </div>
  </header>

  
  <div id="appBody" style="display:flex;flex:1;overflow:hidden">
  <aside class="sidebar">
    <div class="sb-section">場次</div>
    <div style="padding:4px 8px 10px">
      <select id="sessionPickerSB" onchange="onSessionChange(this)" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:700;background:var(--paper)">
        <option>載入中…</option>
      </select>
    </div>
    <div class="sb-section">導覽</div>
    <button class="sb-item active" id="sb-home" onclick="goTab('home')">
      <span class="sb-icon">⌂</span> 首頁
      <span id="sbOrderDot" class="sb-dot" style="display:none"></span>
    </button>
    <button class="sb-item" id="sb-orders" onclick="goTab('orders')">
      <span class="sb-icon">☰</span> 訂單管理
      <span id="sbOrderDot2" class="sb-dot" style="display:none"></span>
    </button>
    <button class="sb-item" id="sb-apply" onclick="goTab('apply')">
      <span class="sb-icon">✎</span> 申請審核
      <span id="sbApplyDot" class="sb-dot" style="display:none"></span>
    </button>
    <button class="sb-item" id="sb-products" onclick="goTab('products')">
      <span class="sb-icon">📦</span> 商品管理
    </button>
    <button class="sb-item" id="sb-more" onclick="goTab('more')">
      <span class="sb-icon">≡</span> 其他管理
    </button>
    <div style="flex:1"></div>
    <button class="sb-item" onclick="doLogout()" style="color:var(--danger)">
      <span class="sb-icon">🚪</span> 登出
    </button>
  </aside>
  <main id="main">
    <!-- 首頁 Tab -->
    <div id="t-home" class="tab active"><div class="tab-inner">
      <div id="urgentBar"></div>
      <div class="summary-row" id="summaryRow">
        <div class="sum-card s-amber" onclick="goTab('orders');filterOrders('reported')">
          <div class="sum-num num" id="cntPay">—</div>
          <div class="sum-label">待確認付款</div>
        </div>

          <div class="sum-label">待出貨</div>

        <div class="sum-card s-purple" onclick="goTab('apply')">

      <span class="nav-icon">⌂</span>

      <span class="nav-icon">☰</span>

  <div id="sheetFoot" class="sheet-foot"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

/* ── Config ── */
const API = location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname)
  ? location.origin+'/s/api'
  : 'https://2bl-v7.ndiangrace.workers.dev';
const TENANT = 'tuibile';
const SESSION_KEY = '2bl_member_token'; // 與 groupbuy.html 共用同一個 token
const TENANT_KEY  = '2bl_admin_tenant';

/* ── State ── */
const S = {
  email:'', token:'', role:'', name:'',
  authorization: null,
  isPlatform: false,
  sessions: [],
  currentSid: '',
  orders: [],
  applications: { managers:[], promoters:[] },
  promoters: [],
  payouts: [],
  activeFilter: 'all',
  activeTab: 'home',
};

/* ── API Helpers ── */
async function get(action, extra={}) {
  const params = new URLSearchParams({ action, tenant:TENANT, memberToken:S.token||'', _t:Date.now(), ...extra });
  const r = await fetch(`${API}?${params}`, {cache:'no-store'});
  const j = await r.json().catch(()=>({error:'回應格式錯誤'}));
  if (j.error) throw new Error(j.error);
  return j;
}
async function post(action, body={}) {
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, tenant:TENANT, memberToken:S.token||'', ...body }), cache:'no-store' });
  const j = await r.json().catch(()=>({error:'回應格式錯誤'}));
  if (j.error) throw new Error(j.error);
  return j;
}

/* ── Auth ── */




function saveSession(s) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({...s, savedAt:Date.now()}));
  applySession(s);
}

function readSession() {
  try {
    const v = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if (!v || Date.now()-Number(v.savedAt||0) > 8*3600*1000) return null;
    return v;
  } catch { return null; }
}

function applySession(s) {
  S.email = s.email; S.token = s.token; S.role = s.role||''; S.name = s.name||s.email;
  S.authorization = s.authorization||null;
  S.isPlatform = S.role === 'platform_super_admin';
  // Also check authorization.role if available (groupBuyAdminData response)
  if (s.authorization?.role) {
    S.role = s.authorization.role;
    S.isPlatform = S.role === 'platform_super_admin';
  }
  document.getElementById('umName').textContent = S.name;
}

function doLogout() {
  post('adminLogout').catch(()=>{});
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

function showLoginErr(msg) {
  document.getElementById('loginErr').textContent = msg||'登入失敗';
}

/* ── Helpers ── */
function esc(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) { return 'NT$ '+Number(n||0).toLocaleString(); }
function fmt(d) { if(!d) return '—'; return new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }

/* ── Session Picker ── */
function buildSessionPicker() {
  const opts = S.sessions.length
    ? S.sessions.map(s=>`<option value="${esc(s.id)}" ${s.id===S.currentSid?'selected':''}>${esc(s.name)}</option>`).join('')
    : '<option>無可用場次</option>';
  ['sessionPicker','sessionPickerSB'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = opts;
  });
  if (!S.currentSid && S.sessions[0]) S.currentSid = S.sessions[0].id;
  const pick_unused = null; if(pick_unused){
  pick.innerHTML = S.sessions.length
    ? S.sessions.map(s=>`<option value="${esc(s.id)}" ${s.id===S.currentSid?'selected':''}>${esc(s.name)}</option>`).join('')
    : '<option>無可用場次</option>';
  if (!S.currentSid && S.sessions[0]) S.currentSid = S.sessions[0].id;
}
function onSessionChange(src_el) {
  const val = src_el?.value || document.getElementById('sessionPicker')?.value || document.getElementById('sessionPickerSB')?.value;
  S.currentSid = val;
  // sync both pickers
  ['sessionPicker','sessionPickerSB'].forEach(id => {
    const el = document.getElementById(id);
    if(el && el.value !== val) el.value = val;
  });
  S.orders = [];
  loadOrders();
  updateHome();
}

/* ── Tab System ── */
function goTab(name) {
  ['home','orders','apply','products','more'].forEach(t => {
    const tab = document.getElementById('t-'+t);
    if (tab) tab.classList.toggle('active', t===name);
    const nb = document.getElementById('nb-'+t);
    if (nb) nb.classList.toggle('active', t===name);
    // sync sidebar items
    const sb = document.getElementById('sb-'+t);
    if (sb) sb.classList.toggle('active', t===name);
  });
  S.activeTab = name;
  if (name === 'orders') { if (!S.orders.length) { loadOrders(); } else { renderFilteredOrders(); } }
  if (name === 'apply') loadApplications();
  if (name === 'products') loadProductsTab();
  if (name === 'more') renderMore();
}

async function loadProductsTab() {
  const el = document.getElementById('productsContent');
  if (!el) return;
  if (!S.currentSid) { el.innerHTML='<div class="empty"><div class="empty-sub">請先選擇場次</div></div>'; return; }
  el.innerHTML = '<div class="loading">載入商品中…</div>';
  try {
    const d = await get('sessionProductsAdmin', {sessionId: S.currentSid});
    S_PRODUCTS = d.products||[];
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:16px;font-weight:900">商品管理 <span style="font-size:13px;color:var(--muted);font-weight:600">${S_PRODUCTS.length} 件</span></div>
      ${S.isPlatform ? '<button class="btn btn-green btn-sm" onclick="openAddProductModal()">＋ 新增商品</button>' : ''}
    </div>`;
    el.innerHTML += renderProductsHTML();
  } catch(e) {
    el.innerHTML = '<div class="empty"><div class="empty-sub">' + esc(e.message) + '</div></div>';
  }
}

function renderProductsHTML() {
  if (!S_PRODUCTS.length) return '<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">尚無商品</div></div>';
  const batchPanel = S.isPlatform ? renderBatchPanel() : '';
  const rows = S_PRODUCTS.map(p => `
    <div style="background:var(--paper);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--line)">
      <div style="display:flex;align-items:flex-start;gap:10px">
        ${S.isPlatform ? '<input type="checkbox" class="prod-chk" data-id="'+esc(p.id)+'" onchange="updateSelectedCount()" style="margin-top:3px;width:18px;height:18px;flex-shrink:0;cursor:pointer">' : ''}
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="font-size:15px;font-weight:800">${esc(p.name||'未命名')}</div>
            ${S.isPlatform ? '<button onclick="openEditProductModal(''+esc(p.id)+'')" style="padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">編輯</button>' : ''}
          </div>
          <div style="font-size:14px;font-weight:700;color:var(--main2);margin:5px 0">
            NT$${Number(p.price||0).toLocaleString()}
            ${p.original_price ? '<s style="color:var(--muted);font-size:12px;font-weight:400;margin-left:4px">原 '+Number(p.original_price).toLocaleString()+'</s>' : ''}
            ${p.buy_get_enabled ? '<span style="font-size:12px;background:var(--blue);border-radius:6px;padding:2px 7px;margin-left:4px">買'+p.buy_qty+'送'+p.free_qty+'</span>' : ''}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:5px">庫存：${p.stock_qty!=null?p.stock_qty:'無限制'}${p.per_member_limit?' · 每人上限'+p.per_member_limit:''} · 分類：${esc(p.category||'—')}</div>
          ${(p.quantity_tiers_json||[]).length ? '<div style="margin:3px 0"><span style="font-size:11px;color:var(--muted);font-weight:700">買家級距：</span>'+tierHtml(p.quantity_tiers_json,'unitPrice')+'</div>' : ''}
          ${(p.default_promoter_tiers_json||[]).length ? '<div style="margin:3px 0"><span style="font-size:11px;color:var(--muted);font-weight:700">團購主採購：</span>'+tierHtml(p.default_promoter_tiers_json,'basePrice')+'</div>' : ''}
        </div>
      </div>
    </div>`).join('');
  return batchPanel + rows;
}

/* ── Toast ── */
let _toastTimer;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 3000);
}

/* ── Modal (Bottom Sheet) ── */
function openModal(title, sub, bodyHtml, footHtml) {
  document.getElementById('sheetHead').innerHTML = `<div class="sh-title">${esc(title)}</div>${sub?`<div class="sh-sub">${esc(sub)}</div>`:''}`;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetFoot').innerHTML = footHtml;
  const ov = document.getElementById('overlay');
  const sh = document.getElementById('sheet');
  ov.hidden = false; sh.hidden = false;
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
}
function closeModal() {
  const ov = document.getElementById('overlay'), sh = document.getElementById('sheet');
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(()=>{ ov.hidden=true; sh.hidden=true; }, 300);
}

/* ── Status Helpers ── */
function payChip(order) {
  const ps = String(order.payment_status||'').toLowerCase();
  const rs = String(order.refund_status||'').toLowerCase();
  const os = String(order.order_status||'').toLowerCase();
  if (['cancelled','已取消'].includes(os)||ps==='cancelled') return '<span class="chip chip-gray">已取消</span>';
  if (os==='refunded'||rs==='refunded') return '<span class="chip chip-gray">已退款</span>';
  if (rs==='requested') return '<span class="chip chip-red">申請退款</span>';
  if (ps==='paid'||ps==='已付款') return '<span class="chip chip-green">已付款</span>';
  if (ps==='reported'||ps==='已回報') return '<span class="chip chip-amber">待確認</span>';
  return '<span class="chip chip-gray">待付款</span>';
}
function fulfillChip(order) {
  const m = {pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成'};
  const os = String(order.order_status||'pending');
  const label = m[os.toLowerCase()]||os;
  if (['shipped','ready_pickup'].includes(os.toLowerCase())) return `<span class="chip chip-blue">${label}</span>`;
  if (os.toLowerCase()==='completed') return `<span class="chip chip-green">${label}</span>`;
  if (['cancelled','refunded'].includes(os.toLowerCase())) return '';
  return `<span class="chip chip-gray">${label}</span>`;
}
function isClosed(o) {
  const os = String(o.order_status||'').toLowerCase();
  return ['cancelled','refunded','void','已取消','已退款'].includes(os) || String(o.payment_status||'').toLowerCase()==='cancelled';
}
function isPaid(o) { return ['paid','已付款'].includes(String(o.payment_status||'').toLowerCase()); }
function isReported(o) { return ['reported','已回報'].includes(String(o.payment_status||'').toLowerCase()); }

/* ── Home Tab ── */
async function updateHome() {
  const sid = S.currentSid;
  const ses = S.sessions.find(s=>s.id===sid)||{};

  // Revenue card (platform only)
  const rc = document.getElementById('revCard');
  if (S.isPlatform && (ses.paidTotalAmount||0) > 0) {
    rc.classList.remove('hidden');
    rc.innerHTML = `<div class="rev-title">${esc(ses.name||'本場')} 付款收入</div>
      <div class="detail-row"><span class="detail-key">商品收入</span><span class="detail-val">${money(ses.paidProductAmount)}</span></div>
      <div class="detail-row"><span class="detail-key">運費收入</span><span class="detail-val">${money(ses.paidShippingAmount)}</span></div>
      <div class="detail-row"><span class="detail-key">訂單實收</span><span class="detail-val num" style="font-size:17px;color:var(--main2)">${money(ses.paidTotalAmount)}</span></div>`;
  } else { rc.classList.add('hidden'); }

  // Summary counts
  let reportedCnt=0, shipCnt=0;
  if (S.orders.length) {
    reportedCnt = S.orders.filter(o=>!isClosed(o)&&isReported(o)).length;
    shipCnt = S.orders.filter(o=>!isClosed(o)&&isPaid(o)&&!['shipped','ready_pickup','completed'].includes(String(o.order_status||'').toLowerCase())&&!String(o.refund_status||'')).length;
  }
  document.getElementById('cntPay').textContent = reportedCnt;
  document.getElementById('cntShip').textContent = shipCnt;

  // Urgent bar
  const ub = document.getElementById('urgentBar');
  ub.innerHTML = reportedCnt > 0
    ? `<div class="urgent-bar">🔔 有 ${reportedCnt} 筆付款回報待確認</div>`
    : '';

  // Order dots
  document.getElementById('orderDot').classList.toggle('hidden', reportedCnt===0);
  document.getElementById('applyDot').classList.toggle('hidden',
    (S.applications.managers.filter(a=>a.status==='pending').length + S.applications.promoters.filter(a=>a.status==='pending').length) === 0);

  // Apply count
  const pendingApply = (S.applications.managers||[]).filter(a=>a.status==='pending').length
    + (S.applications.promoters||[]).filter(a=>a.status==='pending').length;
  document.getElementById('cntApply').textContent = pendingApply;

  // Recent orders
  renderOrderList('recentList', S.orders.slice(0,5), true);
}

/* ── Orders Tab ── */
async function loadOrders() {
  if (!S.currentSid) { document.getElementById('orderList').innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">請先選擇場次</div></div>'; return; }
  document.getElementById('orderList').innerHTML = '<div class="loading">載入訂單中…</div>';
  document.getElementById('recentList').innerHTML = '<div class="loading">載入中…</div>';
  try {
    const d = await get('getGroupBuySessionOrders', { sessionId: S.currentSid });
    S.orders = d.orders||[];
    renderFilteredOrders();
    updateHome();
  } catch(e) {
    document.getElementById('orderList').innerHTML = `<div class="empty"><div class="empty-text">載入失敗</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

function filterOrders(f) {
  S.activeFilter = f;
  document.querySelectorAll('.f-chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  renderFilteredOrders();
}

function renderFilteredOrders() {
  const f = S.activeFilter;
  let rows = S.orders;
  if (f==='reported') rows = rows.filter(o=>!isClosed(o)&&isReported(o));
  else if (f==='unpaid') rows = rows.filter(o=>!isClosed(o)&&!isPaid(o)&&!isReported(o));
  else if (f==='paid') rows = rows.filter(o=>!isClosed(o)&&isPaid(o)&&!String(o.refund_status||''));
  else if (f==='shipping') rows = rows.filter(o=>!isClosed(o)&&isPaid(o)&&['processing','shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase()));
  else if (f==='done') rows = rows.filter(o=>String(o.order_status||'').toLowerCase()==='completed');
  else if (f==='closed') rows = rows.filter(o=>isClosed(o));
  renderOrderList('orderList', rows, false);
}

function renderOrderList(elId, rows, compact=false) {
  const el = document.getElementById(elId);
  if (!rows.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">沒有符合的訂單</div></div>`; return; }
  el.innerHTML = rows.map(o => {
    const delivery = o.fulfillment_type==='pickup'?'自取':'宅配';
    const name = esc(o.recipient_name||o.member_email||'訂單');
    const shortId = String(o.id||'').slice(-8).toUpperCase();
    return `<div class="order-card" onclick="openOrderModal('${esc(o.id)}')">
      <div class="order-head">
        <div>
          <div class="order-id">#${shortId}</div>
          <div class="order-name">${name}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${payChip(o)}${compact?'':fulfillChip(o)}</div>
      </div>
      <div class="order-meta">${esc(fmt(o.created_at))} · ${delivery}${o.tracking_no?` · ${esc(o.tracking_no)}`:''}</div>
      <div class="order-amount">${money(o.total_amount)}</div>
    </div>`;
  }).join('');
}

function openOrderModal(orderId) {
  const o = S.orders.find(x=>x.id===orderId);
  if (!o) return;
  const closed = isClosed(o);
  const paid = isPaid(o);
  const reported = isReported(o);
  const refundReq = String(o.refund_status||'').toLowerCase()==='requested';
  const shortId = String(o.id||'').slice(-8).toUpperCase();
  const osLabel = {pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成',cancelled:'已取消',refunded:'已退款'}[String(o.order_status||'pending').toLowerCase()]||o.order_status||'待處理';

  const body = `
    <div class="detail-row"><span class="detail-key">訂單編號</span><span class="detail-val" style="font-size:12px;font-family:monospace">${esc(o.id||'')}</span></div>
    <div class="detail-row"><span class="detail-key">買家</span><span class="detail-val">${esc(o.member_email||'')}</span></div>
    <div class="detail-row"><span class="detail-key">收件人</span><span class="detail-val">${esc(o.recipient_name||'—')} ${esc(o.recipient_phone||'')}</span></div>
    <div class="detail-row"><span class="detail-key">取貨方式</span><span class="detail-val">${o.fulfillment_type==='pickup'?'現場自取':'宅配'}</span></div>
    ${o.shipping_address?`<div class="detail-row"><span class="detail-key">地址</span><span class="detail-val">${esc(o.shipping_address)}</span></div>`:''}
    ${o.fulfillment_note?`<div class="detail-row"><span class="detail-key">備註</span><span class="detail-val">${esc(o.fulfillment_note)}</span></div>`:''}
    ${o.tracking_no?`<div class="detail-row"><span class="detail-key">物流單號</span><span class="detail-val">${esc(o.tracking_no)}</span></div>`:''}
    <div class="detail-row"><span class="detail-key">付款狀態</span><span class="detail-val">${payChip(o)}</span></div>
    <div class="detail-row"><span class="detail-key">出貨狀態</span><span class="detail-val">${osLabel}</span></div>
    ${o.payment_last5?`<div class="detail-row"><span class="detail-key">帳號末5碼</span><span class="detail-val">${esc(o.payment_last5)}</span></div>`:''}
    <div class="detail-row"><span class="detail-key">金額</span><span class="detail-val" style="font-size:18px;font-weight:900;color:var(--main2)">${money(o.total_amount)}</span></div>
    <div class="detail-row"><span class="detail-key">建立時間</span><span class="detail-val">${fmt(o.created_at)}</span></div>`;

  // Foot actions
  let foot = '';
  if (closed) {
    foot = `<div style="text-align:center;color:var(--muted);font-size:14px;padding:8px">此單已關閉，無法再操作</div>`;
  } else if (reported && S.isPlatform) {
    foot = `<button class="btn btn-green" onclick="doConfirmPayment('${orderId}')">✓ 確認已收款</button>
      <button class="btn btn-outline" onclick="doRejectPayment('${orderId}')">退回回報</button>
      <button class="btn btn-danger-outline" onclick="doRejectAndCancel('${orderId}')">退回並取消訂單</button>`;
  } else if (paid && refundReq && S.isPlatform) {
    foot = `<button class="btn btn-red" onclick="doConfirmRefund('${orderId}',${Number(o.total_amount||0)})">確認整筆退款</button>`;
  } else if (paid && !refundReq) {
    const os = String(o.order_status||'pending').toLowerCase();
    const delivery = String(o.fulfillment_type||'').toLowerCase();
    const next = [];
    if (!['shipped','ready_pickup','completed'].includes(os)) next.push(`<button class="btn btn-blue" onclick="doFulfill('${orderId}','processing','')">開始處理</button>`);
    if (delivery==='pickup'&&!['ready_pickup','completed'].includes(os)) next.push(`<button class="btn btn-green" onclick="doFulfill('${orderId}','ready_pickup','')">標記可取貨</button>`);
    if (delivery==='shipping'&&!['shipped','completed'].includes(os)) next.push(`<button class="btn btn-blue" onclick="doFulfillShipped('${orderId}')">填寫物流單號並出貨</button>`);
    if (['shipped','ready_pickup'].includes(os)) next.push(`<button class="btn btn-green" onclick="doFulfill('${orderId}','completed','')">標記完成</button>`);
    if (S.isPlatform) next.push(`<button class="btn btn-danger-outline" onclick="doAdminRefund('${orderId}',${Number(o.total_amount||0)})">辦理整筆退款</button>`);
    foot = next.join('')||`<div style="text-align:center;color:var(--muted);font-size:14px">訂單已完成</div>`;
  } else if (!reported && !paid && S.isPlatform) {
    foot = `<button class="btn btn-danger-outline" onclick="doCancelOrder('${orderId}')">取消未付款訂單</button>`;
  } else {
    foot = `<div style="text-align:center;color:var(--muted);font-size:14px;padding:8px">等待買家付款</div>`;
  }

  openModal(`訂單 #${shortId}`, o.recipient_name||o.member_email||'', body, foot);
}

/* ── Order Actions ── */
async function doConfirmPayment(id) {
  if (!confirm('確認已實際收到這筆款項？')) return;
  try { await post('confirmGroupBuyOrderPayment',{orderId:id}); toast('✓ 付款已確認'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doRejectPayment(id) {
  const note = prompt('退回原因：','付款資料尚未核對成功，請確認後重新回報。');
  if (note===null) return;
  try { await post('rejectGroupBuyPaymentReport',{sessionId:S.currentSid,orderId:id,note}); toast('已退回付款回報'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doRejectAndCancel(id) {
  const reason = prompt('退回並取消的原因（必填）：','');
  if (!reason||reason.trim().length<2) { toast('請填寫原因（至少2字）',true); return; }
  if (!confirm('確定退回付款回報並取消這筆訂單？')) return;
  try { await post('adminRejectAndCancelGroupBuyOrder',{orderId:id,reason:reason.trim()}); toast('已退回並取消'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doCancelOrder(id) {
  const reason = prompt('取消原因（必填）：','');
  if (!reason||reason.trim().length<2) { toast('請填寫原因',true); return; }
  if (!confirm('確定取消這筆未付款訂單？取消後庫存會釋回。')) return;
  try { await post('adminCancelGroupBuyOrder',{orderId:id,reason:reason.trim()}); toast('訂單已取消'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doConfirmRefund(id, amount) {
  const note = prompt('退款備註（可留空）：','');
  if (note===null) return;
  if (!confirm(`確認已依原收款方式完成退款 ${money(amount)}？`)) return;
  try { await post('confirmGroupBuyRefund',{orderId:id,refundAmount:amount,note}); toast('退款確認完成'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doAdminRefund(id, amount) {
  const note = prompt('退款原因：','');
  if (note===null) return;
  if (!confirm(`確認已依原收款方式完成退款 ${money(amount)}？退款完成後庫存與分潤會同步處理。`)) return;
  try { await post('adminProcessGroupBuyRefund',{orderId:id,refundAmount:amount,note}); toast('退款已處理'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doFulfill(id, status, tracking) {
  const labels = {processing:'開始處理',ready_pickup:'可取貨',shipped:'已出貨',completed:'完成'};
  if (!confirm(`確認更新為「${labels[status]||status}」？`)) return;
  try { await post('sessionOrderFulfillment',{orderId:id,status,trackingNo:tracking||''}); toast('狀態已更新'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}
async function doFulfillShipped(id) {
  const tracking = prompt('物流單號（沒有可留空）：','');
  if (tracking===null) return;
  if (!confirm('確認標記已出貨？')) return;
  try { await post('sessionOrderFulfillment',{orderId:id,status:'shipped',trackingNo:tracking||''}); toast('已標記出貨'); closeModal(); await loadOrders(); } catch(e){toast(e.message,true);}
}

async function loadApplications() {

// ── 登入 ──
async function doLogin() {
  const email = (document.getElementById('loginEmail')?.value||'').trim();
  const phone = (document.getElementById('loginPhone')?.value||'').trim();
  if (!email||!phone) { showLoginErr('請輸入 Email 與手機號碼'); return; }
  showLoginErr('');
  const btn = document.querySelector('#login button');
  if (btn) { btn.disabled=true; btn.textContent='登入中…'; }
  try {
    const j = await fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'memberEmailPhoneLogin',tenant:TENANT,email,phone}),cache:'no-store'}).then(r=>r.json());
    if (j.error) throw new Error(j.error);
    const check = await fetch(`${API}?${new URLSearchParams({action:'groupBuyAdminData',tenant:TENANT,memberToken:j.token,_t:Date.now()})}`,{cache:'no-store'}).then(r=>r.json());
    if (check.error) throw new Error('此帳號沒有後台管理權限，請確認已申請並審核通過場次管理員資格');
    saveSession({email, token:j.token, role:check.authorization?.role||'session_admin',
      name:j.name||j.display_name||email, authorization:check.authorization||null});
    await initWithSession(readSession());
  } catch(e) {
    showLoginErr(e.message||'登入失敗，請確認 Email 與手機號碼');
    const btn2 = document.querySelector('#login button');
    if (btn2) { btn2.disabled=false; btn2.textContent='登入管理後台'; }
  }
}


/* ── Boot ── */
async function boot() {
  // Read session from localStorage (shared with groupbuy.html)
  const saved = readSession();
  if (!saved) {
    document.getElementById('login').style.display='flex';
    return;
  }
  applySession(saved);

  // 3. Validate token + load data using groupBuyAdminData (validates admin token + fetches sessions in one call)
  try {
    // groupBuyAdminData validates admin credentials (requireGroupBuyAdmin) AND returns session data
    const data = await get('groupBuyAdminData');
    // Role is confirmed by the fact that we got a valid response (not 401/error)
    S.sessions = data.sessions||[];
    // Update role from live API response
    const liveRole = data.authorization?.role || saved.role || '';
    S.isPlatform = liveRole === 'platform_super_admin';
    S.role = liveRole;
    saveSession({email:saved.email, token:saved.token, role:liveRole, name:saved.name||saved.email, authorization:data.authorization||null});

    if (!S.sessions.length) {
      document.getElementById('login').style.display='none';
      document.getElementById('app').hidden = false;
      document.getElementById('sessionPicker').innerHTML = '<option>無可用場次</option>';
      document.getElementById('cntPay').textContent = '0';
      document.getElementById('cntShip').textContent = '0';
      document.getElementById('cntApply').textContent = '0';
      document.getElementById('recentList').innerHTML = '<div class="empty"><div class="empty-text">還沒有團購場次</div></div>';
      return;
    }

    S.currentSid = S.sessions[0].id;
    buildSessionPicker();

    // Show app
    document.getElementById('login').style.display='none';
    document.getElementById('app').hidden = false;

    // Load orders & applications
    await Promise.all([loadOrders(), loadApplications()]);
  } catch(e) {
    // Token probably expired
    if (/token|login|auth|401|登入/i.test(e.message)) {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById('loginErr').textContent = '登入已過期，請重新登入';
      document.getElementById('login').style.display='flex';
    } else {
      document.getElementById('login').style.display='none';
      document.getElementById('app').hidden = false;
      toast('資料載入失敗：'+e.message, true);
    }
  }
}

// ─── 商品管理 ──────────────────────────────────────────────────────
let S_PRODUCTS = [];

async function openProductMgmt() {
  if (!S.currentSid) { toast('請先選擇場次',true); return; }
  goTab('products'); return;
  if(false){
  openModal('商品管理', S.sessions.find(s=>s.id===S.currentSid)?.name||'', '<div class="loading">載入中…</div>',
    S.isPlatform ? `<button class="btn btn-green btn-sm" onclick="openAddProductModal()">＋ 新增商品</button>` : '');
  try {
    const d = await get('sessionProductsAdmin', {sessionId: S.currentSid});
    S_PRODUCTS = d.products||[];
    renderProductList();
  } catch(e) { document.getElementById('sheetBody').innerHTML = `<div class="empty"><div class="empty-sub">${esc(e.message)}</div></div>`; }
}

function tierHtml(tiers, priceKey) {
  if (!Array.isArray(tiers)||!tiers.length) return '<span style="color:var(--muted);font-size:12px">無級距</span>';
  return tiers.map(t=>`<span style="font-size:12px;background:var(--green);border-radius:6px;padding:2px 7px;margin-right:3px">${t.minQty}件+ → NT$${t[priceKey]||t.basePrice||t.unitPrice}</span>`).join('');
}

        <span id="selectedCount" style="font-size:13px;color:var(--muted)">未勾選</span>

        <div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px">售價 NT$</div>

        <div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px">原價 NT$</div>
          <input id="b_original" type="number" placeholder="空白不變" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"></div>

          <input id="b_cost" type="number" placeholder="空白不變" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"></div>
        <div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px">庫存（空=不變）</div>
          <input id="b_stock" type="number" placeholder="空白不變" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"></div>
      </div>
      <div style="background:rgba(255,255,255,.6);border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px">買家數量級距（勾選商品統一套用）</div>
        <div id="b_qtiers"></div>
        <button type="button" onclick="addTierRow('b_qtiers')" style="font-size:12px;border:none;background:rgba(0,0,0,.08);border-radius:7px;padding:5px 10px;cursor:pointer;margin-top:4px">＋ 加級距</button>
      </div>
      <div style="background:rgba(255,255,255,.6);border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px">團購主採購級距（勾選商品統一套用）</div>
        <div id="b_ptiers"></div>
        <button type="button" onclick="addTierRow('b_ptiers')" style="font-size:12px;border:none;background:rgba(0,0,0,.08);border-radius:7px;padding:5px 10px;cursor:pointer;margin-top:4px">＋ 加級距</button>
      </div>
      <div style="background:rgba(255,255,255,.6);border-radius:10px;padding:10px;margin-bottom:10px">
        <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px">買幾送幾</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:5px;font-size:13px"><input type="checkbox" id="b_buyget"> 啟用</label>
          <span style="font-size:12px">買</span>
          <input id="b_buyqty" type="number" min="1" placeholder="X" style="width:50px;padding:6px;border:1px solid var(--line);border-radius:7px">
          <span style="font-size:12px">件送</span>
          <input id="b_freeqty" type="number" min="1" placeholder="Y" style="width:50px;padding:6px;border:1px solid var(--line);border-radius:7px">

    ${S_PRODUCTS.map(p=>`
    <div style="background:var(--paper);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)">

            <div style="font-size:15px;font-weight:800;flex:1">${esc(p.name||'未命名')}</div>
            ${S.isPlatform?`<button onclick="openEditProductModal('${esc(p.id)}')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;cursor:pointer">編輯</button>`:''}
          </div>
          <div style="font-size:14px;font-weight:700;color:var(--main2);margin:4px 0">NT$${Number(p.price||0).toLocaleString()} ${p.original_price?`<s style="color:var(--muted);font-size:12px">原${Number(p.original_price).toLocaleString()}</s>`:''}${p.buy_get_enabled?` · 買${p.buy_qty}送${p.free_qty}`:''}</div>

function toggleSelectAll(checked) {
  document.querySelectorAll('.prod-chk').forEach(c=>c.checked=checked);
  updateSelectedCount();
}
function updateSelectedCount() {
  const n = document.querySelectorAll('.prod-chk:checked').length;
  const el = document.getElementById('selectedCount');
  const all = document.getElementById('selectAll');
  if(el) el.textContent = n ? `已勾選 ${n} 件` : '未勾選';
  if(all) all.indeterminate = n>0 && n<document.querySelectorAll('.prod-chk').length;
}

async function applyBatch() {
  const ids = [...document.querySelectorAll('.prod-chk:checked')].map(c=>c.dataset.id).filter(Boolean);
  if (!ids.length) { toast('請先勾選要套用的商品',true); return; }
  const price = document.getElementById('b_price')?.value;
  const original = document.getElementById('b_original')?.value;
  const cost = document.getElementById('b_cost')?.value;
  const stock = document.getElementById('b_stock')?.value;
  const qtiers = readTierRows('b_qtiers').map(t=>({minQty:t.minQty,unitPrice:t.price}));
  const ptiers = readTierRows('b_ptiers').map(t=>({minQty:t.minQty,basePrice:t.price}));
  const buyGetEnabled = document.getElementById('b_buyget')?.checked;
  const buyQty = Number(document.getElementById('b_buyqty')?.value||0);
  const freeQty = Number(document.getElementById('b_freeqty')?.value||0);
  const hasTiers = qtiers.length>0 || ptiers.length>0;
  const hasBuyGet = buyQty>0 && freeQty>0;
  
  if (!price && !original && !cost && !stock && !hasTiers && !hasBuyGet) {
    toast('請至少填一個要套用的欄位',true); return;
  }
  if (!confirm(`確定套用到 ${ids.length} 件商品？空白欄位不覆蓋原值。`)) return;
  
  let ok=0, fail=0;
  for (const id of ids) {
    const base = S_PRODUCTS.find(p=>p.id===id)||{};
    const payload = {
      sessionId: S.currentSid, id, status: base.status||'active',
      name: base.name||'', category: base.category||'',
      description: base.description||'', imageUrl: base.image_url||'',
      price: price!=='' && price!=null ? Number(price) : Number(base.price||0),
      originalPrice: original!=='' && original!=null ? Number(original)||null : Number(base.original_price||0)||null,
      supplyCost: cost!=='' && cost!=null ? Number(cost)||null : Number(base.supply_cost||0)||null,
      stockQty: stock!=='' && stock!=null ? Number(stock) : base.stock_qty,
      perMemberLimit: base.per_member_limit,
      quantityTiers: hasTiers ? qtiers : (base.quantity_tiers_json||[]).map(t=>({minQty:t.minQty,unitPrice:t.unitPrice||t.unit_price||0})),
      promoterTiers: hasTiers ? ptiers : (base.default_promoter_tiers_json||[]).map(t=>({minQty:t.minQty,basePrice:t.basePrice||t.base_price||0})),
      buyGetEnabled: hasBuyGet ? buyGetEnabled : (base.buy_get_enabled||false),
      buyQty: hasBuyGet ? buyQty : (base.buy_qty||0),
      freeQty: hasBuyGet ? freeQty : (base.free_qty||0),
    };
    try { await post('saveSessionProduct', payload); ok++; }
    catch(e) { fail++; console.error('batch fail', id, e.message); }
  }
  toast(fail ? `完成 ${ok}，失敗 ${fail}` : `✓ 已套用到 ${ok} 件商品`);
  await openProductMgmt(); // reload
}

function openAddProductModal() { openProductForm(null); }
function openEditProductModal(id) {
  const p = S_PRODUCTS.find(x=>x.id===id);
  if (p) openProductForm(p);
}

function openProductForm(p) {
  const isEdit = !!p;
  const tiers2rows = (arr, priceKey) => (arr||[]).map(t=>`<div class="tier-row" style="display:flex;gap:6px;margin-bottom:6px;align-items:center"><input type="number" class="tier-min" placeholder="最少件數" value="${t.minQty||''}" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"><input type="number" class="tier-price" placeholder="單件價格" value="${t[priceKey]||''}" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"><button type="button" onclick="this.parentElement.remove()" style="border:none;background:var(--pink);color:var(--danger);border-radius:8px;padding:8px;cursor:pointer">✕</button></div>`).join('');

  const body = `
    <div class="form-field"><label>商品名稱 *</label><input id="pf_name" value="${esc(p?.name||'')}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-field"><label>售價 *</label><input id="pf_price" type="number" value="${p?.price||''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
      <div class="form-field"><label>原價</label><input id="pf_original" type="number" value="${p?.original_price||''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
      <div class="form-field"><label>供應成本</label><input id="pf_cost" type="number" value="${p?.supply_cost||''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
      <div class="form-field"><label>庫存（空=無限）</label><input id="pf_stock" type="number" value="${p?.stock_qty!=null?p.stock_qty:''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
      <div class="form-field"><label>每人上限</label><input id="pf_limit" type="number" value="${p?.per_member_limit||''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
      <div class="form-field"><label>分類</label><input id="pf_cat" value="${esc(p?.category||'')}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>
    </div>
    <div class="form-field"><label>商品說明</label><textarea id="pf_desc" rows="2" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px">${esc(p?.description||'')}</textarea></div>
    <div class="form-field"><label>圖片 URL</label><input id="pf_img" value="${esc(p?.image_url||'')}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:13px"></div>

    <div style="background:var(--green);border-radius:10px;padding:12px;margin:10px 0">
      <div style="font-weight:800;font-size:13px;margin-bottom:6px">買家數量級距（滿幾件享特價）</div>
      <div id="pf_qtiers">${tiers2rows(p?.quantity_tiers_json||[],'unitPrice')}</div>
      <button type="button" onclick="addTierRow('pf_qtiers')" style="font-size:13px;border:none;background:rgba(0,0,0,.08);border-radius:8px;padding:6px 12px;cursor:pointer">＋ 加級距</button>
    </div>

    <div style="background:var(--yellow);border-radius:10px;padding:12px;margin:10px 0">
      <div style="font-weight:800;font-size:13px;margin-bottom:6px">團購主採購級距（滿幾件享採購價）</div>
      <div id="pf_ptiers">${tiers2rows(p?.default_promoter_tiers_json||[],'basePrice')}</div>
      <button type="button" onclick="addTierRow('pf_ptiers')" style="font-size:13px;border:none;background:rgba(0,0,0,.08);border-radius:8px;padding:6px 12px;cursor:pointer">＋ 加級距</button>
    </div>

    <div style="background:var(--blue);border-radius:10px;padding:12px;margin:10px 0">
      <div style="font-weight:800;font-size:13px;margin-bottom:8px">買幾送幾</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pf_buyget" ${p?.buy_get_enabled?'checked':''}> 啟用</label>
        <span style="font-size:13px">買</span><input id="pf_buyqty" type="number" min="1" value="${p?.buy_qty||10}" style="width:60px;padding:8px;border:1px solid var(--line);border-radius:8px">
        <span style="font-size:13px">送</span><input id="pf_freeqty" type="number" min="1" value="${p?.free_qty||1}" style="width:60px;padding:8px;border:1px solid var(--line);border-radius:8px">
      </div>
    </div>`;

  openModal(isEdit?`編輯：${p.name}`:'新增商品', '', body,
    `<button class="btn btn-green" onclick="saveProduct('${esc(p?.id||'')}')">儲存商品</button>
     <button class="btn btn-outline" onclick="document.getElementById('sheet').classList.remove('show');openProductMgmt()">取消</button>`);
}

function addTierRow(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const div = document.createElement('div');
  div.className = 'tier-row';
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;align-items:center';
  div.innerHTML = '<input type="number" class="tier-min" placeholder="最少件數" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"><input type="number" class="tier-price" placeholder="單件價格" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px"><button type="button" onclick="this.parentElement.remove()" style="border:none;background:var(--pink);color:var(--danger);border-radius:8px;padding:8px;cursor:pointer">✕</button>';
  el.appendChild(div);
}

function readTierRows(containerId) {
  return [...document.querySelectorAll(`#${containerId} .tier-row`)].map(row=>{
    const minQty = Number(row.querySelector('.tier-min')?.value||0);
    const price = Number(row.querySelector('.tier-price')?.value||0);
    return {minQty, price};
  }).filter(t=>t.minQty>0&&t.price>0);
}

async function saveProduct(id) {
  const name = document.getElementById('pf_name')?.value.trim();
  const price = Number(document.getElementById('pf_price')?.value||0);
  if (!name||!price) { toast('請填寫商品名稱與售價',true); return; }
  const qtiers = readTierRows('pf_qtiers').map(t=>({minQty:t.minQty,unitPrice:t.price}));
  const ptiers = readTierRows('pf_ptiers').map(t=>({minQty:t.minQty,basePrice:t.price}));
  const payload = {
    sessionId: S.currentSid,
    id: id||'', status:'active',
    name,
    category: document.getElementById('pf_cat')?.value.trim()||'',
    description: document.getElementById('pf_desc')?.value||'',
    price,
    originalPrice: Number(document.getElementById('pf_original')?.value||0)||null,
    supplyCost: Number(document.getElementById('pf_cost')?.value||0)||null,
    stockQty: document.getElementById('pf_stock')?.value!==''?Number(document.getElementById('pf_stock')?.value):null,
    perMemberLimit: document.getElementById('pf_limit')?.value!==''?Number(document.getElementById('pf_limit')?.value):null,
    imageUrl: document.getElementById('pf_img')?.value.trim()||'',
    quantityTiers: qtiers,
    promoterTiers: ptiers,
    buyGetEnabled: document.getElementById('pf_buyget')?.checked||false,
    buyQty: Number(document.getElementById('pf_buyqty')?.value||0),
    freeQty: Number(document.getElementById('pf_freeqty')?.value||0),
  };
  try {
    await post('saveSessionProduct', payload);
    toast('商品已儲存 ✓');
    closeModal();
    setTimeout(openProductMgmt, 300);
  } catch(e) { toast(e.message,true); }
}

boot();
</script>
