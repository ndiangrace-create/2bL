<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>團GO｜團購主</title><style>
:root{--g:#DDEAD1;--y:#FAEEC7;--b:#D9E5EE;--line:#e4e4de;--muted:#666;--bg:#fafaf8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:#111;padding-bottom:36px}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.topin,.wrap{width:min(1180px,calc(100vw - 24px));margin:auto}.topin{min-height:58px;display:flex;align-items:center;gap:10px}.logo{border:2px solid #111;border-radius:10px;padding:6px 10px;font-weight:1000;font-size:19px;cursor:pointer}.title{font-weight:950}.wrap{padding:14px 0}.rules,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}.rules{background:var(--g)}.rules h2,.card h2{font-size:18px;margin:0 0 8px}.rules ol{margin:6px 0 0;padding-left:21px;line-height:1.6;font-size:13px}.alert{font-weight:1000;background:#fff;padding:8px 10px;border-radius:8px;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.stat b{display:block;font-size:21px;margin-top:3px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.linkrow{display:flex;gap:6px;margin:8px 0}.linkrow input{flex:1;min-width:0;border:1px solid #ccc;border-radius:8px;padding:8px}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:900;background:#111;color:#fff;cursor:pointer}.btn.soft{background:var(--g);color:#111}.btn.gray{background:#eee;color:#111}.btn.full{width:100%}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.prod{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;display:flex;flex-direction:column;min-width:0}.pic{aspect-ratio:1;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.pb{padding:7px;display:flex;flex-direction:column;flex:1}.pn{font-weight:950;font-size:12px;line-height:1.3;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.public{font-size:10px;color:#777;margin-top:4px}.host{font-size:11px;font-weight:950;margin-top:4px;line-height:1.4}.tier{font-size:9px;color:#6d5900;line-height:1.4;margin-top:3px;min-height:26px}.qty{display:grid;grid-template-columns:27px 1fr 27px;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:auto}.qty button{height:29px;border:0;background:var(--g);font-weight:1000}.qty b{text-align:center;line-height:29px;font-size:12px}.quote{background:var(--y);border-radius:9px;padding:10px;margin-top:9px;font-size:13px;line-height:1.6}.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid #ccc;border-radius:8px;padding:9px}.collect{background:#f7f7f4;border-radius:10px;padding:10px;margin-top:10px}.orders .order{padding:9px 0;border-bottom:1px solid var(--line)}.orders .order:last-child{border:0}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}.sheetin{max-width:640px;margin:auto}.hide{display:none!important}@media(min-width:700px){.products{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pn{font-size:13px}.host{font-size:12px}}@media(min-width:1050px){.products{grid-template-columns:repeat(7,minmax(0,1fr))}}@media(max-width:420px){.topin,.wrap{width:calc(100vw - 16px)}.stats{grid-template-columns:1fr 1fr}.rules ol{font-size:12px}.public{display:none}}
</style><style>.topin .member-actions{margin-left:auto;display:flex;gap:7px}.topin .member-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-weight:900}.sheetin{position:relative}.sheet-close{position:sticky;top:0;float:right;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:28px;line-height:1}.pn{font-size:16px!important;min-height:43px!important}.public{display:block!important;font-size:13px!important}.host{font-size:15px!important}.tier{font-size:13px!important;min-height:auto!important}.qty{grid-template-columns:38px 1fr 38px!important}.qty button{height:40px!important;font-size:20px}.qty b{line-height:40px!important;font-size:16px!important}@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))!important}}@media(min-width:1100px){.products{grid-template-columns:repeat(5,minmax(0,1fr))!important}}</style></head><body><header class=top><div class=topin><div class=logo onclick="location.href='groupbuy.html'">團GO</div><div class=title>我的團購</div><div class=member-actions><button onclick="location.href='groupbuy.html'">回團GO</button><button onclick="location.href='groupbuy.html';setTimeout(()=>openPublicLogin?.(),0)">會員中心</button></div></div></header><main id=promoterMain class="wrap hide"><details class=rules><summary><b>團購主使用規則</b>（點此查看）</summary><ol><li>團購主採購價是專屬價格，一般消費者只看得到團購價。</li><li>價格級距、贈品與免運都只看單筆訂單，不跨單累積。</li><li>可分享專屬連結，也可自行收單後用採購價向平台下單。</li><li>付款確認後才出貨；未付款、取消或退款不視為完成交易。</li></ol></details><div class=stats><div class=stat><span class=muted>已付款專屬連結價差</span><b id=confirmed>NT$ 0</b></div><div class=stat><span class=muted>待付款／待確認價差</span><b id=pending>NT$ 0</b></div></div><div id=sessions></div><section class=card><h2>我的團購相關訂單</h2><div id=orders class=orders><div class=muted>載入中…</div></div></section></main>
<div id=checkout class=overlay><div class=sheet><div class=sheetin><button type=button class=sheet-close aria-label="關閉採購單" onclick="checkout.classList.remove('open')">×</button><h2>團購主採購單</h2><div id=checkoutLines></div><div id=fulfillment class=field></div><div id=shipFields class=hide><div class=field><label>收件人</label><input id=recipient></div><div class=field><label>手機</label><input id=phone></div><div class=field><label>郵遞區號</label><input id=postal></div><div class=field><label>完整地址</label><input id=address></div></div><div id=quoteBox class=quote></div><button id=hostPlaceBtn class="btn full" onclick=placeHostOrder()>確認下單，前往付款</button><button class="btn gray full" style="margin-top:7px" onclick="checkout.classList.remove('open')">繼續選購</button></div></div></div>
<script>
const API=(location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname))?(location.origin+'/s/api'):'https://2bl-v7.ndiangrace.workers.dev',TENANT='tuibile',TK='2bl_member_token';let D=null,Carts={},ActiveSession='',HostOrderAttempt={signature:'',key:''};const tk=()=>localStorage.getItem(TK)||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'NT$ '+Number(n||0).toLocaleString();document.querySelector('.member-actions button:last-child').onclick=()=>location.href='groupbuy.html?member=1';
async function call(action,data={},method='POST'){const x={action,tenant:TENANT,...data};const r=method==='GET'?await fetch(API+'?'+new URLSearchParams(x),{cache:'no-store'}):await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x),cache:'no-store'});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function tierPrice(tiers,qty){let v=0;for(const t of [...(tiers||[])].sort((a,b)=>Number(a.minQty)-Number(b.minQty)))if(qty>=Number(t.minQty||0))v=Number(t.basePrice||0);return v}
function publicPrice(p,qty){let v=Number(p.price||0);for(const t of [...(p.quantityTiers||[])].sort((a,b)=>Number(a.minQty)-Number(b.minQty)))if(qty>=Number(t.minQty||0))v=Number(t.unitPrice||v);return v}
function promoterFor(sid){return (D.promoters||[]).find(x=>String(x.session_id)===String(sid))}function productsFor(sid){return (D.products||[]).filter(x=>String(x.session_id)===String(sid))}function cart(sid){return Carts[sid]||(Carts[sid]={})}
function hostTiers(p,sid){if(Array.isArray(p?.promoterTiers))return p.promoterTiers;const pr=promoterFor(sid),m=pr?.promoterPriceOverrides||pr?.promoterTiers||{};return Array.isArray(m[p.id])?m[p.id]:[]}
function handleOf(pr){return pr.promoterHandle||String(pr.referral_code||'').split('-')[0]||''}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>alert('已複製專屬連結')).catch(()=>prompt('複製專屬連結',v))}
function render(){confirmed.textContent=money(D.confirmedDifference||0);pending.textContent=money(D.pendingDifference||0);const sm=new Map((D.sessions||[]).map(x=>[String(x.id),x]));sessions.innerHTML=(D.promoters||[]).map(pr=>{const s=sm.get(String(pr.session_id))||{},g=s.groupBuySettings||{},code=g.publicCode||s.id,handle=handleOf(pr),url=location.origin+'/groupbuy.html?g='+encodeURIComponent(code)+'&ref='+encodeURIComponent(handle),ps=productsFor(s.id),c=cart(s.id);return `<section class=card><h2>${esc(s.name||'團購')}</h2><div class=muted>我的團購主 ID：<b>${esc(handle)}</b>｜${g.shippingEnabled?(Number(g.freeShippingThreshold||0)>0?'滿 '+money(g.freeShippingThreshold)+' 免運':'宅配無免運門檻'):'未開放宅配'}</div><div class=linkrow><input readonly value="${esc(url)}"><button class="btn soft" onclick='copyText(${JSON.stringify(url)})'>複製專屬連結</button></div><div class=products>${ps.map(p=>{const ts=hostTiers(p,s.id);return `<article class=prod><div class=pic>${p.image_url?`<img src="${esc(p.image_url)}">`:''}</div><div class=pb><div class=pn>${esc(p.name)}</div><div class=public id="pub_${esc(s.id)}_${esc(p.id)}">一般團購價 ${money(p.displayPrice??p.price??0)}</div><div class=host id="host_${esc(s.id)}_${esc(p.id)}">我的採購價 ${ts.length?'選擇數量後顯示':'尚未設定'}</div><div class=muted id="diff_${esc(s.id)}_${esc(p.id)}"></div><div class=tier>${ts.length?ts.map(t=>'單筆滿 '+t.minQty+' 件→'+money(t.basePrice)).join('｜'):'尚未設定團購主採購級距'}</div><div class=muted>${p.promoterBuyGetEnabled?'團購主贈品：買 '+p.promoterBuyQty+' 送 '+p.promoterFreeQty:'團購主採購不含一般買幾送幾'}</div><div class=qty><button onclick="chg('${esc(s.id)}','${esc(p.id)}',-1)">－</button><b id="q_${esc(s.id)}_${esc(p.id)}">${Number(c[p.id]||0)}</b><button onclick="chg('${esc(s.id)}','${esc(p.id)}',1)">＋</button></div></div></article>`}).join('')}</div><div id="qbox_${esc(s.id)}" class="quote">選好數量後，系統會顯示正式的一般售價、我的採購價與每件差額。</div><button class="btn full" style="margin-top:9px" onclick="openHostCheckout('${esc(s.id)}')">建立我的採購單</button></section>`}).join('');renderOrders(sm)}
function chg(sid,pid,d){const p=productsFor(sid).find(x=>String(x.id)===String(pid)),c=cart(sid);let n=Math.max(0,Number(c[pid]||0)+d);if(p?.stock_qty!=null)n=Math.min(n,Number(p.stock_qty));if(p?.per_member_limit!=null)n=Math.min(n,Number(p.per_member_limit));c[pid]=n;const q=document.getElementById('q_'+sid+'_'+pid);if(q)q.textContent=n;quoteHost(sid)}
function items(sid){return Object.entries(cart(sid)).filter(x=>Number(x[1])>0).map(([product_id,quantity])=>({product_id,quantity:Number(quantity)}))}
async function quoteHost(sid,ful=''){const box=document.getElementById('qbox_'+sid);if(!items(sid).length){if(box)box.textContent='選好數量後，系統會顯示正式的一般售價、我的採購價與每件差額。';return null}try{const q=await call('sessionCartQuote',{memberToken:tk(),sessionId:sid,items:items(sid),promoterPurchase:true,fulfillmentType:ful});for(const it of(q.items||[])){const pub=document.getElementById('pub_'+sid+'_'+it.productId),host=document.getElementById('host_'+sid+'_'+it.productId),diff=document.getElementById('diff_'+sid+'_'+it.productId);if(pub)pub.textContent='一般團購價 '+money(it.publicUnitPrice)+'／件';if(host)host.textContent='我的採購價 '+money(it.promoterUnitPrice)+'／件';if(diff)diff.textContent='每件差額 '+money(it.differencePerUnit||0)}const gifts=(q.items||[]).reduce((sum,x)=>sum+Number(x.bonusQuantity||0),0);if(box)box.innerHTML=`本筆採購商品 ${money(q.productAmount)}${gifts?'｜團購主贈品 '+gifts+' 件':''}${q.freeShippingThreshold?`｜滿 ${money(q.freeShippingThreshold)} 免運${q.freeShippingReached?'（已達）':'（還差 '+money(q.remainingForFreeShipping)+'）'}`:''}`;return q}catch(e){if(box)box.textContent=e.message;return null}}
async function openHostCheckout(sid){if(!items(sid).length)return alert('請先選擇商品數量');ActiveSession=sid;const s=(D.sessions||[]).find(x=>String(x.id)===String(sid))||{},g=s.groupBuySettings||{};let h='';if(g.promoterPickupEnabled===true)h+='<label><input type=radio name=hful value=pickup> 現場取貨</label><br>';if(g.promoterShippingEnabled===true)h+='<label><input type=radio name=hful value=shipping> 宅配</label>';fulfillment.innerHTML=h||'目前沒有可用取貨方式';const f=fulfillment.querySelector('input');if(f)f.checked=true;fulfillment.querySelectorAll('input').forEach(x=>x.onchange=refreshCheckout);checkout.classList.add('open');await refreshCheckout()}
function hful(){return document.querySelector('input[name=hful]:checked')?.value||''}async function refreshCheckout(){shipFields.classList.toggle('hide',hful()!=='shipping');const q=await quoteHost(ActiveSession,hful());if(!q){quoteBox.textContent='無法取得正式價格';return}checkoutLines.innerHTML=(q.items||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><span>${esc(x.name)} × ${x.quantity}</span><b>${money(x.lineTotal)}</b></div><div class="muted">一般 ${money(x.publicUnitPrice)}／件｜我的採購 ${money(x.promoterUnitPrice)}／件｜差額 ${money(x.differencePerUnit||0)}／件</div></div>`).join('');quoteBox.innerHTML=`商品 ${money(q.productAmount)}<br>運費 ${money(q.shippingFee)}<br><b>合計 ${money(q.totalAmount)}</b>${q.freeShippingThreshold?`<br>免運門檻 ${money(q.freeShippingThreshold)}${q.freeShippingReached?'｜已達免運':'｜還差 '+money(q.remainingForFreeShipping)}`:''}`}
async function placeHostOrder(){if(!hful())return alert('請選取貨方式');if(hful()==='shipping'&&(!recipient.value.trim()||!phone.value.trim()||!postal.value.trim()||!address.value.trim()))return alert('請完整填寫宅配資料');const payload={memberToken:tk(),sessionId:ActiveSession,promoterPurchase:true,fulfillmentType:hful(),recipientName:recipient.value,recipientPhone:phone.value,recipientPostalCode:postal.value,shippingAddress:address.value,items:items(ActiveSession)};const sig=JSON.stringify([payload.sessionId,payload.fulfillmentType,payload.recipientName,payload.recipientPhone,payload.recipientPostalCode,payload.shippingAddress,payload.items]);if(HostOrderAttempt.signature!==sig){HostOrderAttempt={signature:sig,key:crypto.randomUUID()}}const btn=document.getElementById('hostPlaceBtn'),old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='建立正式採購單中…'}try{const j=await call('placeSessionProductOrder',{...payload,idempotencyKey:HostOrderAttempt.key});location.href=j.paymentUrl||('groupbuy-payment.html?order='+encodeURIComponent(j.order_id||''))}catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent=old||'確認下單，前往付款'}}}
function renderOrders(sm){const diff={};for(const i of D.items||[])diff[i.order_id]=(diff[i.order_id]||0)+Number(i.host_price_difference||0);orders.innerHTML=(D.orders||[]).length?(D.orders||[]).map(o=>{const role=o.buyer_role==='promoter'?'我的採購單':'專屬連結訂單',st=o.payment_status==='paid'?'已付款':o.payment_status==='reported'?'已回報待確認':'待付款',closed=['cancelled','refunded'].includes(String(o.order_status||''));return `<div class=order><b>${esc(sm.get(String(o.session_id))?.name||'團購')}｜${role}</b><div class=muted>${esc(o.created_at||'')}｜${closed?esc(o.order_status):st}｜訂單 ${money(o.total_amount||0)}${o.buyer_role==='consumer'?'｜商品價差 '+money(diff[o.id]||0):''}${o.refund_status==='requested'?'｜退款申請中（由平台處理）':''}</div>${!closed&&o.buyer_role==='promoter'&&o.payment_status!=='paid'?`<button class="btn gray" style="margin-top:6px" onclick="location.href='groupbuy-payment.html?order=${esc(o.id)}'">前往付款／回報</button>`:''}</div>`}).join(''):'<div class=muted>目前沒有訂單</div>'}
async function boot(){if(!tk())return location.replace('groupbuy.html?member=1');try{const identity=await call('groupBuyIdentity',{memberToken:tk()});if(!identity.isPromoter)return location.replace('groupbuy.html?member=1');D=await call('myPromoterDashboard',{memberToken:tk()});if(!D.promoters?.length)return location.replace('groupbuy.html?member=1');promoterMain.classList.remove('hide');render()}catch(e){alert(e.message);location.replace('groupbuy.html?member=1')}}boot();
</script></body></html>
