<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>團GO｜返回團購頁</title>
  <script>
    const target = new URL('groupbuy.html', location.href);
    target.searchParams.set('member', '1');
    const source = new URL(location.href);
    for (const key of ['g', 'session', 'ref']) {
      const value = source.searchParams.get(key);
      if (value) target.searchParams.set(key === 'session' ? 'g' : key, value);
    }
    location.replace(target.toString());
  </script>
</head>
<body>
  <p>正在返回同一個團購頁面…</p>
  <p><a href="groupbuy.html?member=1">回到團購頁</a></p>
</body>
</html>
