</style></head><body><header class=top><div class=topin><div class=logo onclick="location.href='groupbuy.html'">團GO</div><div class=title>我的團購</div><div class=member-actions><button onclick="location.href='groupbuy.html'">回團GO</button><button onclick="location.href='groupbuy.html';setTimeout(()=>openPublicLogin?.(),0)">會員中心</button></div></div></header><main id=promoterMain class="wrap hide"><details class=rules><summary><b>團購主使用規則</b>（點此查看）</summary><ol><li>團購主採購價、贈品、取貨、運費與免運門檻都是團購主專屬條件，不會套用一般買家設定。</li><li>價格級距、贈品與免運都只看單筆訂單，不跨單累積。</li><li>可分享專屬短網址，也可自行收單後用採購價向平台下單。</li><li>「預估毛利」以一般團購價售出付費數量計算，不把贈品灌入獲利。</li><li>付款確認後才出貨；未付款、取消或退款不視為完成交易。</li></ol></details><div class=stats><div class=stat><span class=muted>已付款專屬連結價差</span><b id=confirmed>NT$ 0</b></div><div class=stat><span class=muted>待付款／待確認價差</span><b id=pending>NT$ 0</b></div></div><div id=sessions></div><section class=card><h2>我的團購相關訂單</h2><div id=orders class=orders><div class=muted>載入中…</div></div></section></main>
<div id=checkout class=overlay><div class=sheet><div class=sheetin><button type=button class=sheet-close aria-label="關閉採購單" onclick="checkout.classList.remove('open')">×</button><h2>團購主採購單</h2><div id=checkoutLines></div><div id=fulfillment class=field></div><div id=shipFields class=hide><div class=field><label>收件人</label><input id=recipient></div><div class=field><label>手機</label><input id=phone></div><div class=field><label>郵遞區號</label><input id=postal></div><div class=field><label>完整地址</label><input id=address></div></div><div id=quoteBox class=quote></div><button id=hostPlaceBtn class="btn full" onclick=placeHostOrder()>確認下單，前往付款</button><button class="btn gray full" style="margin-top:7px" onclick="checkout.classList.remove('open')">繼續選購</button></div></div></div>
<script>
const API=(location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname))?(location.origin+'/s/api'):'https://2bl-v7.ndiangrace.workers.dev',TENANT='tuibile',TK='2bl_member_token';let D=null,Carts={},ActiveSession='',HostOrderAttempt={signature:'',key:''};const tk=()=>localStorage.getItem(TK)||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'NT$ '+Number(n||0).toLocaleString();document.querySelector('.member-actions button:last-child').onclick=()=>location.href='groupbuy.html?member=1';
async function call(action,data={},method='POST'){const x={action,tenant:TENANT,...data};const r=method==='GET'?await fetch(API+'?'+new URLSearchParams(x),{cache:'no-store'}):await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x),cache:'no-store'});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function tierPrice(tiers,qty){let v=0;for(const t of [...(tiers||[])].sort((a,b)=>Number(a.minQty)-Number(b.minQty)))if(qty>=Number(t.minQty||0))v=Number(t.basePrice||0);return v}
function publicPrice(p,qty){let v=Number(p.price||0);for(const t of [...(p.quantityTiers||[])].sort((a,b)=>Number(a.minQty)-Number(b.minQty)))if(qty>=Number(t.minQty||0))v=Number(t.unitPrice||v);return v}
function promoterFor(sid){return (D.promoters||[]).find(x=>String(x.session_id)===String(sid))}function productsFor(sid){return (D.products||[]).filter(x=>String(x.session_id)===String(sid))}function cart(sid){return Carts[sid]||(Carts[sid]={})}
function hostTiers(p,sid){if(Array.isArray(p?.promoterTiers))return p.promoterTiers;const pr=promoterFor(sid),m=pr?.promoterPriceOverrides||pr?.promoterTiers||{};return Array.isArray(m[p.id])?m[p.id]:[]}
function handleOf(pr){return pr.promoterHandle||String(pr.referral_code||'').split('-')[0]||''}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>alert('已複製專屬連結')).catch(()=>prompt('複製專屬連結',v))}
function promoterShortUrl(pr,code,handle){return pr.promoterShareUrl||location.origin+'/s/'+encodeURIComponent(code)+'/'+encodeURIComponent(handle)}
function preferredFulfillment(g){return g.promoterPickupEnabled===true?'pickup':(g.promoterShippingEnabled===true?'shipping':'')}
function promoterCondition(g){const pickup=g.promoterPickupEnabled===true?'可現場取貨':'',shipping=g.promoterShippingEnabled===true?(Number(g.promoterFreeShippingThreshold||0)>0?'宅配 '+money(g.promoterShippingFee||0)+'・滿 '+money(g.promoterFreeShippingThreshold)+' 免運':'宅配 '+money(g.promoterShippingFee||0)):'';return [pickup,shipping].filter(Boolean).join('｜')||'尚未開放團購主取貨方式'}
function hostDock(sid,g,active){const ship=preferredFulfillment(g)==='shipping'?money(g.promoterShippingFee||0):'NT$ 0';return `<div id="hostdock_${esc(sid)}" class="host-dock ${active?'host-dock-active':''}"><div class=host-dock-in><div class=host-dock-summary><span>已選 <b id="hd_qty_${esc(sid)}">0 件</b></span><span>・贈 <b id="hd_gift_${esc(sid)}">0 件</b></span><span>・運費 <b id="hd_ship_${esc(sid)}">${ship}</b></span><small id="hd_ship_hint_${esc(sid)}"></small></div><div class=host-dock-profit><span>預估毛利</span><b id="hd_profit_${esc(sid)}">${money(0)}</b><small>以一般團購價售出</small></div><div class=host-dock-total><span>總計</span><b id="hd_total_${esc(sid)}">${money(0)}</b></div><button class="btn host-dock-action" onclick="openHostCheckout('${esc(sid)}')">建立我的採購單</button></div></div>`}
function activateHostDock(sid){document.querySelectorAll('.host-dock').forEach(x=>x.classList.toggle('host-dock-active',x.id==='hostdock_'+sid))}
function resetHostDock(sid,g){const set=(key,value)=>{const el=document.getElementById(key+'_'+sid);if(el)el.textContent=value};set('hd_qty','0 件');set('hd_gift','0 件');set('hd_ship',preferredFulfillment(g)==='shipping'?money(g.promoterShippingFee||0):money(0));set('hd_profit',money(0));set('hd_total',preferredFulfillment(g)==='shipping'?money(g.promoterShippingFee||0):money(0));set('hd_ship_hint',g.promoterShippingEnabled&&Number(g.promoterFreeShippingThreshold||0)>0?'滿 '+money(g.promoterFreeShippingThreshold)+' 免運':'')}
function render(){confirmed.textContent=money(D.confirmedDifference||0);pending.textContent=money(D.pendingDifference||0);const sm=new Map((D.sessions||[]).map(x=>[String(x.id),x]));sessions.innerHTML=(D.promoters||[]).map((pr,index)=>{const s=sm.get(String(pr.session_id))||{},g=s.groupBuySettings||{},code=g.publicCode||s.id,handle=handleOf(pr),url=promoterShortUrl(pr,code,handle),ps=productsFor(s.id),c=cart(s.id);return `<section class="card host-session-card"><h2>${esc(s.name||'團購')}</h2><div class=muted><b>團購主專屬條件</b>｜ID：${esc(handle)}｜${esc(promoterCondition(g))}</div><div class=linkrow><input aria-label="團購主專屬短網址" readonly value="${esc(url)}"><button class="btn soft" onclick='copyText(${JSON.stringify(url)})'>一鍵複製短網址</button></div><div class=products>${ps.map(p=>{const ts=hostTiers(p,s.id);return `<article class=prod><div class=pic>${p.image_url?`<img src="${esc(p.image_url)}">`:''}</div><div class=pb><div class=pn>${esc(p.name)}</div><div class=public id="pub_${esc(s.id)}_${esc(p.id)}">一般團購價 ${money(p.displayPrice??p.price??0)}</div><div class=host id="host_${esc(s.id)}_${esc(p.id)}">團購主採購價 ${ts.length?'選擇數量後顯示':'尚未設定'}</div><div class=muted id="diff_${esc(s.id)}_${esc(p.id)}"></div><div class=profit id="profit_${esc(s.id)}_${esc(p.id)}">選擇數量後顯示預估毛利<small>以一般團購價售出付費數量</small></div><div class=tier>${ts.length?ts.map(t=>'採購滿 '+t.minQty+' 件→'+money(t.basePrice)).join('｜'):'尚未設定團購主採購級距'}</div><div class=muted>${p.promoterBuyGetEnabled?'團購主專屬贈品：買 '+p.promoterBuyQty+' 送 '+p.promoterFreeQty:'本商品沒有團購主贈品'}</div><div class=qty><button onclick="chg('${esc(s.id)}','${esc(p.id)}',-1)">－</button><b id="q_${esc(s.id)}_${esc(p.id)}">${Number(c[p.id]||0)}</b><button onclick="chg('${esc(s.id)}','${esc(p.id)}',1)">＋</button></div></div></article>`}).join('')}</div><div id="qbox_${esc(s.id)}" class="quote">選好數量後，會直接顯示一般團購金額、團購主採購金額與預估毛利。</div>${hostDock(s.id,g,index===0)}<button class="btn full host-inline-order" onclick="openHostCheckout('${esc(s.id)}')">建立我的採購單</button></section>`}).join('');renderOrders(sm);(D.promoters||[]).forEach(pr=>{const sid=String(pr.session_id),s=sm.get(sid)||{};resetHostDock(sid,s.groupBuySettings||{})})}
function chg(sid,pid,d){activateHostDock(sid);const p=productsFor(sid).find(x=>String(x.id)===String(pid)),c=cart(sid);let n=Math.max(0,Number(c[pid]||0)+d);if(p?.stock_qty!=null)n=Math.min(n,Number(p.stock_qty));if(p?.per_member_limit!=null)n=Math.min(n,Number(p.per_member_limit));c[pid]=n;const q=document.getElementById('q_'+sid+'_'+pid);if(q)q.textContent=n;quoteHost(sid)}
function items(sid){return Object.entries(cart(sid)).filter(x=>Number(x[1])>0).map(([product_id,quantity])=>({product_id,quantity:Number(quantity)}))}
async function quoteHost(sid,ful=''){const box=document.getElementById('qbox_'+sid),s=(D.sessions||[]).find(x=>String(x.id)===String(sid))||{},g=s.groupBuySettings||{},selectedItems=items(sid);if(!selectedItems.length){if(box)box.textContent='選好數量後，會直接顯示一般團購金額、團購主採購金額與預估毛利。';resetHostDock(sid,g);return null}try{const q=await call('sessionCartQuote',{memberToken:tk(),sessionId:sid,items:selectedItems,promoterPurchase:true,fulfillmentType:ful||preferredFulfillment(g)});for(const it of(q.items||[])){const pub=document.getElementById('pub_'+sid+'_'+it.productId),host=document.getElementById('host_'+sid+'_'+it.productId),diff=document.getElementById('diff_'+sid+'_'+it.productId),profit=document.getElementById('profit_'+sid+'_'+it.productId);if(pub)pub.textContent='一般團購價 '+money(it.publicUnitPrice)+'／件';if(host)host.textContent='團購主採購價 '+money(it.promoterUnitPrice)+'／件';if(diff)diff.textContent='每件省 '+money(it.differencePerUnit||0);if(profit)profit.innerHTML='這項預估毛利 '+money(it.estimatedGrossProfit||0)+'<small>一般售價 '+money(it.publicLineAmount||0)+'－採購 '+money(it.lineTotal||0)+'</small>'}const gifts=(q.items||[]).reduce((sum,x)=>sum+Number(x.bonusQuantity||0),0),paid=(q.items||[]).reduce((sum,x)=>sum+Number(x.quantity||0),0),set=(key,value)=>{const el=document.getElementById(key+'_'+sid);if(el)el.textContent=value};set('hd_qty',paid+' 件');set('hd_gift',gifts+' 件');set('hd_ship',money(q.shippingFee||0));set('hd_profit',money(q.estimatedGrossProfit||0));set('hd_total',money(q.totalAmount||0));set('hd_ship_hint',q.freeShippingThreshold?(q.freeShippingReached?'已達免運':'再 '+money(q.remainingForFreeShipping)+' 免運'):'');if(box)box.innerHTML=`一般團購金額 <b>${money(q.publicProductAmount||0)}</b>｜團購主採購 <b>${money(q.productAmount)}</b>｜預估毛利 <b>${money(q.estimatedGrossProfit||0)}</b>${gifts?'｜團購主贈品 '+gifts+' 件':''}${q.freeShippingThreshold?`｜${q.freeShippingReached?'已達免運':'再 '+money(q.remainingForFreeShipping)+' 免運'}`:''}`;return q}catch(e){if(box)box.textContent=e.message;return null}}
async function openHostCheckout(sid){if(!items(sid).length)return alert('請先選擇商品數量');activateHostDock(sid);ActiveSession=sid;const s=(D.sessions||[]).find(x=>String(x.id)===String(sid))||{},g=s.groupBuySettings||{};let h='';if(g.promoterPickupEnabled===true)h+='<label><input type=radio name=hful value=pickup> 現場取貨（團購主專屬）</label><br>';if(g.promoterShippingEnabled===true)h+='<label><input type=radio name=hful value=shipping> 宅配（團購主專屬）</label>';fulfillment.innerHTML=h||'目前沒有可用的團購主取貨方式';const f=fulfillment.querySelector('input');if(f)f.checked=true;fulfillment.querySelectorAll('input').forEach(x=>x.onchange=refreshCheckout);checkout.classList.add('open');await refreshCheckout()}
function hful(){return document.querySelector('input[name=hful]:checked')?.value||''}async function refreshCheckout(){shipFields.classList.toggle('hide',hful()!=='shipping');const q=await quoteHost(ActiveSession,hful());if(!q){quoteBox.textContent='無法取得正式價格';return}checkoutLines.innerHTML=(q.items||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><span>${esc(x.name)} × ${x.quantity}</span><b>${money(x.lineTotal)}</b></div><div class="muted">一般 ${money(x.publicUnitPrice)}／件｜團購主採購 ${money(x.promoterUnitPrice)}／件｜每件省 ${money(x.differencePerUnit||0)}｜這項預估毛利 ${money(x.estimatedGrossProfit||0)}</div></div>`).join('');quoteBox.innerHTML=`一般團購金額 ${money(q.publicProductAmount||0)}<br>團購主採購商品 ${money(q.productAmount)}<br>運費 ${money(q.shippingFee)}<br><b>預估毛利 ${money(q.estimatedGrossProfit||0)}</b><br><b>本次應付 ${money(q.totalAmount)}</b>${q.freeShippingThreshold?`<br>團購主免運門檻 ${money(q.freeShippingThreshold)}${q.freeShippingReached?'｜已達免運':'｜還差 '+money(q.remainingForFreeShipping)}`:''}<br><small>預估毛利以一般團購價售出付費數量計算，贈品不計入。</small>`}
async function placeHostOrder(){if(!hful())return alert('請選取貨方式');if(hful()==='shipping'&&(!recipient.value.trim()||!phone.value.trim()||!postal.value.trim()||!address.value.trim()))return alert('請完整填寫宅配資料');const payload={memberToken:tk(),sessionId:ActiveSession,promoterPurchase:true,fulfillmentType:hful(),recipientName:recipient.value,recipientPhone:phone.value,recipientPostalCode:postal.value,shippingAddress:address.value,items:items(ActiveSession)};const sig=JSON.stringify([payload.sessionId,payload.fulfillmentType,payload.recipientName,payload.recipientPhone,payload.recipientPostalCode,payload.shippingAddress,payload.items]);if(HostOrderAttempt.signature!==sig){HostOrderAttempt={signature:sig,key:crypto.randomUUID()}}const btn=document.getElementById('hostPlaceBtn'),old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='建立正式採購單中…'}try{const j=await call('placeSessionProductOrder',{...payload,idempotencyKey:HostOrderAttempt.key});location.href=j.paymentUrl||('groupbuy-payment.html?order='+encodeURIComponent(j.order_id||''))}catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent=old||'確認下單，前往付款'}}}
function renderOrders(sm){const diff={};for(const i of D.items||[])diff[i.order_id]=(diff[i.order_id]||0)+Number(i.host_price_difference||0);orders.innerHTML=(D.orders||[]).length?(D.orders||[]).map(o=>{const role=o.buyer_role==='promoter'?'我的採購單':'專屬連結訂單',st=o.payment_status==='paid'?'已付款':o.payment_status==='reported'?'已回報待確認':'待付款',closed=['cancelled','refunded'].includes(String(o.order_status||''));return `<div class=order><b>${esc(sm.get(String(o.session_id))?.name||'團購')}｜${role}</b><div class=muted>${esc(o.created_at||'')}｜${closed?esc(o.order_status):st}｜訂單 ${money(o.total_amount||0)}${o.buyer_role==='consumer'?'｜商品價差 '+money(diff[o.id]||0):''}${o.refund_status==='requested'?'｜退款申請中（由平台處理）':''}</div>${!closed&&o.buyer_role==='promoter'&&o.payment_status!=='paid'?`<button class="btn gray" style="margin-top:6px" onclick="location.href='groupbuy-payment.html?order=${esc(o.id)}'">前往付款／回報</button>`:''}</div>`}).join(''):'<div class=muted>目前沒有訂單</div>'}
async function boot(){if(!tk())return location.replace('groupbuy.html?member=1');try{const identity=await call('groupBuyIdentity',{memberToken:tk()});if(!identity.isPromoter)return location.replace('groupbuy.html?member=1');D=await call('myPromoterDashboard',{memberToken:tk()});if(!D.promoters?.length)return location.replace('groupbuy.html?member=1');promoterMain.classList.remove('hide');render()}catch(e){alert(e.message);location.replace('groupbuy.html?member=1')}}boot();
</script></body></html>
