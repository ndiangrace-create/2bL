<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>團GO｜付款</title><style>
:root{--g:#DDEAD1;--y:#FAEEC7;--line:#e5e5df;--muted:#666;--bg:#fafaf8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:#111}button,input,select,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin,.wrap{width:min(760px,calc(100vw - 24px));margin:auto}.topin{height:58px;display:flex;align-items:center;gap:10px}.logo{border:2px solid #111;border-radius:10px;padding:6px 10px;font-size:19px;font-weight:1000}.wrap{padding:16px 0 44px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.card h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.line{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.total{font-size:22px;font-weight:1000}.status{display:inline-block;background:var(--y);padding:5px 9px;border-radius:999px;font-weight:900;font-size:13px}.method{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.method label{display:flex;gap:9px;font-weight:900}.field{margin:10px 0}.field label{display:block;font-weight:900;font-size:14px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccc;border-radius:9px;padding:10px}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;font-weight:950;background:#111;color:#fff}.btn.secondary{background:#eee;color:#111;margin-top:8px}.notice{background:var(--g);padding:12px;border-radius:10px;line-height:1.55}.hide{display:none!important}.loading{text-align:center;padding:80px 20px;color:var(--muted)}a{color:#111}</style></head><body>
<header class="top"><div class="topin"><div class="logo" onclick="location.href='groupbuy.html'">團GO</div><b>付款與回報</b></div></header><main class="wrap"><div id="app" class="loading">載入付款資訊…</div></main>
<script>
const API=(location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname))?(location.origin+'/s/api'):'https://2bl-v7.ndiangrace.workers.dev',TENANT='tuibile',TK='2bl_member_token';let PaymentReportAttempt={signature:'',key:''};const qs=new URLSearchParams(location.search),orderId=qs.get('order')||'';const app=document.getElementById('app');
const tk=()=>localStorage.getItem(TK)||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'NT$ '+Number(n||0).toLocaleString();
async function call(action,data={},method='POST'){const payload={action,tenant:TENANT,...data};const r=method==='GET'?await fetch(API+'?'+new URLSearchParams(payload),{cache:'no-store'}):await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function methodHtml(p){const a=p.allowedMethods||{},bank=p.bankAccount||{},out=[];if(a.bank!==false&&String(bank.accountNumber||'').trim())out.push(`<div class=method><label><input type=radio name=paymethod value="銀行轉帳" checked onchange="payMethodChanged()"> 銀行轉帳</label><div class=muted style="margin-top:8px">${esc(bank.bankName||'')} ${esc(bank.branchName||'')}<br>戶名：${esc(bank.accountName||'')}<br>帳號：<b>${esc(bank.accountNumber||'未設定')}</b></div></div>`);if(a.linepay&&p.linepay?.url)out.push(`<div class=method><label><input type=radio name=paymethod value="LINE Pay" onchange="payMethodChanged()"> ${esc(p.linepay.displayName||'LINE Pay')}</label><div class=muted style="margin-top:8px"><a href="${esc(p.linepay.url)}" target="_blank" rel="noopener">開啟付款連結</a></div></div>`);if(a.card&&p.card?.url)out.push(`<div class=method><label><input type=radio name=paymethod value="信用卡" onchange="payMethodChanged()"> ${esc(p.card.displayName||'信用卡')}</label><div class=muted style="margin-top:8px"><a href="${esc(p.card.url)}" target="_blank" rel="noopener">開啟付款連結</a></div></div>`);return out.join('')||'<div class=muted>目前沒有可用付款方式，請聯絡團GO客服。</div>'}
async function boot(){if(!orderId){app.innerHTML='<div class=card>找不到訂單編號。</div>';return}if(!tk()){app.innerHTML='<div class=card><h2>請先登入</h2><div class=field><label>Email</label><input id=em></div><div class=field><label>手機</label><input id=ph></div><button class=btn onclick=login()>登入並繼續付款</button></div>';return}try{const [j,line]=await Promise.all([call('getGroupBuyOrderPayment',{memberToken:tk(),orderId},'GET'),call('getGroupBuyChannelSettings',{},'GET')]);render(j,line.settings||{})}catch(e){app.innerHTML='<div class=card><b>付款資料載入失敗</b><div class=muted style="margin-top:7px">'+esc(e.message)+'</div></div>'}}
async function login(){try{const email=document.getElementById('em')?.value||'',phone=document.getElementById('ph')?.value||'';const j=await call('groupBuyExistingMemberLogin',{email,phone});localStorage.setItem(TK,j.token);boot()}catch(e){alert(e.message)}}
function render(j,line){
 const o=j.order||{},p=j.paymentProfile||{},events=Array.isArray(j.paymentEvents)?j.paymentEvents:[];
 const lastRejected=events.find(x=>x.event_type==='report_rejected')||null;
 const a=p.allowedMethods||{},bank=p.bankAccount||{};
 const hasMethod=!!((a.bank!==false&&String(bank.accountNumber||'').trim())||(a.linepay&&p.linepay?.url)||(a.card&&p.card?.url));
 const paid=['paid','已付款'].includes(String(o.payment_status||'')),orderState=String(o.order_status||'').toLowerCase(),closed=['cancelled','refunded','void','voided','deleted','已取消','已退款','作廢','已作廢','已刪除'].includes(orderState),refundRequested=String(o.refund_status||'').toLowerCase()==='requested';
 const reported=['reported','已回報','待確認'].includes(String(o.payment_status||''));
 const status=closed?(orderState==='refunded'||orderState==='已退款'?'已退款':'已取消／作廢'):refundRequested?'退款申請中':paid?'已付款':reported?'已回報，等待確認':'待付款';
 const head=`<div class=card><h2>${esc(j.session?.name||'團購訂單')}</h2><span class=status>${status}</span><div class=muted style="margin-top:8px">訂單編號 ${esc(o.id||'')}</div></div>`;
 const detail=`<div class=card><h2>訂單明細</h2>${(j.items||[]).map(x=>`<div class=line><span>${esc(x.product_name)}${Number(x.quantity||0)>0?` × ${Number(x.quantity)}`:''}${Number(x.bonus_quantity||0)>0?` ${Number(x.bonus_quantity)} 件`:''}</span><b>${money(x.line_total)}</b></div>`).join('')}<div class=line><span>商品小計</span><b>${money(o.product_amount)}</b></div><div class=line><span>運費</span><b>${money(o.shipping_fee)}</b></div><div class=line><span>應付總額</span><span class=total>${money(o.total_amount)}</span></div><div class=muted style="margin-top:8px">金額以正式訂單資料為準，付款回報不能自行修改應付總額。</div></div>`;
 let payment='';
 if(closed){
  payment=`<div class=card><div class=notice><b>${esc(status)}</b><br>這筆訂單已結束，歷史紀錄仍會保留。</div><button class="btn secondary" onclick="location.href='groupbuy.html'">回團GO</button></div>`;
 }else if(paid){
  payment=`<div class=card><div class=notice><b>${refundRequested?'退款申請已送出。':'付款已確認。'}</b><br>${refundRequested?'請等待平台完成退款，處理期間不會再出貨。':'訂單已進入後續出貨／取貨流程。'}</div><div class=muted style="margin-top:8px">確認時間：${esc(o.paid_at||'')}</div>${refundRequested?'':`<button class="btn" style="margin-top:10px" onclick="requestRefund()">申請整筆退款</button>`}<button class="btn secondary" onclick="location.href='groupbuy.html'">回團GO</button></div>`;
 }else{
  const rejected=(!reported&&lastRejected)?`<div class=notice style="margin-top:8px"><b>上一筆付款回報已退回。</b><br>${esc(lastRejected.note||'請確認付款資料後重新回報。')}</div>`:'';
  let action='';
  if(reported){
   action=`<div class=notice><b>已送出付款回報。</b><br>請等待平台確認，確認前不會出貨。</div><div class=muted style="margin-top:8px">回報方式：${esc(o.payment_method||'')} ${o.payment_last5?`｜末5碼 ${esc(o.payment_last5)}`:''}<br>回報金額：${money(o.payment_report_amount||o.total_amount)}<br>回報時間：${esc(o.payment_reported_at||'')}</div><button class="btn secondary" onclick="cancelReportedOrder()">撤回回報並取消訂單</button>`;
  }else if(hasMethod){
   action=`<div class=field><label id=last5Label>匯款帳號末 5 碼</label><input id=last5 maxlength=20 inputmode=numeric placeholder="例如 12345"></div><div class=field><label>回報金額</label><input id=amount type=number readonly value="${Number(o.total_amount||0)}"></div><div class=field><label>備註</label><textarea id=note rows=3></textarea></div><button class=btn onclick=reportPay()>送出付款回報</button><button class="btn secondary" onclick="cancelUnpaidOrder()">取消未付款訂單</button>`;
  }else{
   action='<div class=notice>目前沒有可用的正式付款方式，請聯絡團GO客服。</div>';
  }
  payment=`<div class=card><h2>付款方式</h2><div class=muted>${esc(p.paymentProfileName||p.name||'')}</div>${methodHtml(p)}${rejected}${action}</div>`;
 }
 const lineBox=line.enabled?`<div class=card><h2>${esc(line.name||'團GO 官方 LINE')}</h2><div class=muted>${esc(line.helpText||'付款問題可透過官方 LINE 聯絡我們。')}</div>${line.lineId?`<div style="margin-top:7px"><b>LINE ID：</b>${esc(line.lineId)}</div>`:''}${line.addFriendUrl?`<button class="btn secondary" onclick="window.open('${esc(line.addFriendUrl)}','_blank')">加入團GO官方 LINE</button>`:''}</div>`:'';
 app.className='';app.innerHTML=head+detail+payment+lineBox;
 if(!paid&&!reported&&hasMethod){const first=document.querySelector('input[name=paymethod]');if(first&&!document.querySelector('input[name=paymethod]:checked'))first.checked=true;payMethodChanged()}
}
function payMethodChanged(){const method=document.querySelector('input[name=paymethod]:checked')?.value||'銀行轉帳',bank=/銀行|轉帳|ATM|匯款/i.test(method),label=document.getElementById('last5Label'),input=document.getElementById('last5');if(label)label.textContent=bank?'匯款帳號末 5 碼':'付款識別／交易末碼（可留空）';if(input){input.inputMode=bank?'numeric':'text';input.maxLength=bank?5:20;input.placeholder=bank?'例如 12345':'依付款平台需要填寫'}}
async function cancelUnpaidOrder(){if(!confirm('確定取消這筆未付款訂單？取消後庫存會立即釋回，訂單歷史仍會保留。'))return;try{await call('cancelGroupBuyOrder',{memberToken:tk(),orderId});alert('訂單已取消');boot()}catch(e){alert(e.message||e)}}
async function cancelReportedOrder(){if(!confirm('確定撤回付款回報並取消訂單？\n\n若款項已實際匯出，請勿取消，請等待平台核對。'))return;try{await call('cancelReportedGroupBuyOrder',{memberToken:tk(),orderId,note:'買家撤回付款回報並取消訂單'});alert('付款回報已撤回，訂單已取消');boot()}catch(e){alert(e.message||e)}}
async function requestRefund(){const note=prompt('請填退款原因／備註（可留空）：','')??null;if(note===null)return;if(!confirm('確定送出整筆退款申請？'))return;try{await call('requestGroupBuyRefund',{memberToken:tk(),orderId,note});alert('退款申請已送出');boot()}catch(e){alert(e.message||e)}}
async function reportPay(){try{const method=document.querySelector('input[name=paymethod]:checked')?.value||'';if(!method)return alert('請先選擇可用付款方式');const last=(document.getElementById('last5')?.value||'').trim(),memo=document.getElementById('note')?.value||'';if(/銀行|轉帳|ATM|匯款/i.test(method)&&!/^\d{5}$/.test(last))return alert('銀行轉帳請填寫帳號末 5 碼');const sig=JSON.stringify([orderId,method,last,memo]);if(PaymentReportAttempt.signature!==sig)PaymentReportAttempt={signature:sig,key:crypto.randomUUID()};await call('reportGroupBuyPayment',{memberToken:tk(),orderId,method,last5:last,note:memo,idempotencyKey:PaymentReportAttempt.key});alert('付款回報已送出');boot()}catch(e){alert(e.message)}}boot();
</script><!-- GROUPBUY_PAYMENT_BUILD: 20260830-groupbuy-order-actions-1 --></body></html>
