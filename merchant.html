<!DOCTYPE html>
<!-- GROUPBUY_MERCHANT_BUILD: 20260831-buyget-restore-1 -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store">
<title>我的團購 · 商家管理</title>
<style>
:root{
  --bg:#F8F6F0; --paper:#fff; --ink:#1f1f1f; --muted:#6f6f6f; --line:#E8DFD4;
  --green:#DDEAD1; --yellow:#FAEEC7; --blue:#D9E5EE; --pink:#FAE1DD; --purple:#DCD7ED;
  --mint:#D4E3DD; --main:#82ABA3; --main2:#628E87; --danger:#C8645D;
  --shadow:0 12px 30px rgba(45,39,32,.08); --shadow2:0 18px 48px rgba(45,39,32,.16);
  --card:#fff; --text:#1f1f1f; --r:14px;
  --hdr:56px; --nav:calc(60px + env(safe-area-inset-bottom,0px));
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ── Login ── */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#fff 0%,var(--bg) 42%,var(--blue) 100%)}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:360px}
.login-badge{width:64px;height:64px;background:linear-gradient(135deg,var(--main),var(--main2));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:900;color:#fff}
.login-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.field input:focus{outline:none;border-color:var(--main)}
.btn-login{width:100%;padding:14px;border-radius:12px;border:none;background:var(--main);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.btn-login:active{opacity:.9}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.login-note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}

/* ── App ── */
#app{display:flex;flex-direction:column;height:100dvh}
header{height:var(--hdr);background:linear-gradient(90deg,var(--navy),#1a4a45);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:20}
.hdr-logo{color:var(--ink);font-size:17px;font-weight:900;flex-shrink:0}
.hdr-session{flex:1;color:var(--muted);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.icon-btn:active{background:var(--green)}
#main{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav)+30px)}
.tab{display:none;padding:14px 14px 0}.tab-inner{max-width:1180px;margin:0 auto}
.tab.active{display:block}
#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 20px));height:60px;background:rgba(221,234,209,.97);backdrop-filter:blur(12px);border:1px solid #b9cfae;border-radius:24px;display:flex;z-index:20;box-shadow:var(--shadow2);padding:8px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);cursor:pointer;position:relative;padding:4px 0;border-radius:16px}
.nav-btn.active{color:var(--main2);background:rgba(255,255,255,.6)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:11px;font-weight:700}
.nav-dot{position:absolute;top:6px;right:calc(50% - 12px);width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff}

/* ── Cards ── */
.card{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:900;margin-bottom:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--paper);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:900;line-height:1;margin-bottom:3px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.stat.teal .stat-num{color:var(--main)}
.stat.amber .stat-num{color:var(--amber)}
.stat.blue .stat-num{color:var(--blue)}

/* ── Product Cards ── */
.prod-card{background:var(--paper);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:stretch}
.prod-thumb{width:80px;min-height:80px;flex-shrink:0;background:#F0FDF4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;overflow:hidden}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.prod-body{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:3px}
.prod-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-price{font-size:14px;font-weight:700;color:var(--main)}
.prod-stock{font-size:12px;color:var(--muted)}
.prod-edit{padding:10px 14px;border:none;background:none;color:var(--main);font-size:14px;font-weight:800;border-left:1px solid var(--line);cursor:pointer;flex-shrink:0;align-self:stretch;display:flex;align-items:center}

/* ── Order Cards ── */
.order-card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.order-card:active{opacity:.92}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.order-name{font-size:15px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-meta{font-size:13px;color:var(--muted)}
.order-amount{font-size:17px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-amber{background:var(--amber-lt);color:#92400E}
.chip-teal{background:var(--green);color:var(--main2)}
.chip-red{background:var(--red-lt);color:#991B1B}
.chip-blue{background:var(--blue-lt);color:#1E40AF}
.chip-gray{background:#F1F5F9;color:var(--muted)}

/* ── Filter Bar ── */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.f-chip{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0}
.f-chip.active{background:var(--main);color:#fff;border-color:var(--main)}

/* ── Earnings ── */
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.earn-box{background:var(--paper);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.earn-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.earn-val{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.earn-val.teal{color:var(--main)}

/* ── Modal Sheet ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
#overlay.show{opacity:1}
#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:min(560px,100vw);background:#fff;border-radius:20px 20px 0 0;z-index:50;max-height:90dvh;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,0,.67,0);padding-bottom:var(--safe-b)}
#sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:40px;height:4px;background:#D1D5DB;border-radius:2px;margin:12px auto 8px;flex-shrink:0}
#sheetHead{padding:0 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.sh-title{font-size:18px;font-weight:900}
.sh-sub{font-size:13px;color:var(--muted);margin-top:2px}
#sheetBody{overflow-y:auto;flex:1;padding:16px 18px}
#sheetFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* ── Form ── */
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--main)}
.form-field textarea{resize:vertical;min-height:80px}

/* ── Detail Rows ── */
.detail-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14px}
.detail-row:last-child{border:none}
.detail-key{color:var(--muted);font-weight:600;flex-shrink:0}
.detail-val{font-weight:700;text-align:right;word-break:break-all}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer}
.btn:active{opacity:.85}
.btn-teal{background:var(--main);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn-sm{padding:10px;font-size:14px;border-radius:10px;width:auto}

/* ── Empty / Loading ── */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:14px}
.loading{text-align:center;padding:36px;color:var(--muted);font-size:14px}

/* ── Section Heading ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.section-hd h3{font-size:15px;font-weight:800}
.add-btn{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;border:none;background:var(--main);color:#fff;font-size:13px;font-weight:800;cursor:pointer}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

@media(min-width:768px){
  .stat-row{grid-template-columns:repeat(4,1fr)}
  .tab{padding:20px 24px 0}
  #sheet{width:min(560px,96vw)}
  .earn-grid{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1024px){
  .tab{padding:24px 40px 0}
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login">
  <div class="login-card">
    <img src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO" style="width:80px;height:80px;object-fit:contain;border-radius:16px;margin:0 auto 12px;display:block">
    <h1 class="login-title">商家管理中心</h1>
    <p class="login-sub">請使用 2BL 會員帳號登入</p>
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com" inputmode="email">
    </div>
    <div class="field">
      <label>手機號碼</label>
      <input id="loginPhone" type="tel" autocomplete="tel" placeholder="0912345678" inputmode="tel">
    </div>
    <button class="btn-login" onclick="doLogin()">登入</button>
    <div id="loginErr" class="login-err"></div>
    <p class="login-note">尚未有帳號？請聯繫平台開通商家資格</p>
  </div>
</div>

<!-- ── App ── -->
<div id="app" hidden>
  <header>
  <div class="hdr-in">
    <img src="https://raw.githubusercontent.com/ndiangrace-create/2bL/main/55cd984d-dc71-4a23-8da8-40de323b8b59%20(1).png" alt="團GO" style="height:34px;object-fit:contain;border-radius:8px;flex-shrink:0">
    <span class="hdr-session" id="hdrSession">載入中…</span>
    <div class="hdr-right">
      <button class="icon-btn" onclick="doLogout()" title="登出">🚪</button>
    </div>
  </header>

  <main id="main">
    <!-- 首頁 -->
    <div id="t-home" class="tab active"><div class="tab-inner">
      <div class="stat-row">
        <div class="stat teal" onclick="goTab('orders')">
          <div class="stat-num num" id="stOrders">—</div>
          <div class="stat-label">總訂單</div>
        </div>
        <div class="stat amber" onclick="goTab('orders')">
          <div class="stat-num num" id="stPending">—</div>
          <div class="stat-label">待出貨</div>
        </div>
        <div class="stat blue">
          <div class="stat-num num" id="stEarn">—</div>
          <div class="stat-label">分潤</div>
        </div>
      </div>
      <div id="earnSection"></div>
      <div class="section-hd">
        <h3>最近訂單</h3>
        <button class="add-btn" onclick="goTab('orders')">查看全部 →</button>
      </div>
      <div id="recentList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 商品 -->
    <div id="t-products" class="tab"><div class="tab-inner">
      <div class="section-hd">
        <h3>我的商品</h3>
        <button class="add-btn" onclick="openAddProduct()">＋ 新增</button>
      </div>
      <div id="productList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 訂單 -->
    <div id="t-orders" class="tab"><div class="tab-inner">
      <div class="filter-bar">
        <button class="f-chip active" data-f="all" onclick="filterOrders('all')">全部</button>
        <button class="f-chip" data-f="reported" onclick="filterOrders('reported')">待確認</button>
        <button class="f-chip" data-f="paid" onclick="filterOrders('paid')">已付款</button>
        <button class="f-chip" data-f="shipping" onclick="filterOrders('shipping')">出貨中</button>
        <button class="f-chip" data-f="done" onclick="filterOrders('done')">完成</button>
        <button class="f-chip" data-f="closed" onclick="filterOrders('closed')">關閉</button>
      </div>
      <div id="orderList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 帳務 -->
    <div id="t-earn" class="tab"><div class="tab-inner">
      <div id="earnContent"><div class="loading">載入中…</div></div>
    </div>
  </main>

  <nav id="nav">
    <button class="nav-btn active" id="nb-home" onclick="goTab('home')">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">首頁</span>
    </button>
    <button class="nav-btn" id="nb-products" onclick="goTab('products')">
      <span class="nav-icon">📦</span>
      <span class="nav-label">商品</span>
    </button>
    <button class="nav-btn" id="nb-orders" onclick="goTab('orders')">
      <span class="nav-icon">☰</span>
      <span class="nav-label">訂單</span>
      <span id="orderDot" class="nav-dot hidden"></span>
    </button>
    <button class="nav-btn" id="nb-earn" onclick="goTab('earn')">
      <span class="nav-icon">💰</span>
      <span class="nav-label">帳務</span>
    </button>
  </nav>
</div>

<div id="overlay" hidden onclick="closeModal()"></div>
<div id="sheet" hidden>
  <div class="sheet-handle"></div>
  <div id="sheetHead" class="sheet-head"></div>
  <div id="sheetBody" class="sheet-body"></div>
  <div id="sheetFoot" class="sheet-foot"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
const API = location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname)
  ? location.origin+'/s/api' : 'https://2bl-v7.ndiangrace.workers.dev';
const TENANT = 'tuibile';
// ⚠️ 身份隔離：此 token 與市集首頁、團購前台共用同一把鑰匙
// member token 無法存取 admin.html（需 Google OAuth 的 admin token）
// member token 無法通過後端 requireAdmin()，會被 Worker 直接拒絕
const TK_KEY = '2bl_member_token';

const S = { token:'', member:null, sessionId:'', sessionName:'', orders:[], products:[], dashboard:null, activeFilter:'all', activeTab:'home' };

async function call(action, data={}, method='POST') {
  const payload = { action, tenant:TENANT, ...data };
  let r;
  if (method==='GET') {
    const params = new URLSearchParams(payload);
    r = await fetch(`${API}?${params}`,{cache:'no-store'});
  } else {
    r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
  }
  const j = await r.json().catch(()=>({error:'回應格式錯誤'}));
  if (j.error) throw new Error(j.error);
  return j;
}

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>'NT$ '+Number(n||0).toLocaleString();
const fmt = d=>{ if(!d)return '—'; return new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); };

// Auth
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  if (!email||!phone) { setLoginErr('請輸入 Email 與手機號碼'); return; }
  setLoginErr('');
  try {
    const j = await call('memberEmailPhoneLogin',{email,phone});
    localStorage.setItem(TK_KEY, j.token);
    S.token = j.token;
    await startApp();
  } catch(e) { setLoginErr(e.message||'登入失敗，請確認 Email 與手機號碼'); }
}
function setLoginErr(msg) { document.getElementById('loginErr').textContent = msg; }
function doLogout() { localStorage.removeItem(TK_KEY); localStorage.removeItem('tb_member_email'); location.reload(); }

function openModal(title, sub, bodyHtml, footHtml) {
  document.getElementById('sheetHead').innerHTML = `<div class="sh-title">${esc(title)}</div>${sub?`<div class="sh-sub">${esc(sub)}</div>`:''}`;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetFoot').innerHTML = footHtml;
  const ov=document.getElementById('overlay'), sh=document.getElementById('sheet');
  ov.hidden=false; sh.hidden=false;
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
}
function closeModal() {
  const ov=document.getElementById('overlay'), sh=document.getElementById('sheet');
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(()=>{ ov.hidden=true; sh.hidden=true; }, 300);
}

let _tt;
function toast(msg, isErr=false) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=isErr?'show err':'show';
  clearTimeout(_tt); _tt=setTimeout(()=>el.className='',3000);
}

function goTab(name) {
  ['home','products','orders','earn'].forEach(t=>{
    document.getElementById('t-'+t).classList.toggle('active',t===name);
    document.getElementById('nb-'+t).classList.toggle('active',t===name);
  });
  S.activeTab=name;
  if (name==='products' && !S.products.length) loadProducts();
  if (name==='orders' && !S.orders.length) loadOrders();
  if (name==='earn') loadEarnings();
}

// Status helpers
function isClosed(o) { return ['cancelled','refunded','已取消','已退款'].includes(String(o.order_status||'').toLowerCase()); }
function isPaid(o) { return ['paid','已付款'].includes(String(o.payment_status||'').toLowerCase()); }
function isReported(o) { return ['reported','已回報'].includes(String(o.payment_status||'').toLowerCase()); }
function payChip(o) {
  const ps=String(o.payment_status||'').toLowerCase(), os=String(o.order_status||'').toLowerCase();
  if (isClosed(o)) return '<span class="chip chip-gray">已關閉</span>';
  if (ps==='paid') return '<span class="chip chip-teal">已付款</span>';
  if (ps==='reported') return '<span class="chip chip-amber">待確認</span>';
  return '<span class="chip chip-gray">待付款</span>';
}
function fulfillChip(o) {
  const m={pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成'};
  const label=m[String(o.order_status||'pending').toLowerCase()]||'';
  if (!label||isClosed(o)) return '';
  if (['shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase())) return `<span class="chip chip-blue">${label}</span>`;
  if (String(o.order_status||'').toLowerCase()==='completed') return `<span class="chip chip-teal">${label}</span>`;
  return `<span class="chip chip-gray">${label}</span>`;
}

// Home
function updateHome() {
  const orders = S.orders;
  const paid = orders.filter(o=>isPaid(o)&&!isClosed(o));
  const pending = paid.filter(o=>!['shipped','ready_pickup','completed'].includes(String(o.order_status||'').toLowerCase()));
  const reported = orders.filter(o=>isReported(o)&&!isClosed(o));
  document.getElementById('stOrders').textContent = orders.length;
  document.getElementById('stPending').textContent = pending.length;
  document.getElementById('orderDot').classList.toggle('hidden', reported.length===0);

  if (S.dashboard) {
    const d = S.dashboard;
    document.getElementById('stEarn').textContent = money(d.confirmedDifference||0).replace('NT$ ','');
    const es = document.getElementById('earnSection');
    es.innerHTML = `<div class="earn-grid">
      <div class="earn-box"><div class="earn-label">已確認分潤</div><div class="earn-val teal">${money(d.confirmedDifference||0)}</div></div>
      <div class="earn-box"><div class="earn-label">待確認分潤</div><div class="earn-val">${money(d.pendingDifference||0)}</div></div>
      <div class="earn-box"><div class="earn-label">可申請結算</div><div class="earn-val teal">${money(d.availablePayout||0)}</div></div>
      <div class="earn-box"><div class="earn-label">待出貨訂單</div><div class="earn-val">${pending.length}</div></div>
    </div>`;
  }
  renderOrderCards('recentList', orders.slice(0,5), true);
}

// Orders
async function loadOrders() {
  document.getElementById('orderList').innerHTML='<div class="loading">載入中…</div>';
  document.getElementById('recentList').innerHTML='<div class="loading">載入中…</div>';
  try {
    // Use promoter-level order access
    if (!S.sessionId) throw new Error('請先確認場次');
    const d = await call('myPromoterSessionOrders',{memberToken:S.token,sessionId:S.sessionId},'POST');
    S.orders = Array.isArray(d)?d:(d.orders||[]);
    renderFilteredOrders();
    updateHome();
  } catch(e) {
    document.getElementById('orderList').innerHTML=`<div class="empty"><div class="empty-title">載入失敗</div><div class="empty-sub">${esc(e.message)}</div></div>`;
    document.getElementById('recentList').innerHTML='<div class="empty"><div class="empty-sub">無法載入</div></div>';
  }
}

function filterOrders(f) {
  S.activeFilter=f;
  document.querySelectorAll('.f-chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));
  renderFilteredOrders();
}
function renderFilteredOrders() {
  const f=S.activeFilter;
  let rows=S.orders;
  if(f==='reported') rows=rows.filter(o=>!isClosed(o)&&isReported(o));
  else if(f==='paid') rows=rows.filter(o=>!isClosed(o)&&isPaid(o));
  else if(f==='shipping') rows=rows.filter(o=>!isClosed(o)&&isPaid(o)&&['processing','shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase()));
  else if(f==='done') rows=rows.filter(o=>String(o.order_status||'').toLowerCase()==='completed');
  else if(f==='closed') rows=rows.filter(o=>isClosed(o));
  renderOrderCards('orderList', rows, false);
}
function renderOrderCards(elId, rows, compact) {
  const el=document.getElementById(elId);
  if(!rows.length){ el.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">沒有符合訂單</div></div>`; return; }
  el.innerHTML=rows.map(o=>{
    const name=esc(o.recipient_name||o.member_email||'訂單');
    const shortId=String(o.id||'').slice(-8).toUpperCase();
    return `<div class="order-card" onclick="openOrderModal('${esc(o.id)}')">
      <div class="order-head">
        <div class="order-name">#${shortId} ${name}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">${payChip(o)}${compact?'':fulfillChip(o)}</div>
      </div>
      <div class="order-meta">${fmt(o.created_at)} · ${o.fulfillment_type==='pickup'?'自取':'宅配'}</div>
      <div class="order-amount">${money(o.total_amount)}</div>
    </div>`;
  }).join('');
}

function openOrderModal(id) {
  const o=S.orders.find(x=>x.id===id); if(!o) return;
  const closed=isClosed(o), paid=isPaid(o);
  const os=String(o.order_status||'pending').toLowerCase();
  const delivery=String(o.fulfillment_type||'').toLowerCase();
  const osLabel={pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成',cancelled:'已取消',refunded:'已退款'}[os]||os;
  const body=`
    <div class="detail-row"><span class="detail-key">收件人</span><span class="detail-val">${esc(o.recipient_name||'—')} ${esc(o.recipient_phone||'')}</span></div>
    ${o.shipping_address?`<div class="detail-row"><span class="detail-key">地址</span><span class="detail-val">${esc(o.shipping_address)}</span></div>`:''}
    ${o.fulfillment_note?`<div class="detail-row"><span class="detail-key">備註</span><span class="detail-val">${esc(o.fulfillment_note)}</span></div>`:''}
    ${o.tracking_no?`<div class="detail-row"><span class="detail-key">物流單號</span><span class="detail-val">${esc(o.tracking_no)}</span></div>`:''}
    <div class="detail-row"><span class="detail-key">出貨狀態</span><span class="detail-val">${osLabel}</span></div>
    <div class="detail-row"><span class="detail-key">金額</span><span class="detail-val" style="font-size:17px;font-weight:900;color:var(--main)">${money(o.total_amount)}</span></div>`;
  let foot='';
  if (closed) {
    foot='<div style="text-align:center;color:var(--muted);font-size:14px">此單已關閉</div>';
  } else if (paid && !['completed'].includes(os)) {
    foot=`<div style="background:var(--yellow);border-radius:10px;padding:12px;text-align:center;font-size:14px;color:#7A5C00">
      📦 出貨管理請至<strong>平台後台</strong>操作<br>
      <a href="groupbuy-admin.html" style="color:var(--main2);font-weight:900">→ 前往平台後台</a>
    </div>`;
  } else {
    foot='<div style="text-align:center;color:var(--muted);font-size:14px;padding:8px">'+( paid?'已完成':'等待買家付款' )+'</div>';
  }
  openModal(`訂單 #${String(o.id||'').slice(-8).toUpperCase()}`, o.recipient_name||'', body, foot);
}

async function loadProducts() {

  }
}

function renderProducts() {
  const el=document.getElementById('productList');
  if (!S.products.length) {
    el.innerHTML='<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">還沒有商品</div><div class="empty-sub">點右上角「＋ 新增」建立商品</div></div>';

  }
  el.innerHTML = S.products.map(p=>`
    <div class="prod-card">

      <div class="prod-body">
        <div class="prod-name">${esc(p.name||'未命名商品')}</div>

function openAddProduct() {

     <button class="btn btn-outline" onclick="closeModal()">取消</button>`);

function openEditProduct(id) {

    `<button class="btn btn-teal" onclick="doSaveProduct('${esc(id)}')">儲存</button>

function productFormHtml(p) {
  const promoterTierOne=(Array.isArray(p.default_promoter_tiers_json)?p.default_promoter_tiers_json:[]).find(t=>Number(t?.minQty)===1);
  return `
    <div class="form-field"><label>商品名稱 *</label><input id="pName" value="${esc(p.name||'')}" placeholder="商品名稱"></div>
    <div class="form-field"><label>售價（NT$）*</label><input id="pPrice" type="number" value="${p.price||''}" placeholder="0" inputmode="decimal"></div>
    <div class="form-field"><label>原價（NT$，可留空）</label><input id="pOriginal" type="number" value="${p.original_price||''}" placeholder="0" inputmode="decimal"></div>
    <div class="form-field"><label>庫存數量（空白=無限制）</label><input id="pStock" type="number" value="${p.stock_qty!=null?p.stock_qty:''}" placeholder="不填為無限制" inputmode="numeric"></div>
    <div class="form-field"><label>商品說明</label><textarea id="pDesc" rows="3">${esc(p.description||'')}</textarea></div>
    <div class="form-field"><label>商品圖片 URL</label><input id="pImg" value="${esc(p.image_url||'')}"></div>
    <div class="form-field"><label>團購主 1 件採購價（新增商品必填）</label><input id="pPromoterPrice" type="number" min="0" value="${promoterTierOne?.basePrice??''}" placeholder="0" inputmode="decimal"></div>
    <div class="form-field">
      <label>買幾送幾</label>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--text)"><input id="pBuyGet" type="checkbox" ${p.buy_get_enabled?'checked':''} style="width:auto"> 啟用</label>
        <span>買</span><input id="pBuyQty" type="number" min="1" value="${p.buy_qty||10}" style="width:72px" inputmode="numeric">
        <span>送</span><input id="pFreeQty" type="number" min="1" value="${p.free_qty||1}" style="width:72px" inputmode="numeric">
      </div>
    </div>`;
}
async function doSaveProduct(id) {
  const original=S.products.find(x=>String(x.id)===String(id||''))||{};
  const name=document.getElementById('pName')?.value.trim()||'';
  const price=Number(document.getElementById('pPrice')?.value||0);
  const buyGetEnabled=!!document.getElementById('pBuyGet')?.checked;
  const buyQty=Number(document.getElementById('pBuyQty')?.value||0);
  const freeQty=Number(document.getElementById('pFreeQty')?.value||0);
  const promoterPrice=Number(document.getElementById('pPromoterPrice')?.value||0);
  if (!name||price<=0) { toast('請填寫商品名稱與售價',true); return; }
  if (buyGetEnabled&&(buyQty<1||freeQty<1)) { toast('啟用買幾送幾時，買與送都必須大於 0',true); return; }
  const existingPromoterTiers=Array.isArray(original.default_promoter_tiers_json)?original.default_promoter_tiers_json:[];
  let defaultPromoterTiers=existingPromoterTiers.filter(t=>Number(t?.minQty)!==1);
  if (promoterPrice>0) defaultPromoterTiers=[{minQty:1,basePrice:promoterPrice},...defaultPromoterTiers];
  if (!defaultPromoterTiers.some(t=>Number(t?.minQty)===1&&Number(t?.basePrice)>0)) { toast('請填寫團購主 1 件採購價',true); return; }
  const payload={
    memberToken:S.token,sessionId:S.sessionId,id:id||'',status:original.status||'active',
    name,category:original.category||'',description:document.getElementById('pDesc')?.value||'',
    price,originalPrice:Number(document.getElementById('pOriginal')?.value||0)||null,
    supplyCost:original.supply_cost??null,
    stockQty:document.getElementById('pStock')?.value!==''?Number(document.getElementById('pStock')?.value):null,
    perMemberLimit:original.per_member_limit??null,
    quantityTiers:Array.isArray(original.quantity_tiers_json)?original.quantity_tiers_json:[],
    defaultPromoterTiers,
    buyGetEnabled,buyQty:buyGetEnabled?buyQty:0,freeQty:buyGetEnabled?freeQty:0,
    promoterBuyGetEnabled:!!original.promoter_buy_get_enabled,
    promoterBuyQty:Number(original.promoter_buy_qty||0),promoterFreeQty:Number(original.promoter_free_qty||0),
    imageRefs:[]
  };
  try {
    await call('saveSessionProduct',payload);
    toast('商品設定已儲存 ✓');
    closeModal();
    await loadProducts();
  } catch(e) { toast(e.message||'儲存失敗',true); }
}

        <div class="earn-box"><div class="earn-label">可申請結算</div><div class="earn-val teal">${money(d.availablePayout||0)}</div></div>

async function doRequestPayout(available) {
  const amount=prompt(`申請結算金額（最多 ${money(available)}）：`,String(available));
  if (amount===null) return;
  const num=Number(amount);
  if (isNaN(num)||num<=0) { toast('請輸入有效金額',true); return; }
  if (!confirm(`確定申請結算 ${money(num)}？`)) return;
  try { await call('requestGroupBuyPayout',{memberToken:S.token,amount:num}); toast('申請已送出'); loadEarnings(); } catch(e){toast(e.message,true);}
}

function copyLink(url) {
  if (!url) { toast('無推廣連結',true); return; }
  navigator.clipboard?.writeText(url).then(()=>toast('已複製推廣連結')).catch(()=>prompt('複製此連結：',url));
}

// Boot
async function boot() {
  const tok = localStorage.getItem(TK_KEY);
  if (!tok) { document.getElementById('login').style.display='flex'; return; }
  S.token = tok;
  try {
    // Validate member token
    const me = await call('getMember',{memberToken:tok});
    S.member = me;

    // Get promoter identity to find session
    // groupBuyIdentity returns all sessions this member manages as promoter
    const identity = await call('groupBuyIdentity',{memberToken:tok}).catch(()=>null);
    const assignments = identity?.promoterAssignments||[];
    if (!assignments.length) {
      throw new Error('你目前沒有已啟用的場次，請聯繫平台開通商家資格');
    }
    S.sessionId = assignments[0].sessionId || assignments[0].session_id || '';
    if (!S.sessionId) throw new Error('無法取得場次 ID，請聯繫平台管理員');

    // Try to get session name
    const sessData = await call('groupBuySessions',{},'GET').catch(()=>({sessions:[]}));
    const allSessions = Array.isArray(sessData)?sessData:(sessData.sessions||[]);
    const mySession = allSessions.find(s=>String(s.id)===String(S.sessionId));
    S.sessionName = mySession?.name || assignments[0].sessionId;

    // Update header
    document.getElementById('hdrSession').textContent = S.sessionName;

    // Load promoter dashboard for earnings
    const dash = await call('myPromoterDashboard',{memberToken:tok}).catch(()=>null);
    S.dashboard = dash;

    // Show app
    document.getElementById('login').style.display='none';
    document.getElementById('app').hidden = false;

    // Load orders
    await loadOrders();
    updateHome();
  } catch(e) {
    // 身份不符：一般買家 / 未核准的申請者 → 只能用 groupbuy.html，不能進商家後台
    if (/promoter|商家|session|assignment|not found/i.test(e.message)) {
      document.getElementById('loginErr').textContent = '您目前沒有商家管理權限，請聯繫平台開通。';
    } else {
      localStorage.removeItem(TK_KEY);
      document.getElementById('loginErr').textContent = e.message||'登入已過期，請重新登入';
    }
    document.getElementById('login').style.display='flex';
  }
}

boot();
