<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store">
<title>我的團購 · 商家管理</title>
<style>
:root{
  --navy:#285E50; --teal:#2D7A66; --teal-lt:#B7EDDB;
  --amber:#F59E0B; --amber-lt:#FEF9C3;
  --red:#EF4444; --red-lt:#FEE2E2;
  --blue:#3B82F6; --blue-lt:#DBEAFE;
  --bg:#F3FBF8; --card:#FFF;
  --text:#18352D; --muted:#60736D; --line:#CFE7DF;
  --r:14px; --shadow:0 1px 4px rgba(0,0,0,.08);
  --hdr:56px; --nav:calc(60px + env(safe-area-inset-bottom,0px));
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ── Login ── */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#B7EDDB}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:360px}
.login-badge{width:64px;height:64px;background:var(--navy);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:900;color:#fff}
.login-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.field input:focus{outline:none;border-color:var(--teal)}
.btn-login{width:100%;padding:14px;border-radius:12px;border:none;background:var(--teal);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.btn-login:active{opacity:.9}
.login-err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.login-note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}

/* ── App ── */
#app{display:flex;flex-direction:column;height:100dvh}
header{height:var(--hdr);background:#B7EDDB;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:20;border-bottom:1px solid #94D8C2}
.hdr-logo{color:var(--text);font-size:17px;font-weight:900;flex-shrink:0}
.hdr-session{flex:1;min-width:0}.hdr-session select{width:100%;min-height:38px;border:1px solid #82CDB5;border-radius:9px;background:rgba(255,255,255,.72);color:var(--text);padding:6px 9px;font-weight:800}.hdr-session option{color:var(--text);background:#fff}
.hdr-right{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:10px;border:none;background:rgba(40,94,80,.12);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.icon-btn:active{background:rgba(40,94,80,.22)}
#main{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav)+8px)}
.tab{padding:14px 14px 0;display:none}
.tab.active{display:block}
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:var(--safe-b)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);cursor:pointer;position:relative;padding:8px 0}
.nav-btn.active{color:var(--teal)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:11px;font-weight:700}
.nav-dot{position:absolute;top:6px;right:calc(50% - 12px);width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:900;margin-bottom:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:900;line-height:1;margin-bottom:3px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.stat.teal .stat-num{color:var(--teal)}
.stat.amber .stat-num{color:var(--amber)}
.stat.blue .stat-num{color:var(--blue)}

/* ── Product Cards ── */
.prod-card{background:var(--card);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:stretch}
.prod-thumb{width:80px;min-height:80px;flex-shrink:0;background:#F0FDF4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;overflow:hidden}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.prod-body{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:3px}
.prod-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-price{font-size:14px;font-weight:700;color:var(--teal)}
.prod-stock{font-size:12px;color:var(--muted)}
.prod-meta{font-size:12px;color:var(--muted);white-space:normal}
.prod-edit{padding:10px 14px;border:none;background:none;color:var(--teal);font-size:14px;font-weight:800;border-left:1px solid var(--line);cursor:pointer;flex-shrink:0;align-self:stretch;display:flex;align-items:center}

/* ── Order Cards ── */
.order-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.order-card:active{opacity:.92}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.order-name{font-size:15px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-meta{font-size:13px;color:var(--muted)}
.order-amount{font-size:17px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-amber{background:var(--amber-lt);color:#92400E}
.chip-teal{background:var(--teal-lt);color:#0f766e}
.chip-red{background:var(--red-lt);color:#991B1B}
.chip-blue{background:var(--blue-lt);color:#1E40AF}
.chip-gray{background:#F1F5F9;color:var(--muted)}

/* ── Filter Bar ── */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.f-chip{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0}
.f-chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ── Earnings ── */
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.earn-box{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.earn-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.earn-val{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.earn-val.teal{color:var(--teal)}

/* ── Modal Sheet ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
#overlay.show{opacity:1}
#sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:50;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);padding-bottom:var(--safe-b)}
#sheet.show{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:#D1D5DB;border-radius:2px;margin:12px auto 8px;flex-shrink:0}
#sheetHead{padding:0 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.sh-title{font-size:18px;font-weight:900}
.sh-sub{font-size:13px;color:var(--muted);margin-top:2px}
#sheetBody{overflow-y:auto;flex:1;padding:16px 18px}
#sheetFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* ── Form ── */
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--teal)}
.form-field textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-check{display:flex;align-items:center;gap:8px;margin:9px 0;font-weight:800}.form-check input{width:20px;height:20px}.image-preview{width:92px;height:92px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f8fafc;display:grid;place-items:center;margin-bottom:8px}.image-preview img{width:100%;height:100%;object-fit:cover}.order-items{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.order-item{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}

/* ── Detail Rows ── */
.detail-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14px}
.detail-row:last-child{border:none}
.detail-key{color:var(--muted);font-weight:600;flex-shrink:0}
.detail-val{font-weight:700;text-align:right;word-break:break-all}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer}
.btn:active{opacity:.85}
.btn-teal{background:var(--teal);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn-sm{padding:10px;font-size:14px;border-radius:10px;width:auto}

/* ── Empty / Loading ── */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:14px}
.loading{text-align:center;padding:36px;color:var(--muted);font-size:14px}

/* ── Section Heading ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.section-hd h3{font-size:15px;font-weight:800}
.add-btn{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;border:none;background:var(--teal);color:#fff;font-size:13px;font-weight:800;cursor:pointer}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}

@media(min-width:640px){
  #main,#nav,#sheet{max-width:640px;left:50%;transform:translateX(-50%)}
  #sheet.show{transform:translateX(-50%) translateY(0)}
  #nav{transform:translateX(-50%)}
}
@media(max-width:430px){.form-grid{grid-template-columns:1fr}.prod-edit{padding:8px 10px}.detail-row{align-items:flex-start}.detail-val{max-width:68%}}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login">
  <div class="login-card">
    <div class="login-badge">🏪</div>
    <h1 class="login-title">商家管理中心</h1>
    <p class="login-sub">請使用 2BL 會員帳號登入</p>
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com" inputmode="email">
    </div>
    <div class="field">
      <label>手機號碼</label>
      <input id="loginPhone" type="tel" autocomplete="tel" placeholder="0912345678" inputmode="tel">
    </div>
    <button class="btn-login" onclick="doLogin()">登入</button>
    <div id="loginErr" class="login-err"></div>
    <p class="login-note">尚未有帳號？請聯繫平台開通商家資格</p>
  </div>
</div>

<!-- ── App ── -->
<div id="app" hidden>
  <header>
    <span class="hdr-logo">🏪</span>
    <div class="hdr-session"><select id="merchantSessionPicker" onchange="switchMerchantSession(this.value)"><option>載入中…</option></select></div>
    <div class="hdr-right">
      <button class="icon-btn" onclick="doLogout()" title="登出">🚪</button>
    </div>
  </header>

  <main id="main">
    <!-- 首頁 -->
    <div id="t-home" class="tab active">
      <div class="stat-row">
        <div class="stat teal" onclick="goTab('orders')">
          <div class="stat-num num" id="stOrders">—</div>
          <div class="stat-label">總訂單</div>
        </div>
        <div class="stat amber" onclick="goTab('orders')">
          <div class="stat-num num" id="stPending">—</div>
          <div class="stat-label">待出貨</div>
        </div>
        <div class="stat blue">
          <div class="stat-num num" id="stEarn">—</div>
          <div class="stat-label">分潤</div>
        </div>
      </div>
      <div id="earnSection"></div>
      <div class="section-hd">
        <h3>最近訂單</h3>
        <button class="add-btn" onclick="goTab('orders')">查看全部 →</button>
      </div>
      <div id="recentList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 商品 -->
    <div id="t-products" class="tab">
      <div class="section-hd">
        <h3>我的商品</h3>
        <button class="add-btn" onclick="openAddProduct()">＋ 新增</button>
      </div>
      <div id="productList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 訂單 -->
    <div id="t-orders" class="tab">
      <div class="section-hd" style="margin-top:0"><h3>場次訂單</h3><button class="add-btn" onclick="downloadSupplierCsv()">下載中文出貨單</button></div>
      <div class="filter-bar">
        <button class="f-chip active" data-f="all" onclick="filterOrders('all')">全部</button>
        <button class="f-chip" data-f="reported" onclick="filterOrders('reported')">待確認</button>
        <button class="f-chip" data-f="paid" onclick="filterOrders('paid')">已付款</button>
        <button class="f-chip" data-f="shipping" onclick="filterOrders('shipping')">出貨中</button>
        <button class="f-chip" data-f="done" onclick="filterOrders('done')">完成</button>
        <button class="f-chip" data-f="closed" onclick="filterOrders('closed')">關閉</button>
      </div>
      <div id="orderList"><div class="loading">載入中…</div></div>
    </div>

    <!-- 帳務 -->
    <div id="t-earn" class="tab">
      <div id="earnContent"><div class="loading">載入中…</div></div>
    </div>
  </main>

  <nav id="nav">
    <button class="nav-btn active" id="nb-home" onclick="goTab('home')">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">首頁</span>
    </button>
    <button class="nav-btn" id="nb-products" onclick="goTab('products')">
      <span class="nav-icon">📦</span>
      <span class="nav-label">商品</span>
    </button>
    <button class="nav-btn" id="nb-orders" onclick="goTab('orders')">
      <span class="nav-icon">☰</span>
      <span class="nav-label">訂單</span>
      <span id="orderDot" class="nav-dot hidden"></span>
    </button>
    <button class="nav-btn" id="nb-earn" onclick="goTab('earn')">
      <span class="nav-icon">💰</span>
      <span class="nav-label">帳務</span>
    </button>
  </nav>
</div>

<div id="overlay" hidden onclick="closeModal()"></div>
<div id="sheet" hidden>
  <div class="sheet-handle"></div>
  <div id="sheetHead" class="sheet-head"></div>
  <div id="sheetBody" class="sheet-body"></div>
  <div id="sheetFoot" class="sheet-foot"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
const API = location.protocol==='https:'&&/(^|\.)2b-love\.com$/i.test(location.hostname)
  ? location.origin+'/s/api' : 'https://2bl-v7.ndiangrace.workers.dev';
const TENANT = 'tuibile';
const TK_KEY = '2bl_member_token';
const LEGACY_TK_KEY = '2bl_merchant_token';
const SESSION_KEY = '2bl_merchant_session';

const S = { token:'', member:null, sessionId:'', sessionName:'', assignments:[], orders:[], orderItems:[], products:[], dashboard:null, activeFilter:'all', activeTab:'home' };

async function call(action, data={}, method='POST') {
  const payload = { action, tenant:TENANT, ...data };
  let r;
  if (method==='GET') {
    const params = new URLSearchParams(payload);
    r = await fetch(`${API}?${params}`,{cache:'no-store'});
  } else {
    r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
  }
  const j = await r.json().catch(()=>({error:'回應格式錯誤'}));
  if (j.error) throw new Error(j.error);
  return j;
}

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>'NT$ '+Number(n||0).toLocaleString();
const fmt = d=>{ if(!d)return '—'; return new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); };

// Auth
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  if (!email||!phone) { setLoginErr('請輸入 Email 與手機號碼'); return; }
  setLoginErr('');
  try {
    const j = await call('memberEmailPhoneLogin',{email,phone});
    localStorage.setItem(TK_KEY, j.token);
    localStorage.removeItem(LEGACY_TK_KEY);
    S.token = j.token;
    await boot();
  } catch(e) { setLoginErr(e.message||'登入失敗，請確認 Email 與手機號碼'); }
}
function setLoginErr(msg) { document.getElementById('loginErr').textContent = msg; }
function doLogout() { localStorage.removeItem(TK_KEY);localStorage.removeItem(LEGACY_TK_KEY);localStorage.removeItem(SESSION_KEY);location.reload(); }

function openModal(title, sub, bodyHtml, footHtml) {
  document.getElementById('sheetHead').innerHTML = `<div class="sh-title">${esc(title)}</div>${sub?`<div class="sh-sub">${esc(sub)}</div>`:''}`;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetFoot').innerHTML = footHtml;
  const ov=document.getElementById('overlay'), sh=document.getElementById('sheet');
  ov.hidden=false; sh.hidden=false;
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
}
function closeModal() {
  const ov=document.getElementById('overlay'), sh=document.getElementById('sheet');
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(()=>{ ov.hidden=true; sh.hidden=true; }, 300);
}

let _tt;
function toast(msg, isErr=false) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=isErr?'show err':'show';
  clearTimeout(_tt); _tt=setTimeout(()=>el.className='',3000);
}

function goTab(name) {
  ['home','products','orders','earn'].forEach(t=>{
    document.getElementById('t-'+t).classList.toggle('active',t===name);
    document.getElementById('nb-'+t).classList.toggle('active',t===name);
  });
  S.activeTab=name;
  if (name==='products' && !S.products.length) loadProducts();
  if (name==='orders' && !S.orders.length) loadOrders();
  if (name==='earn') loadEarnings();
}

// Status helpers
function isClosed(o) { return ['cancelled','refunded','已取消','已退款'].includes(String(o.order_status||'').toLowerCase()); }
function isPaid(o) { return ['paid','已付款'].includes(String(o.payment_status||'').toLowerCase()); }
function isReported(o) { return ['reported','已回報'].includes(String(o.payment_status||'').toLowerCase()); }
function payChip(o) {
  const ps=String(o.payment_status||'').toLowerCase(), os=String(o.order_status||'').toLowerCase();
  if (isClosed(o)) return '<span class="chip chip-gray">已關閉</span>';
  if (ps==='paid') return '<span class="chip chip-teal">已付款</span>';
  if (ps==='reported') return '<span class="chip chip-amber">待確認</span>';
  return '<span class="chip chip-gray">待付款</span>';
}
function fulfillChip(o) {
  const m={pending:'待處理',processing:'處理中',ready_pickup:'可取貨',shipped:'已出貨',completed:'已完成'};
  const label=m[String(o.order_status||'pending').toLowerCase()]||'';
  if (!label||isClosed(o)) return '';
  if (['shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase())) return `<span class="chip chip-blue">${label}</span>`;
  if (String(o.order_status||'').toLowerCase()==='completed') return `<span class="chip chip-teal">${label}</span>`;
  return `<span class="chip chip-gray">${label}</span>`;
}

function renderFilteredOrders() {

  else if(f==='shipping') rows=rows.filter(o=>!isClosed(o)&&isPaid(o)&&['processing','shipped','ready_pickup'].includes(String(o.order_status||'').toLowerCase()));

function jsonArray(value) { if(Array.isArray(value))return value; try{const x=JSON.parse(value||'[]');return Array.isArray(x)?x:[];}catch{return [];} }

function parseTiers(value, priceKey) {
  const text=String(value||'').trim(); if(!text)return [];
  const rows=text.split(/[,，;；\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d+)\s*[:：=]\s*(\d+(?:\.\d+)?)$/);if(!m)throw new Error(`級距格式錯誤：${x}`);return {minQty:Number(m[1]),[priceKey]:Number(m[2])};});
  rows.sort((a,b)=>a.minQty-b.minQty); if(new Set(rows.map(x=>x.minQty)).size!==rows.length)throw new Error('級距件數不可重複'); return rows;
}

async function prepareProductImage(file) {

  let blob=await new Promise(r=>canvas.toBlob(r,'image/webp',.82));if(!blob)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.82));if(!blob)throw new Error('圖片處理失敗');if(blob.size>700000)throw new Error('圖片壓縮後仍超過 700KB，請換較小圖片');

}

        <div class="card-title">${esc(p.session?.name||'場次')}</div>
        <div style="font-size:13px;color:var(--muted)">推廣碼：${esc(p.referral_code||p.public_handle||'—')}</div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" onclick="copyLink('${esc(p.promoterShareUrl||'')}')">複製推廣連結</button>
        </div>
      </div>`).join('')}`;
    updateHome();
  } catch(e) { el.innerHTML=`<div class="empty"><div class="empty-title">載入失敗</div><div class="empty-sub">${esc(e.message)}</div></div>`; }
}

async function doRequestPayout(available) {
  const amount=prompt(`申請結算金額（最多 ${money(available)}）：`,String(available));
  if (amount===null) return;
  const num=Number(amount);
  if (isNaN(num)||num<=0) { toast('請輸入有效金額',true); return; }
  if (!confirm(`確定申請結算 ${money(num)}？`)) return;
  try { await call('requestGroupBuyPayout',{memberToken:S.token,amount:num}); toast('申請已送出'); loadEarnings(); } catch(e){toast(e.message,true);}
}

function copyLink(url) {
  if (!url) { toast('無推廣連結',true); return; }
  navigator.clipboard?.writeText(url).then(()=>toast('已複製推廣連結')).catch(()=>prompt('複製此連結：',url));
}

// Boot
async function boot() {
  let tok = localStorage.getItem(TK_KEY);
  if(!tok){tok=localStorage.getItem(LEGACY_TK_KEY)||'';if(tok){localStorage.setItem(TK_KEY,tok);localStorage.removeItem(LEGACY_TK_KEY);}}
  if (!tok) { document.getElementById('login').style.display='flex'; return; }
  S.token = tok;
  try {
    // Validate member token
    const me = await call('getMember',{memberToken:tok});
    S.member = me;

    // Get promoter identity to find session
    const identity = await call('groupBuyIdentity',{memberToken:tok});
    const assignments = identity.promoterAssignments||[];
    if (!assignments.length) {
      throw new Error('你目前沒有已啟用的場次，請聯繫平台開通商家資格');
    }
    const dash = await call('myPromoterDashboard',{memberToken:tok}).catch(()=>null);
    S.dashboard = dash;
    const names=new Map((dash?.sessions||[]).map(x=>[String(x.id),x.name]));
    S.assignments=assignments.map(x=>({...x,sessionId:String(x.sessionId||x.session_id||''),sessionName:names.get(String(x.sessionId||x.session_id||''))||String(x.sessionId||x.session_id||'場次')})).filter(x=>x.sessionId);
    const remembered=localStorage.getItem(SESSION_KEY),chosen=S.assignments.find(x=>x.sessionId===remembered)||S.assignments[0];
    S.sessionId=chosen.sessionId;S.sessionName=chosen.sessionName;localStorage.setItem(SESSION_KEY,S.sessionId);renderSessionPicker();

    // Show app
    document.getElementById('login').style.display='none';
    document.getElementById('app').hidden = false;

    // Load orders
    await loadOrders();
    updateHome();
  } catch(e) {
    localStorage.removeItem(TK_KEY);
    document.getElementById('loginErr').textContent = e.message||'登入已過期，請重新登入';
    document.getElementById('login').style.display='flex';
  }
}

function renderSessionPicker(){const el=document.getElementById('merchantSessionPicker');el.innerHTML=S.assignments.map(x=>`<option value="${esc(x.sessionId)}" ${x.sessionId===S.sessionId?'selected':''}>${esc(x.sessionName)}</option>`).join('');}
async function switchMerchantSession(sessionId){const next=S.assignments.find(x=>x.sessionId===String(sessionId));if(!next||next.sessionId===S.sessionId)return;S.sessionId=next.sessionId;S.sessionName=next.sessionName;localStorage.setItem(SESSION_KEY,S.sessionId);S.orders=[];S.orderItems=[];S.products=[];renderSessionPicker();toast(`已切換：${S.sessionName}`);await loadOrders();if(S.activeTab==='products')await loadProducts();if(S.activeTab==='earn')await loadEarnings();}

boot();
</script>
