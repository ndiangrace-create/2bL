name: temp first member production deploy
on:
  push:
    branches: [main]
    paths: [docs/first-member-production-deploy-trigger.md]
permissions:
  contents: read
  actions: read
concurrency:
  group: 2bl-v7-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'ndiangrace-create/2bL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_PRE_VERSION: 88778f1f-65c0-43b7-a3ce-5a50029f2f93
      APPROVED_SOURCE_COMMIT: 631f3beb34c5eda1dd30439f8fd9209c1e2608c2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact project and approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ndiangrace-create/2bL"
          test "$GITHUB_REF" = "refs/heads/main"
          test "2bl-v7" != "tobeloved-api"
          git cat-file -e "${APPROVED_SOURCE_COMMIT}^{commit}"
          git diff --quiet "${APPROVED_SOURCE_COMMIT}" HEAD -- worker.js index.html admin.html onsite.html supabase
      - name: Validate code and first member closed loop
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/test-first-member-registration.mjs
          node scripts/test-member-profile-system.mjs
          node scripts/test-member-login-token.mjs
          node scripts/test-member-record-session.mjs
          node scripts/test-member-social-review-notice.mjs
          node scripts/test-admin-operator-simulation.mjs
          node scripts/verify-data-contract.mjs --strict
      - name: Verify current Cloudflare version before deploy
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token) throw new Error('Cloudflare secrets missing');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/2bl-v7/versions?per_page=5`,{headers:{Authorization:`Bearer ${token}`}});
          const j=await r.json();
          if(!r.ok||j.success===false) throw new Error('Cloudflare version read failed');
          const list=Array.isArray(j.result?.items)?j.result.items:Array.isArray(j.result?.versions)?j.result.versions:Array.isArray(j.result)?j.result:[];
          const id=String(list[0]?.id||'');
          console.log('pre_version='+id);
          if(id!==process.env.EXPECTED_PRE_VERSION) throw new Error(`pre-version changed: ${id}`);
          NODE
      - name: Build exact Wrangler bundle without deploy
        run: |
          npx --yes wrangler@4.102.0 --version
          rm -rf .automation/wrangler-first-member
          npx --yes wrangler@4.102.0 deploy --config wrangler.jsonc --dry-run --strict --outdir .automation/wrangler-first-member
      - name: Deploy only 2bl-v7
        run: |
          npx --yes wrangler@4.102.0 deploy --config wrangler.jsonc --keep-vars --message "GitHub ${GITHUB_SHA}; approved first-member registration production deploy"
      - name: Verify deployed source equals tested bundle
        env:
          ALLOW_WORKER_DIFF: "false"
          BOOTSTRAP_SOURCE: "false"
          EXPECTED_WORKER_SOURCE_PATH: ".automation/wrangler-first-member/worker.js"
        run: |
          node scripts/cloudflare-readonly-audit.mjs
          node - <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('.automation/cloudflare-audit.json','utf8'));
          if(!d.worker_source_matches_deployment) throw new Error('deployed worker != tested bundle');
          if(d.worker_name!=='2bl-v7') throw new Error('wrong worker');
          if(!Array.isArray(d.routes)||!d.routes.some(x=>x.pattern==='2b-love.com/s/*')) throw new Error('route missing');
          console.log(JSON.stringify({ok:true,version:d.current_version_id,sha256:d.deployed_content_sha256,size:d.deployed_parts?.[0]?.size||0}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-member-production-deploy-${{ github.run_id }}
          path: |
            .automation/cloudflare-audit.json
            .automation/data-contract-report.json
            .automation/wrangler-first-member/worker.js
          if-no-files-found: warn
          retention-days: 30
