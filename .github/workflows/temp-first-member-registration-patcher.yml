name: temp first member registration patcher
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-test:
    if: github.repository == 'ndiangrace-create/2bL' && github.head_ref == 'agent/fix-first-member-registration-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-member-registration-20260824
          fetch-depth: 0
      - name: Apply scoped patch if still staged
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "agent/fix-first-member-registration-20260824"
          if [ -f scripts/_apply_first_member_registration_fix.mjs ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            node scripts/_apply_first_member_registration_fix.mjs
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate final branch closed loop and regressions
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/test-first-member-registration.mjs
          node scripts/test-member-profile-system.mjs
          node scripts/test-member-login-token.mjs
          node scripts/test-member-record-session.mjs
          node scripts/test-member-social-review-notice.mjs
          node scripts/test-admin-operator-simulation.mjs
          node scripts/verify-data-contract.mjs --strict
          git restore .automation/data-contract-report.json 2>/dev/null || true
          if [ "${{ steps.patch.outputs.applied }}" = "true" ]; then
            changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
            printf '%s\n' "$changed"
            test "$changed" = 'worker.js'
          else
            git diff --exit-code
          fi
      - name: Commit tested runtime file
        if: steps.patch.outputs.applied == 'true'
        run: |
          set -euo pipefail
          rm -f scripts/_apply_first_member_registration_fix.mjs
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js scripts/test-first-member-registration.mjs
          git add -u scripts/_apply_first_member_registration_fix.mjs
          git commit -m "fix: allow first-time member registration"
          git push origin HEAD:agent/fix-first-member-registration-20260824
