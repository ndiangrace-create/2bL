name: member-admin-branch-patch
on:
  push:
    branches: [agent/member-admin-edit]
    paths: ['docs/_member_admin_trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/member-admin-edit
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_apply_member_admin_patch.py
      - name: Test
        shell: bash
        run: |
          node scripts/test-member-admin-edit.mjs
          node --check worker.js
          for f in scripts/test-*.mjs; do node "$f"; done
          node scripts/verify-data-contract.mjs --strict
      - name: Commit branch-only result
        shell: bash
        run: |
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f docs/_member_admin_trigger scripts/_apply_member_admin_patch.py .github/workflows/_member_admin_apply.yml .github/workflows/_one_shot_member_admin_edit.yml || true
          git add admin.html index.html worker.js lib/admin-authorization.js scripts/test-member-admin-edit.mjs docs/member-admin-edit.md DATA_CONTRACT.md
          git commit -m "feat: add audited admin member profile correction"
          git push origin HEAD:agent/member-admin-edit
