name: temp member social review notice patch
on:
  push:
    branches: [agent/member-social-review-notice-20260822]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.repository == 'ndiangrace-create/2bL' && github.ref == 'refs/heads/agent/member-social-review-notice-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard target
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ndiangrace-create/2bL"
          test "$GITHUB_REF" = "refs/heads/agent/member-social-review-notice-20260822"
          test -f scripts/_apply_member_social_review_notice.mjs
          test -f scripts/test-member-social-review-notice.mjs
      - name: Apply scoped patch
        run: node scripts/_apply_member_social_review_notice.mjs
      - name: Validate syntax and regression
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/test-member-social-review-notice.mjs
          node scripts/test-member-profile-system.mjs
          node scripts/test-member-login-token.mjs
          node scripts/test-admin-operator-simulation.mjs
          node scripts/verify-data-contract.mjs --strict
      - name: Verify only intended runtime files changed
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/changed.txt
          grep -qx 'index.html' /tmp/changed.txt
          grep -qx 'worker.js' /tmp/changed.txt
          if grep -Ev '^(index\.html|worker\.js|\.automation/data-contract-report\.json)$' /tmp/changed.txt | grep -q .; then echo 'Unexpected file changed'; exit 1; fi
      - name: Commit tested runtime files and clean temp patcher
        run: |
          set -euo pipefail
          rm -f scripts/_apply_member_social_review_notice.mjs .github/workflows/_temp_member_social_review_notice.yml
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html worker.js scripts/test-member-social-review-notice.mjs
          git add -u scripts/_apply_member_social_review_notice.mjs .github/workflows/_temp_member_social_review_notice.yml
          git commit -m "fix: make social links advisory at member application"
          git push origin HEAD:agent/member-social-review-notice-20260822
