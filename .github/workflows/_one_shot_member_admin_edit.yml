name: one-shot-member-admin-edit
on:
  push:
    branches: [agent/member-admin-edit]
    paths:
      - '.github/workflows/_one_shot_member_admin_edit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/member-admin-edit
          fetch-depth: 0
      - name: Apply closed-loop member edit patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label, count=1):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, count)

          # ---------- admin.html ----------
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          marker='function openMemberDetail(email){'
          if 'function memberEditCard(m)' not in s:
              helper=r'''function memberEditCard(m){
  const email=String(m.email||'').trim();
  const v=(x)=>attr(String(x==null?'':x));
  return '<div class="report-card" style="margin-bottom:12px;background:#f7fbf7">'
    +'<div class="report-title">協助修正會員基本資料</div>'
    +'<div class="sub" style="margin:4px 0 10px">適合協助不熟悉手機操作的會員。Email 是目前登入與歷史資料的重要識別，不在這裡直接修改；其他資料儲存後會由正式資料庫重新讀取。</div>'
    +'<div class="form-grid">'
      +'<div class="form-field"><label>Email（唯讀）</label><input value="'+v(email)+'" disabled></div>'
      +'<div class="form-field"><label>姓名</label><input id="me_name" value="'+v(m.name||m.displayName||'')+'"></div>'
      +'<div class="form-field"><label>手機</label><input id="me_phone" inputmode="tel" value="'+v(m.phone||m.mobile||'')+'" placeholder="09xxxxxxxx"></div>'
      +'<div class="form-field"><label>品牌名稱</label><input id="me_brand" value="'+v(m.brandName||m.brand_name||m.brand||'')+'"></div>'
      +'<div class="form-field"><label>販售類別</label><input id="me_category" value="'+v(m.sellCategory||m.sell_category||m.category||'')+'" placeholder="文創／美食／二手／其他"></div>'
      +'<div class="form-field"><label>Facebook</label><input id="me_fb" value="'+v(m.fb||m.fbUrl||m.fb_url||'')+'"></div>'
      +'<div class="form-field"><label>Instagram</label><input id="me_ig" value="'+v(m.ig||m.igUrl||m.ig_url||'')+'"></div>'
      +'<div class="form-field"><label>官網／作品連結</label><input id="me_web" value="'+v(memberOfficialUrl(m))+'"></div>'
      +'<div class="form-field full"><label>品牌介紹</label><textarea id="me_intro">'+safe(String(m.intro||m.brandIntro||m.brand_intro||''))+'</textarea></div>'
    +'</div>'
    +'<div class="notice" style="margin-top:10px"><b>手機變更會影響下一次登入。</b><div class="sub">系統會保留修改前後紀錄；歷史報名、付款、退款、活動金與排位不會因修改會員基本資料而被覆寫。</div></div>'
    +'<div class="card-actions"><button class="btn" onclick="saveAdminMemberProfile(\''+attr(email)+'\')">儲存會員資料</button><button class="btn secondary" onclick="openMemberEditHistory(\''+attr(email)+'\')">查看修改紀錄</button></div>'
  +'</div>';
}
async function saveAdminMemberProfile(email){
  const m=(AdminState.members||[]).find(x=>String(x.email||'').toLowerCase()===String(email||'').toLowerCase());
  if(!m){toast('找不到這位會員');return;}
  const profile={
    name:String(($('me_name')||{}).value||'').trim(),
    phone:String(($('me_phone')||{}).value||'').trim(),
    brandName:String(($('me_brand')||{}).value||'').trim(),
    sellCategory:String(($('me_category')||{}).value||'').trim(),
    fb:String(($('me_fb')||{}).value||'').trim(),
    ig:String(($('me_ig')||{}).value||'').trim(),
    collabUrl:String(($('me_web')||{}).value||'').trim(),
    brandIntro:String(($('me_intro')||{}).value||'').trim()
  };
  const labels={name:'姓名',phone:'手機',brandName:'品牌',sellCategory:'販售類別',fb:'Facebook',ig:'Instagram',collabUrl:'官網／作品連結',brandIntro:'品牌介紹'};
  const before={name:m.name||m.displayName||'',phone:m.phone||m.mobile||'',brandName:m.brandName||m.brand_name||m.brand||'',sellCategory:m.sellCategory||m.sell_category||m.category||'',fb:m.fb||m.fbUrl||m.fb_url||'',ig:m.ig||m.igUrl||m.ig_url||'',collabUrl:memberOfficialUrl(m),brandIntro:m.intro||m.brandIntro||m.brand_intro||''};
  const changed=Object.keys(profile).filter(k=>String(profile[k]||'')!==String(before[k]||''));
  if(!changed.length){toast('資料沒有變更');return;}
  const summary=changed.map(k=>labels[k]+'：'+String(before[k]||'（空白）')+' → '+String(profile[k]||'（空白）')).join('\n');
  if(!await uiConfirm('確定協助修改這位會員資料？\n\n'+summary+'\n\n修改後會保留紀錄；Email 與歷史報名不會被更動。'))return;
  try{
    const r=await apiPost({action:'adminUpdateMemberProfile',targetEmail:email,profile});
    if(r&&r.error){toast('儲存失敗：'+r.error,7000);return;}
    toast('✅ 會員資料已更新並留下修改紀錄',6000);
    await loadMembers();
    openMemberDetail(email);
  }catch(e){toast('會員資料更新失敗：'+(e.message||e),8000);}
}
function memberAuditDiff(row){
  const before=row.before||row.beforeJson||row.before_json||{},after=row.after||row.afterJson||row.after_json||{};
  const labels={name:'姓名',phone:'手機',brand_name:'品牌',sell_category:'販售類別',fb_url:'Facebook',ig_url:'Instagram',collab_url:'官網／作品連結',brand_intro:'品牌介紹'};
  return Object.keys(labels).filter(k=>String(before[k]??'')!==String(after[k]??'')).map(k=>'<div class="info-line"><span>'+safe(labels[k])+'</span><span>'+safe(String(before[k]??'（空白）'))+' → '+safe(String(after[k]??'（空白）'))+'</span></div>').join('');
}
async function openMemberEditHistory(email){
  openPanel('會員修改紀錄｜'+safe(email),'只顯示正式資料庫保存的會員基本資料修改歷程','<div class="loading">載入修改紀錄中…</div>');
  try{
    const rows=await api({action:'getMemberEditHistory',memberEmail:email,_t:Date.now()});
    const list=Array.isArray(rows)?rows:[];
    const box=document.querySelector('.panel.show .panel-body');
    if(!box)return;
    if(!list.length){box.innerHTML='<div class="empty">目前沒有會員基本資料修改紀錄</div>';return;}
    box.innerHTML=list.map(r=>'<div class="report-card" style="margin-bottom:10px"><div class="report-title">'+safe(r.actionLabel||'會員資料修改')+'</div><div class="sub">'+safe(String(r.createdAt||'').replace('T',' ').slice(0,19))+'｜操作：'+safe(r.actorEmail||'系統／會員本人')+'</div><div style="margin-top:8px">'+(memberAuditDiff(r)||'<div class="sub">沒有基本欄位差異</div>')+'</div></div>').join('');
  }catch(e){const box=document.querySelector('.panel.show .panel-body');if(box)box.innerHTML='<div class="empty">修改紀錄載入失敗：'+safe(e.message||e)+'</div>';}
}
'''
              s=s.replace(marker,helper+'\n'+marker,1)
          # Preserve all existing member-detail cards; prepend the edit card only.
          start=s.index(marker)
          pos=s.find("  const html=''",start)
          if pos<0: raise SystemExit('missing member html marker')
          s=s[:pos]+s[pos:].replace("  const html=''","  const html=memberEditCard(m)+''",1)
          s=s.replace('>詳情／備註</button>','>資料／修改</button>')
          p.write_text(s,encoding='utf-8')

          # ---------- index.html: prevent silent login-phone overwrite ----------
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""  const email=String(($('np_email')||{}).value||'').trim();\n  const phone=String(($('np_phone')||{}).value||'').trim();\n  if(!email || !/\\S+@\\S+\\.\\S+/.test(email) || !phone) return;"""
          new="""  const email=String(($('np_email')||{}).value||'').trim();\n  // 背景儲存只能沿用已驗證手機，禁止把尚未正式送出的輸入值變成登入手機。\n  const phone=String(ST._verifiedMemberPhone||ST.member?.phone||memberSafePhone()||'').trim();\n  if(!email || !/\\S+@\\S+\\.\\S+/.test(email) || !phone) return;"""
          s=must_replace(s,old,new,'background save phone guard')
          # Explicit profile save confirmation before changing login phone.
          anchor="""  const email=g('np_email'), phone=g('np_phone');"""
          repl="""  const email=g('np_email'), phone=g('np_phone');\n  const verifiedPhone=String(ST._verifiedMemberPhone||ST.member?.phone||memberSafePhone()||'').trim();\n  if(!silent && verifiedPhone && phone && phone!==verifiedPhone){\n    if(!await uiConfirm('你正在修改登入用手機：\\n'+verifiedPhone+' → '+phone+'\\n\\n修改後，下次登入要使用新手機。確定要修改嗎？')){\n      if(btn){btn.disabled=false;btn.textContent='儲存資料';}\n      return;\n    }\n  }"""
          s=must_replace(s,anchor,repl,'new profile explicit phone confirm')
          anchor2="""  const email = String(ST.memberEmail||memberSafeEmail()||'').trim();\n  if(!email){ toast('請先登入'); restore(); return; }"""
          repl2="""  const email = String(ST.memberEmail||memberSafeEmail()||'').trim();\n  if(!email){ toast('請先登入'); restore(); return; }\n  const requestedPhone=String(($('editPhone')?.value||'').trim());\n  const verifiedPhone=String(ST._verifiedMemberPhone||ST.member?.phone||memberSafePhone()||'').trim();\n  if(verifiedPhone && requestedPhone && requestedPhone!==verifiedPhone){\n    if(!await uiConfirm('你正在修改登入用手機：\\n'+verifiedPhone+' → '+requestedPhone+'\\n\\n修改後，下次登入要使用新手機。確定要修改嗎？')){restore();return;}\n  }"""
          s=must_replace(s,anchor2,repl2,'member edit explicit phone confirm')
          p.write_text(s,encoding='utf-8')

          # ---------- worker.js ----------
          p=Path('worker.js'); s=p.read_text(encoding='utf-8')
          s=must_replace(s,"['saveMemberNote','getMemberHistory'].includes(action)","['saveMemberNote','getMemberHistory','adminUpdateMemberProfile','getMemberEditHistory'].includes(action)",'member scope guard')
          s=must_replace(s,"case 'getMembers': return hGetMembers(env,p);\n    case 'getMemberHistory': return hGetMemberHistory(env,p);","case 'getMembers': return hGetMembers(env,p);\n    case 'getMemberEditHistory': return hGetMemberEditHistory(env,p);\n    case 'getMemberHistory': return hGetMemberHistory(env,p);",'GET route')
          s=must_replace(s,"case 'saveMember':          return hSaveMember(env,b);\n    case 'saveMemberNote':","case 'saveMember':          return hSaveMember(env,b);\n    case 'adminUpdateMemberProfile': return hAdminUpdateMemberProfile(env,b);\n    case 'saveMemberNote':",'POST route')
          insert_marker='// 會員「管理者備註」：只有主辦看得到，前台攤商永遠拿不到'
          if 'async function hAdminUpdateMemberProfile' not in s:
              functions=r'''function memberProfileAuditSnapshot(row){
  const r=row&&typeof row==='object'?row:{};
  return {
    name:String(r.name||r.display_name||''),
    phone:String(r.phone||''),
    brand_name:String(r.brand_name||r.brand||''),
    sell_category:String(r.sell_category||r.sale_category||''),
    fb_url:String(r.fb_url||''),
    ig_url:String(r.ig_url||''),
    collab_url:String(r.collab_url||''),
    brand_intro:String(r.brand_intro||'')
  };
}
async function hAdminUpdateMemberProfile(env,b){
  const T=b._tenantId;
  if(!await verifyStaff(env,b.email,b.token,T,'members'))return jsonErr('無權限');
  const target=normEmail(b.targetEmail||b.memberEmail||'');
  if(!target)return jsonErr('缺少會員 Email');
  const rows=await dbGet(env,'members',`tenant_id=eq.${T}&email=ilike.${encodeURIComponent(target)}&select=*`).catch(()=>[]);
  const current=rows&&rows[0];
  if(!current)return jsonErr('找不到會員資料');
  const input=b.profile&&typeof b.profile==='object'?b.profile:{};
  const clean=(v,max)=>String(v==null?'':v).replace(/[\u0000-\u001F\u007F]/g,' ').trim().slice(0,max);
  const phone=normPhone(input.phone||'');
  if(phone && !/^09\d{8}$/.test(phone))return jsonErr('手機格式不正確，請輸入 09 開頭共 10 碼');
  const patch={
    name:clean(input.name,100),
    phone,
    brand_name:clean(input.brandName,160),
    sell_category:clean(input.sellCategory,80),
    fb_url:clean(input.fb,1000),
    ig_url:clean(input.ig,1000),
    collab_url:clean(input.collabUrl,1000),
    brand_intro:clean(input.brandIntro,2000),
    updated_at:nowIso()
  };
  const before=memberProfileAuditSnapshot(current);
  const after=memberProfileAuditSnapshot({...current,...patch});
  const changed=Object.keys(after).filter(k=>String(before[k]??'')!==String(after[k]??''));
  if(!changed.length)return jsonOk({success:true,changed:false,member:formatMemberRow(current)});
  await dbUpdate(env,'members',`tenant_id=eq.${T}&email=ilike.${encodeURIComponent(target)}`,patch);
  await writeAuditLog(env,T,String(b.email||''),String(b._authz?.normalizedRole||b._authz?.role||'admin'),'admin_member_profile_update','members',target,before,after,{changed_fields:changed,source:'admin_member_detail'});
  const saved=(await dbGet(env,'members',`tenant_id=eq.${T}&email=ilike.${encodeURIComponent(target)}&select=*`).catch(()=>[]))[0]||{...current,...patch};
  return jsonOk({success:true,changed:true,changedFields:changed,member:formatMemberRow(saved)});
}
async function hGetMemberEditHistory(env,p){
  const T=p._tenantId;
  if(!await verifyStaff(env,p.email,p.token,T,'members'))return jsonErr('無權限');
  const target=normEmail(p.memberEmail||p.targetEmail||'');
  if(!target)return jsonErr('缺少會員 Email');
  const rows=await dbGet(env,'audit_logs',`tenant_id=eq.${T}&target_table=eq.members&target_id=eq.${encodeURIComponent(target)}&select=action,before_json,after_json,actor_email,actor_role,created_at&order=created_at.desc&limit=80`).catch(()=>[]);
  return jsonOk((rows||[]).filter(r=>['admin_member_profile_update','member_profile_self_update'].includes(String(r.action||''))).map(r=>({
    action:r.action,
    actionLabel:r.action==='admin_member_profile_update'?'管理者協助修改':'會員本人修改',
    before:r.before_json||{},after:r.after_json||{},actorEmail:r.actor_email||'',actorRole:r.actor_role||'',createdAt:r.created_at||''
  })));
}
'''
              s=s.replace(insert_marker,functions+'\n'+insert_marker,1)
          # Fix the existing category entry point to the formal schema field.
          s=s.replace("{category:String(b.category||'').slice(0,80),updated_at:nowIso()}","{sell_category:String(b.category||'').slice(0,80),updated_at:nowIso()}")
          # Add traceability to member self-edits after verified old-phone authentication succeeds.
          old='''  b.email = email;\n  await upsertMember(env, b);'''
          new='''  b.email = email;\n  const memberBeforeAudit=memberProfileAuditSnapshot(verified);\n  await upsertMember(env, b);\n  const memberAfterRows=await dbGet(env,'members',`tenant_id=eq.${TENANT}&email=ilike.${encodeURIComponent(email)}&select=*`).catch(()=>[]);\n  const memberAfterAudit=memberProfileAuditSnapshot(memberAfterRows[0]||{});\n  const memberChangedFields=Object.keys(memberAfterAudit).filter(k=>String(memberBeforeAudit[k]??'')!==String(memberAfterAudit[k]??''));\n  if(memberChangedFields.length){\n    await writeAuditLog(env,TENANT,email,'member','member_profile_self_update','members',email,memberBeforeAudit,memberAfterAudit,{changed_fields:memberChangedFields,source:'member_profile'});\n  }'''
          s=must_replace(s,old,new,'self member audit')
          p.write_text(s,encoding='utf-8')

          # ---------- centralized authorization ----------
          p=Path('lib/admin-authorization.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("'saveVenueMap', 'deleteVenueMap', 'saveMemberCategory', 'adjustMemberCredit',","'saveVenueMap', 'deleteVenueMap', 'adjustMemberCredit',")
          s=must_replace(s,"'saveMemberNote', 'saveSeatMap',","'saveMemberNote', 'saveMemberCategory', 'adminUpdateMemberProfile', 'getMemberEditHistory', 'saveSeatMap',",'member series actions')
          p.write_text(s,encoding='utf-8')

          # ---------- regression contract ----------
          test=Path('scripts/test-member-admin-edit.mjs')
          test.write_text(r'''import fs from 'node:fs';
const admin=fs.readFileSync('admin.html','utf8');
const index=fs.readFileSync('index.html','utf8');
const worker=fs.readFileSync('worker.js','utf8');
const auth=fs.readFileSync('lib/admin-authorization.js','utf8');
function ok(v,m){if(!v){console.error('FAIL:',m);process.exit(1)}}
ok(admin.includes('saveAdminMemberProfile'), 'admin member edit UI missing');
ok(admin.includes("action:'adminUpdateMemberProfile'"), 'admin edit action not wired');
ok(admin.includes('查看修改紀錄'), 'admin edit history entry missing');
ok(admin.includes('Email（唯讀）'), 'email must remain readonly');
ok(worker.includes('async function hAdminUpdateMemberProfile'), 'worker admin handler missing');
ok(worker.includes("'admin_member_profile_update'"), 'admin audit missing');
ok(worker.includes("'member_profile_self_update'"), 'member self audit missing');
ok(worker.includes('getMemberEditHistory'), 'edit history API missing');
ok(worker.includes('sell_category:String(b.category'), 'legacy category entry must write formal sell_category');
ok(auth.includes("'adminUpdateMemberProfile'"), 'central authorization missing admin member edit');
ok(index.includes('背景儲存只能沿用已驗證手機'), 'background phone overwrite guard missing');
ok(index.includes('你正在修改登入用手機'), 'explicit phone change confirmation missing');
ok(!/adminUpdateMemberProfile[\s\S]{0,1800}email\s*:/.test(worker), 'admin edit handler must not mutate member email');
console.log('PASS member-admin-edit closed loop');
''',encoding='utf-8')

          # ---------- documentation / append-only record ----------
          doc=Path('docs/member-admin-edit.md')
          doc.write_text('''# 後台協助修正會員資料\n\n狀態：開發分支完成，尚未合併、尚未部署、尚未修改正式資料。\n\n## 使用路徑\n後台 → 會員 → 搜尋 Email／手機／品牌 → 資料／修改 → 修正基本資料 → 確認差異 → Worker 權限與系列範圍驗證 → members 正式資料更新 → audit_logs 留下修改前後 → 後台重新讀取。\n\n## 安全規則\n- Email 唯讀，不在一般會員協助修改中變更。\n- 修改會員基本資料只更新 members，不覆寫歷史 registrations / payments / refunds / activity credit / seating。\n- 管理者與系列管理者沿用 canManageMembers 與系列範圍；場次管理員／財務／現場角色不可越權。\n- 會員本人修改手機時必須明確確認；背景自動儲存永遠沿用已驗證舊手機，不能靜默改掉登入手機。\n- 會員本人與管理者修改都寫入 audit_logs。\n- 既有「儲存販售類別」改回正式 members.sell_category，不建立第二套 category 欄位。\n\n## 部署\n沒有收到「確認部署」前禁止合併 main 或部署 2bl-v7。\n''',encoding='utf-8')

          dc=Path('DATA_CONTRACT.md'); d=dc.read_text(encoding='utf-8')
          section='''\n\n## 2026-08-21｜後台協助修正會員資料（Pending）\n\n- 入口：`admin.html` 會員搜尋 → 資料／修改。\n- 可修改：姓名、手機、品牌、販售類別、FB、IG、官網／作品連結、品牌介紹。\n- Email：唯讀；不得由一般會員資料修正直接變更。\n- 正式寫入：只更新 `members`；歷史報名、付款、退款、活動金與排位維持原紀錄。\n- Audit：管理者修改寫 `audit_logs.action=admin_member_profile_update`；會員本人修改寫 `member_profile_self_update`。\n- 權限：沿用 `canManageMembers`；系列管理者僅能處理自己系列內曾有報名的會員。\n- 防誤改：前台背景儲存禁止改登入手機；本人明確修改手機必須再次確認。\n- 相容修正：舊 `saveMemberCategory` 改寫正式 `members.sell_category`，不建立不存在的 `category` 欄位。\n- 狀態：Pending；未合併、未部署、未修改正式 Supabase 資料。\n'''
          if '後台協助修正會員資料（Pending）' not in d:
              dc.write_text(d.rstrip()+section+'\n',encoding='utf-8')
          PY
      - name: Run regression checks
        shell: bash
        run: |
          node scripts/test-member-admin-edit.mjs
          node --check worker.js
          for f in scripts/test-*.mjs; do node "$f"; done
          node scripts/verify-data-contract.mjs --strict
      - name: Commit branch-only result
        shell: bash
        run: |
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_one_shot_member_admin_edit.yml
          git add admin.html index.html worker.js lib/admin-authorization.js scripts/test-member-admin-edit.mjs docs/member-admin-edit.md DATA_CONTRACT.md
          git commit -m "feat: add audited admin member profile correction"
          git push origin HEAD:agent/member-admin-edit
