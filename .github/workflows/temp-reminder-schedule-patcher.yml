name: temp multi-day discount patcher
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.repository == 'ndiangrace-create/2bL' && github.head_ref == 'fix/multi-day-discount-closed-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-day-discount-closed-loop
          fetch-depth: 0
      - name: Apply scoped patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          old="""function calcFee(ses, selectedDates, stallCount) {
  const dates = safeJson(ses.dates_json, []);
  const baseFee = safeNum(ses.fee);
  const stalls = Math.max(parseInt(stallCount)||1, 1); // 無上限，由後台 maxStalls 控制
  if (dates.length > 1 && selectedDates && selectedDates.length > 0) {
    const allSelected = dates.every(d => selectedDates.includes(d.date));
    if (allSelected && baseFee > 0) return baseFee * stalls;
    return selectedDates.reduce((sum, sd) => {
      const def = dates.find(d => d.date === sd);
      return sum + (def ? (Number(def.fee) || 0) : 0);
    }, 0) * stalls;
  }
  return baseFee * stalls;
}"""
          new="""function normalizeMultiDayTiers(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(t => ({minDays:Math.max(2,Math.floor(safeNum(t&&t.minDays))),maxDays:Math.max(0,Math.floor(safeNum(t&&t.maxDays))),dailyFee:Math.max(0,safeNum(t&&t.dailyFee)),enabled:!(t&&(t.enabled===false||t.enabled==='false'))})).filter(t=>t.enabled&&t.minDays>=2&&(t.maxDays===0||t.maxDays>=t.minDays)).sort((a,b)=>a.minDays-b.minDays);
}
function calcFee(ses, selectedDates, stallCount) {
  const dates = safeJson(ses.dates_json, []);
  const baseFee = safeNum(ses.fee);
  const stalls = Math.max(parseInt(stallCount)||1, 1);
  if (dates.length > 1 && selectedDates && selectedDates.length > 0) {
    const picked=[...new Set(selectedDates.map(x=>String(x).slice(0,10)))].filter(sd=>dates.some(d=>String(d.date).slice(0,10)===sd));
    const tiers=normalizeMultiDayTiers(dates[0]&&dates[0].multiDayTiers);
    const tier=tiers.filter(t=>picked.length>=t.minDays&&(t.maxDays===0||picked.length<=t.maxDays)).sort((a,b)=>b.minDays-a.minDays)[0];
    if(tier)return tier.dailyFee*picked.length*stalls;
    const allSelected=dates.every(d=>picked.includes(String(d.date).slice(0,10)));
    if(allSelected&&baseFee>0)return baseFee*stalls;
    return picked.reduce((sum,sd)=>{const def=dates.find(d=>String(d.date).slice(0,10)===sd);return sum+(def?(Number(def.fee)||0):0);},0)*stalls;
  }
  return baseFee*stalls;
}"""
          if old not in s:
            if 'function normalizeMultiDayTiers(raw)' in s: raise SystemExit(0)
            raise SystemExit('calcFee baseline mismatch')
          s=s.replace(old,new,1)
          old2='dates_json:JSON.stringify(b.dates||[]),'
          new2="dates_json:JSON.stringify((()=>{const ds=Array.isArray(b.dates)?b.dates.map(d=>({...d})):[];const tiers=normalizeMultiDayTiers(b.multiDayTiers);if(ds.length){if(tiers.length)ds[0].multiDayTiers=tiers;else delete ds[0].multiDayTiers;}return ds;})()),"
          if s.count(old2)<2: raise SystemExit('dates_json baseline mismatch')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/verify-data-contract.mjs --strict
          grep -q "normalizeMultiDayTiers(b.multiDayTiers)" worker.js
          grep -q "tier.dailyFee\*picked.length\*stalls" worker.js
      - name: Commit tested worker only
        run: |
          set -euo pipefail
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist and price multi-day discount tiers"
          git push origin HEAD:fix/multi-day-discount-closed-loop
