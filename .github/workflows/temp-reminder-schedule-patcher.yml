name: temp manual registration transfer clean branch patcher
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.repository == 'ndiangrace-create/2bL' && github.head_ref == 'agent/manual-reg-transfer-date-fix-clean-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-reg-transfer-date-fix-clean-20260822
          fetch-depth: 0
      - name: Guard target and detect prior completion
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ndiangrace-create/2bL"
          test "$GITHUB_HEAD_REF" = "agent/manual-reg-transfer-date-fix-clean-20260822"
          test "$(git branch --show-current)" = "agent/manual-reg-transfer-date-fix-clean-20260822"
          if [ ! -f scripts/_apply_manual_reg_transfer_dates_fix_v3.mjs ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Patch already applied; nothing to do."
          else
            test -f scripts/test-manual-reg-transfer-dates.mjs
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply scoped patch
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/_apply_manual_reg_transfer_dates_fix_v3.mjs
      - name: Validate syntax and closed-loop markers
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/test-manual-reg-transfer-dates.mjs
          node scripts/test-admin-operator-simulation.mjs
          node scripts/test-member-admin-edit.mjs
          node scripts/test-member-login-token.mjs
          node scripts/test-member-profile-system.mjs
          node scripts/verify-data-contract.mjs --strict
      - name: Block unrelated working-tree changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git restore .automation/data-contract-report.json 2>/dev/null || rm -f .automation/data-contract-report.json
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/changed.txt
          grep -qx 'admin.html' /tmp/changed.txt
          grep -qx 'worker.js' /tmp/changed.txt
          grep -qx 'supabase/migrations/20260822200500_transfer_selected_dates_day_ops.sql' /tmp/changed.txt
          if grep -Ev '^(admin\.html|worker\.js|supabase/migrations/20260822200500_transfer_selected_dates_day_ops\.sql)$' /tmp/changed.txt | grep -q .; then echo 'Unexpected file changed'; exit 1; fi
      - name: Commit only tested feature files
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -f scripts/_apply_manual_reg_transfer_dates_fix_v3.mjs docs/manual-reg-transfer-fix-clean-trigger.md
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html worker.js supabase/migrations/20260822200500_transfer_selected_dates_day_ops.sql scripts/test-manual-reg-transfer-dates.mjs
          git add -u scripts/_apply_manual_reg_transfer_dates_fix_v3.mjs docs/manual-reg-transfer-fix-clean-trigger.md
          git diff --cached --quiet && { echo 'no patch output'; exit 1; }
          git commit -m "fix: repair manual registration and multi-day transfer selection"
          git push origin HEAD:agent/manual-reg-transfer-date-fix-clean-20260822
