name: temp reminder schedule branch patcher
on:
  push:
    branches: [agent/reminder-schedule-review-20260821]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.repository == 'ndiangrace-create/2bL' && github.ref == 'refs/heads/agent/reminder-schedule-review-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard target
        run: |
          test "$GITHUB_REPOSITORY" = "ndiangrace-create/2bL"
          test "$GITHUB_REF" = "refs/heads/agent/reminder-schedule-review-20260821"
          test -f scripts/_apply_reminder_schedule_review_fix.mjs
      - name: Apply patch
        run: node scripts/_apply_reminder_schedule_review_fix.mjs
      - name: Validate
        run: |
          node --check worker.js
          node scripts/test-reminder-schedule-review.mjs
          for f in scripts/test-*.mjs; do echo "== $f =="; node "$f"; done
          node scripts/verify-data-contract.mjs --strict
      - name: Commit patched formal files
        run: |
          rm -f scripts/_apply_reminder_schedule_review_fix.mjs .github/workflows/_temp_apply_reminder_schedule_review.yml
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js admin.html index.html scripts/test-reminder-schedule-review.mjs scripts/_apply_reminder_schedule_review_fix.mjs .github/workflows/_temp_apply_reminder_schedule_review.yml
          git diff --cached --quiet && { echo 'no patch output'; exit 1; }
          git commit -m "fix: payment reminder and staged review schedule"
          git push origin HEAD:agent/reminder-schedule-review-20260821
