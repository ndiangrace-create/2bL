name: 2BL 安全自動流

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: 只允許唯讀盤點
        required: true
        default: audit
        type: choice
        options: [audit]

permissions:
  contents: read
  actions: read

concurrency:
  group: 2bl-safe-automation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  readonly-audit:
    name: Cloudflare／資料契約唯讀核對（禁止部署）
    runs-on: ubuntu-latest
    if: github.repository == 'ndiangrace-create/2bL'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOOTSTRAP_SOURCE: "false"
      ALLOW_WORKER_DIFF: "true"

    steps:
      - name: 讀取工作分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 鎖定正式來源
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ndiangrace-create/2bL"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test "2bl-v7" != "tobeloved-api"

      - name: 語法檢查
        run: |
          node --check worker.js
          node --check scripts/cloudflare-readonly-audit.mjs
          node --check scripts/cloudflare-deployment-guard.mjs
          node --check scripts/verify-data-contract.mjs

      - name: Cloudflare 唯讀盤點與漂移核對
        run: node scripts/cloudflare-readonly-audit.mjs

      - name: 所有資料進出與名稱統一檢查
        run: node scripts/verify-data-contract.mjs

      - name: 顯示部署阻擋狀態
        shell: bash
        run: |
          node -e "const r=require('./.automation/data-contract-report.json'); console.log(JSON.stringify({deployment_ready:r.deployment_ready,blockers:r.blockers,unknown_tables:r.unknown_tables,unknown_routines:r.unknown_routines,disallowed_local_storage:r.local_storage.disallowed},null,2))"
          echo "本工作流沒有 push、merge、deploy、migration、Routes 或 Domains 寫入步驟。"

      - name: 保存非機密盤點證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2bl-readonly-audit-${{ github.run_id }}
          path: |
            .automation/cloudflare-audit.json
            .automation/data-contract-report.json
            .automation/supabase-schema-audit.json
          if-no-files-found: warn
          retention-days: 14
