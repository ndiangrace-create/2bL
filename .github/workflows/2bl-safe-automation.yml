name: 2BL 安全自動流

on:
  push:
    branches:
      - agent/2bl-safe-automation
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      mode:
        description: 僅允許唯讀盤點；正式部署需另經核准流程
        required: true
        default: audit
        type: choice
        options:
          - audit

permissions:
  contents: write
  actions: read

concurrency:
  group: 2bl-safe-automation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  cloudflare-readonly-audit:
    name: 讀取並核對 2bl-v7（禁止部署）
    runs-on: ubuntu-latest
    if: github.repository == 'ndiangrace-create/2bL'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOOTSTRAP_SOURCE: "true"
      WORK_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: 讀取工作分支
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: 鎖定 2BL 正式環境
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ndiangrace-create/2bL"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test "2bl-v7" != "tobeloved-api"
          echo "安全核對完成：只允許讀取 2bl-v7"

      - name: Cloudflare 唯讀盤點與來源核對
        run: node scripts/cloudflare-readonly-audit.mjs

      - name: 檢查 Worker JavaScript 語法
        if: hashFiles('worker.js') != ''
        run: node --check worker.js

      - name: 保存非機密盤點報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2bl-cloudflare-readonly-audit
          path: .automation/cloudflare-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: 將 Cloudflare 正式來源放入工作分支
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain -- worker.js .automation/cloudflare-baseline.json)"; then
            echo "工作分支已有相同正式來源，不需提交"
            exit 0
          fi
          git config user.name "2BL Safe Automation"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js .automation/cloudflare-baseline.json
          git commit -m "納入 Cloudflare 2bl-v7 正式來源 [skip ci]"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: 明確禁止部署
        run: |
          echo "本流程只做 GET 唯讀盤點、雜湊核對與工作分支來源初始化。"
          echo "未呼叫 Cloudflare 上傳、部署、Routes、Domains、Variables 或 Secrets 寫入 API。"
