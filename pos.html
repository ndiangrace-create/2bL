<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寄賣 POS</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f6fbfb;color:#17343a}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d8e6e6;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d8e6e6;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(20,80,80,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#0f766e;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e8f4f3;color:#175d58}.btn.danger{background:#b42318}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select,.field textarea{border:1px solid #bdd2d1;border-radius:11px;padding:10px;font-size:16px}.field textarea{min-height:90px}.muted{color:#60777b}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#e8f4f3;font-weight:800;font-size:13px}.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:#fff7dc;border:1px solid #eadba0}.ok{background:#e9f8ea}.bad{background:#fff0ef}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.product{border:1px solid #d8e6e6;border-radius:14px;padding:12px;margin:8px 0}.big{font-size:28px;font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e6eeee;text-align:left}.scanner{width:100%;max-width:460px;margin:auto}.price{font-size:22px;font-weight:900}.right{margin-left:auto}@media(max-width:650px){.wrap{padding:10px}.top{padding:10px}.card{border-radius:14px}.table{font-size:14px}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><div class="top"><b>寄賣 POS／入庫掃描</b><button class="btn alt" onclick="location.href='consignment.html?admin=1&tenant='+encodeURIComponent(TENANT)">回寄賣管理</button></div><div class="wrap"><div id="msg"></div><div class="card"><div class="grid"><label class="field">檔期<select id="session" onchange="cart={};renderCart();loadSales()"></select></label><label class="field">模式<select id="mode" onchange="renderMode()"><option value="sale">現場結帳</option><option value="receive">商品入庫</option><option value="lookup">查商品</option><option value="return_to_brand">撤場退回品牌</option><option value="damage">損壞／遺失</option></select></label></div><div class="row"><input id="barcode" placeholder="掃描或輸入條碼" style="flex:1;padding:13px;font-size:18px;border:1px solid #bdd2d1;border-radius:12px" onkeydown="if(event.key==='Enter')scanCode()"><button class="btn" onclick="scanCode()">確認</button><button class="btn alt" onclick="startCamera()">手機相機掃碼</button></div><div id="reader" class="scanner hidden"></div></div><div id="itemInfo"></div><div id="cartBox" class="card"><h2>購物車</h2><div id="cart"></div><div class="grid"><label class="field">付款方式<select id="pay"><option>現金</option><option>LINE Pay</option><option>信用卡</option><option>其他</option></select></label><label class="field">折扣金額<input id="discount" type="number" min="0" value="0" oninput="renderCart()"></label></div><div class="big">應收：<span id="total">NT$ 0</span></div><button class="btn" onclick="checkout()">完成結帳</button></div><div class="card"><h2>近期交易</h2><button class="btn alt" onclick="loadSales()">重新整理</button><div id="sales"></div></div></div><script>
'use strict';const API='https://2bl-v7.ndiangrace.workers.dev';const Q=new URLSearchParams(location.search);const TENANT=Q.get('tenant')||sessionStorage.getItem('2bl_tenant')||'';const admin=(()=>{try{return JSON.parse(localStorage.getItem('tb_v3')||'null')}catch{return null}})();let cart={},scanner=null,checkoutBusy=false,lastScan={code:'',at:0};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tell(s,ok=false){$('msg').innerHTML='<div class="notice '+(ok?'ok':'bad')+'">'+esc(s)+'</div>'}
async function get(action,data={}){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('tenant',TENANT);u.searchParams.set('email',admin?.email||'');u.searchParams.set('token',admin?.token||'');Object.entries(data).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u).then(x=>x.json());if(r.error)throw Error(r.error);return r}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,tenant:TENANT,email:admin?.email,token:admin?.token,...data})}).then(x=>x.json());if(r.error)throw Error(r.error);return r}
async function init(){if(!admin)return tell('請先登入後台');try{const r=await get('consignmentAdminBootstrap');$('session').innerHTML=(r.sessions||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');renderMode();loadSales();$('barcode').focus()}catch(e){tell(e.message)}}
function renderMode(){$('cartBox').classList.toggle('hidden',$('mode').value!=='sale')}async function scanCode(code){code=String(code||$('barcode').value).trim();const now=Date.now();if(code&&lastScan.code===code&&now-lastScan.at<250)return;lastScan={code,at:now};$('barcode').value='';if(!code)return;try{const r=await get('consignmentLookupBarcode',{sessionId:$('session').value,barcode:code});if($('mode').value==='sale'){if(r.variant.available_qty<=0)throw Error('商品庫存為 0');if(!cart[code])cart[code]={barcode:code,quantity:0,variant:r.variant,product:r.product};if(cart[code].quantity>=Number(r.variant.available_qty))throw Error('已達可售庫存上限');cart[code].quantity++;renderCart()}else if($('mode').value==='lookup')showItem(r);else{const qty=Number(prompt('數量',1)||0);if(qty>0){await post('consignmentAdjustInventory',{sessionId:$('session').value,barcode:code,movementType:$('mode').value,quantity:qty});tell('庫存異動完成',true);showItem(await get('consignmentLookupBarcode',{sessionId:$('session').value,barcode:code}))}}}catch(e){tell(e.message)}finally{$('barcode').focus()}}
function showItem(r){$('itemInfo').innerHTML=`<div class="card"><h2>${esc(r.product.product_name)}｜${esc(r.variant.variant_name)}</h2><p>品牌：${esc(r.product.brand_name)}｜售價 NT$ ${Number(r.variant.price).toLocaleString()}</p><p>申報 ${r.variant.declared_qty}｜入庫 ${r.variant.received_qty}｜可售 ${r.variant.available_qty}｜已售 ${r.variant.sold_qty}</p></div>`}
function renderCart(){const rows=Object.values(cart),sub=rows.reduce((s,x)=>s+x.variant.price*x.quantity,0),dis=Number($('discount').value||0),total=Math.max(sub-dis,0);$('cart').innerHTML=rows.map(x=>`<div class="product row"><b>${esc(x.product.product_name)}｜${esc(x.variant.variant_name)}</b><span class="right">${x.quantity} × NT$ ${Number(x.variant.price).toLocaleString()}</span><button class="btn danger" onclick="del('${x.barcode}')">刪除</button></div>`).join('')||'<p class="muted">尚未掃描商品</p>';$('total').textContent='NT$ '+total.toLocaleString()}function del(c){delete cart[c];renderCart()}
async function checkout(){if(checkoutBusy)return;const items=Object.values(cart).map(x=>({barcode:x.barcode,quantity:x.quantity}));if(!items.length)return tell('購物車是空的');const sub=Object.values(cart).reduce((s,x)=>s+Number(x.variant.price)*x.quantity,0),dis=Number($('discount').value||0);if(dis>sub)return tell('折扣不可大於商品小計');if(!confirm('確定完成結帳？'))return;try{checkoutBusy=true;const r=await post('consignmentPosCheckout',{sessionId:$('session').value,paymentMethod:$('pay').value,discountAmount:Number($('discount').value||0),items});tell('結帳完成：'+r.sale_no+'，金額 NT$ '+Number(r.total_amount).toLocaleString(),true);cart={};$('discount').value=0;renderCart();loadSales()}catch(e){tell(e.message)}finally{checkoutBusy=false}}
async function loadSales(){if(!$('session').value)return;try{const r=await get('consignmentSales',{sessionId:$('session').value});$('sales').innerHTML=(r.sales||[]).map(s=>`<div class="product"><b>${esc(s.sale_no)}</b>｜NT$ ${Number(s.total_amount).toLocaleString()}｜${esc(s.payment_method)}｜${esc(s.status)} ${s.status==='completed'?`<button class="btn danger" onclick="voidSale('${s.id}')">取消交易</button>`:''}</div>`).join('')}catch(e){tell(e.message)}}
async function voidSale(id){const note=prompt('取消原因');if(!note)return;try{await post('consignmentVoidSale',{saleId:id,note});tell('交易已取消並回補庫存',true);loadSales()}catch(e){tell(e.message)}}
async function startCamera(){try{if(typeof Html5Qrcode!=='function')throw Error('掃碼元件未載入，請改用條碼槍或手動輸入');$('reader').classList.remove('hidden');if(scanner)await scanner.stop().catch(()=>{});scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE]},async code=>{await scanner.stop();$('reader').classList.add('hidden');scanCode(code)},()=>{})}catch(e){tell('相機掃碼無法啟動：'+e.message)}}
init();
</script></body></html>
