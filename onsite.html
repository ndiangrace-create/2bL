.reg-actions button{width:100%;min-width:0;min-height:42px;white-space:normal;overflow-wrap:anywhere;line-height:1.2;font-size:15px;padding:8px 5px;border-radius:10px;box-shadow:none}.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:16px}.kv .k{color:var(--muted)}.noteBox{display:none;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.err{background:var(--warn);border:1px solid #e4b8b2;color:#8b2d24;border-radius:14px;padding:12px;margin:12px 0}.okmsg{background:var(--ok);border:1px solid #bdd5c3;color:#315225;border-radius:14px;padding:12px;margin:12px 0}.hidden{display:none!important}

      #regsList .reg-actions button{min-height:38px;font-size:14px;padding:7px 4px}
    }

ght:430px;background-color:#fbfbf8;background-image:linear-gradient(#ece9e2 1px,transparent 1px),linear-gradient(90deg,#ece9e2 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.onsite-free-marker{position:absolute;transform:translate(-50%,-50%);width:98px;min-height:62px;padding:5px;border-radius:10px;background:#26312f;color:#fff;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.2);font-size:11px;line-height:1.15}.onsite-free-marker.special{background:#e9eef7;color:#26324a}.onsite-free-marker.free{background:#eef7ef;color:#26324a;border-color:#c7deca}.onsite-free-marker b{font-size:16px}.onsite-free-marker small{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.position-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 0 9px}.position-no{font-size:28px;font-weight:950;line-height:1;background:#26312f;color:#fff;border-radius:12px;padding:8px 12px;letter-spacing:.5px}.position-no.none{background:#e7e1d7;color:#766}.position-label{font-size:14px;color:var(--muted);font-weight:800}

/* ===== 2BL 現場手機工作模式：位置圖先看、卡片精簡、避免長頁面 ===== */
.onsite-map-fit{
  position:relative;
  width:100%;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fbfbf8;
  margin-top:8px;
}
.onsite-map-virtual{
  position:absolute;
  left:0;top:0;
  width:1200px;height:700px;
  transform-origin:top left;
  background-color:#fbfbf8;
  background-image:linear-gradient(#ece9e2 1px,transparent 1px),linear-gradient(90deg,#ece9e2 1px,transparent 1px);
  background-size:24px 24px;
}
.onsite-map-virtual .onsite-map-marker{
  width:112px;min-width:112px;max-width:112px;min-height:72px;
  padding:6px;border-radius:12px;font-size:11px;line-height:1.15;
}
.onsite-map-virtual .onsite-map-marker b{font-size:17px}
.onsite-map-virtual .onsite-map-marker small{font-size:10px}
.onsite-map-virtual .onsite-free-object{
  min-width:110px;max-width:220px;padding:8px 12px;font-size:13px;
}
.onsite-map-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.onsite-map-actions button{padding:8px 12px;font-size:14px}
.onsite-map-marker.focused-seat{
  outline:7px solid rgba(255,163,26,.92);
  box-shadow:0 0 0 3px #fff,0 7px 22px rgba(0,0,0,.35);
  z-index:20;
}
.onsite-map-fullscreen{
  position:fixed;inset:0;z-index:9999;background:#f7f4ee;
  display:flex;flex-direction:column;
}
.onsite-map-fullscreen.hidden{display:none!important}
.onsite-map-fullscreen-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)
}
.onsite-map-fullscreen-body{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px;touch-action:pan-x pan-y pinch-zoom;
}
.onsite-map-fullscreen-scroll{
  position:relative;width:1200px;height:700px;
  background-color:#fbfbf8;
  background-image:linear-gradient(#ece9e2 1px,transparent 1px),linear-gradient(90deg,#ece9e2 1px,transparent 1px);
  background-size:24px 24px;
  border:1px solid var(--line);border-radius:12px;
  transform-origin:top left;
}
.onsite-map-fullscreen-scroll .onsite-map-marker{
  width:112px;min-width:112px;max-width:112px;min-height:72px;
  padding:6px;border-radius:12px;font-size:11px;line-height:1.15;
}
.onsite-map-fullscreen-scroll .onsite-map-marker b{font-size:17px}
.onsite-map-fullscreen-scroll .onsite-map-marker small{font-size:10px}
.onsite-map-fullscreen-scroll .onsite-free-object{min-width:110px;max-width:220px;padding:8px 12px;font-size:13px}
.onsite-map-marker,.onsite-map-virtual .onsite-map-marker,.onsite-map-fullscreen-scroll .onsite-map-marker,.onsite-free-marker,.onsite-blank-cell,.position-no{border-radius:4px}

/* 現場攤商卡：桌機維持完整，手機改成工作小卡 */
.mobile-reg-main{display:none}
.reg-more{display:none}
.reg-more.open{display:block}

  header .bar{padding:9px 10px;align-items:center}
  .brand{font-size:17px}
  header .sub{font-size:11px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:8px 8px 70px}
  .card{margin:7px 0;padding:10px;border-radius:13px}

  .onsite-equip-total{font-size:12px;padding:6px 8px;margin:6px 0}

  .mobile-reg-state{margin-top:4px;font-size:12px;color:var(--muted)}
  .mobile-reg-buttons{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px
  }
  .mobile-reg-buttons button{
    width:100%;min-width:0;padding:8px 4px;font-size:13px;border-radius:10px;white-space:nowrap
  }
  .mobile-reg-buttons .checked{background:#5d8f64}
  .reg-more{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);

  .reg-more .kv{grid-template-columns:64px 1fr;font-size:13px;gap:3px 7px}

    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px

  /* 退費現金統計壓成一條，不再佔一整張大卡 */
  .onsite-refund-summary{
    grid-column:1/-1;margin:0 0 2px;padding:7px 9px;border-radius:10px;
    background:#fff8ed;border:1px solid #f5d7a1;font-size:12px;color:#6c552e
  }
  .onsite-refund-summary b{font-size:13px}
}

<header>
  <div class="bar">
    <div><div class="brand">2BL 現場管理</div><div class="sub" id="who">Google 登入或 4 位通行碼｜20260721全流程修復版 v2</div></div>
    <button class="secondary" id="logoutBtn" onclick="logout()" style="display:none">登出</button>
  </div>
</header>
<main>
  <section id="loginView" class="login">
    <div class="card">
      <h1>現場管理入口</h1>
      <p class="sub">此頁只顯示授權場次與該場名單，不進入完整後台。</p>
      <a class="btn" id="googleLogin" href="#">使用 Google 登入</a><div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><p class="sub" style="margin:0 0 8px">現場工作人員：輸入 4 位通行碼（免登入）</p><input id="pcInput" inputmode="numeric" maxlength="4" placeholder="4 位數字" style="text-align:center;font-size:26px;letter-spacing:10px;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff" onkeydown="if(event.key===&quot;Enter&quot;)enterByPasscode()" /><button class="btn" style="margin-top:10px;width:100%" onclick="enterByPasscode()">進入現場</button></div>
      <div id="loginErr" class="err hidden"></div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div id="msg"></div>
    <section id="sessionsView">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div><h2 style="margin:0">我的場次</h2><div class="sub">只列出此帳號被授權的場次</div></div>
          <button class="secondary" onclick="loadSessions()">重新整理</button>
        </div>
      </div>
      <div id="sessionsList" class="session-grid"></div>
    </section>

    <section id="regsView" class="hidden">
      <div class="card">
        <button class="secondary" id="backBtn" onclick="backToSessions()">← 回我的場次</button>
        <h2 id="sessionTitle" style="margin-bottom:0"></h2>
        <div class="sub" id="sessionSub"></div><div id="onsiteDayTabs"></div><div id="onsiteSeatMap"></div>
        <div class="toolbar">
          <input id="kw" placeholder="搜尋品牌、姓名、手機、位置" oninput="renderRegs()" />
          <select id="filter" onchange="renderRegs()">
            <option value="all">全部名單</option>
            <option value="canCheckin">可報到</option>
            <option value="checked">已報到</option>
            <option value="notChecked">未報到</option>
            <option value="issue">特殊／退費標記</option>
          </select>
        </div>
      </div>
      <div id="onsiteLiveSummary"></div><div id="onsiteQuickFilters" class="onsite-quick-scroll"></div><div id="regsList"></div>
    </section>
  </section>
</main>

<div id="onsiteMapFullscreen" class="onsite-map-fullscreen hidden" aria-hidden="true">
  <div class="onsite-map-fullscreen-head">
    <div>
      <b id="onsiteMapFullscreenTitle">本場位置圖</b>
      <div class="sub">可左右／上下拖動畫布查看位置</div>
    </div>
    <button class="secondary" onclick="closeOnsiteMapFullscreen()">關閉</button>
  </div>
  <div id="onsiteMapFullscreenBody" class="onsite-map-fullscreen-body"></div>
</div>

<script>
const API='https://2bl-v7.ndiangrace.workers.dev';
const TENANT='tuibile';
const LS_TOKEN='2bl_onsite_admin_token';
const LS_EMAIL='2bl_onsite_email';
const LS_OPERATOR='2bl_onsite_operator';
let token='', email='', me=null, sessions=[], regs=[], currentSession=null;
let passcode='', operatorName='';
let currentActivityDate='', currentDaySummary={}, onsiteQuickFilter='all';
function $(id){return document.getElementById(id)}
function money(n){return 'NT$ '+(Number(n)||0).toLocaleString('zh-TW')}
function dt(v){if(!v)return '—'; try{return new Date(v).toLocaleString('zh-TW',{hour12:false})}catch(e){return v}}
function onsiteDateTs(v){
  if(v===null||v===undefined||v==='')return Infinity;
  if(Array.isArray(v)){const a=v.map(onsiteDateTs).filter(Number.isFinite);return a.length?Math.min(...a):Infinity;}
  if(typeof v==='object')return onsiteDateTs(v.date||v.day||v.value||v.start||'');
  const s=String(v||'').trim();if(!s)return Infinity;
  const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T00:00:00+08:00':s);
  return Number.isNaN(d.getTime())?Infinity:d.getTime();
}
function onsiteOperationalDate(s){
  let raw=s&&s.dates||[];
  if(typeof raw==='string'){try{raw=JSON.parse(raw)}catch(_e){raw=[raw]}}
  if(!Array.isArray(raw))raw=[raw];
  const ds=raw.map(onsiteDateTs).filter(Number.isFinite).sort((a,b)=>a-b);
  const now=new Date();now.setHours(0,0,0,0);const base=now.getTime();
  const next=ds.find(x=>x>=base);
  return next!=null?{bucket:0,ts:next}:{bucket:1,ts:(ds.length?ds[ds.length-1]:Infinity)};
}
function sortOnsiteSessions(list){
  return (list||[]).slice().sort((a,b)=>{
    const aa=onsiteOperationalDate(a),bb=onsiteOperationalDate(b);
    if(aa.bucket!==bb.bucket)return aa.bucket-bb.bucket;
    if(aa.bucket===0&&aa.ts!==bb.ts)return aa.ts-bb.ts;
    if(aa.bucket===1&&aa.ts!==bb.ts)return bb.ts-aa.ts;
    return String(a.name||'').localeCompare(String(b.name||''),'zh-Hant');
  });
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function equipText(v){let o=v; if(typeof o==='string'){try{o=JSON.parse(o||'{}')}catch(e){o={}}} const arr=[]; Object.keys(o||{}).forEach(k=>{const n=Number(o[k]); if(n>0) arr.push(`${k} × ${n}`)}); return arr.length?arr.join('、'):'—'}
function showMsg(t,type='ok'){ $('msg').innerHTML=t?`<div class="${type==='err'?'err':'okmsg'}">${esc(t)}</div>`:''; if(t) setTimeout(()=>$('msg').innerHTML='',2600)}
async function apiGet(action, extra={}){const u=new URL(API); u.searchParams.set('action',action); u.searchParams.set('tenant',TENANT); u.searchParams.set('token',token); u.searchParams.set('email',email||'_'); if(passcode) u.searchParams.set('passcode',passcode); Object.entries(extra).forEach(([k,v])=>u.searchParams.set(k,v)); const r=await fetch(u); const j=await r.json().catch(()=>null); if(!r.ok||j?.ok===false) throw new Error(j?.error||j?.message||'API 錯誤'); return j.data!==undefined?j.data:j}
async function apiPost(action, body={}){const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,tenant:TENANT,token,email:email||'_',passcode})}); const j=await r.json().catch(()=>null); if(!r.ok||j?.ok===false) throw new Error(j?.error||j?.message||'API 錯誤'); return j.data!==undefined?j.data:j}
function logout(){localStorage.removeItem(LS_TOKEN);localStorage.removeItem(LS_EMAIL);sessionStorage.removeItem(LS_OPERATOR);location.href='onsite.html'}
function ensureOperatorName(){ let n=(sessionStorage.getItem(LS_OPERATOR)||'').trim(); while(!n){ n=(prompt('請輸入你的名字（現場報到記錄用，本次開啟期間有效）：')||'').trim(); } sessionStorage.setItem(LS_OPERATOR,n); operatorName=n; return n; }
function changeOperatorName(){ const n=(prompt('換人操作？輸入新的名字：',operatorName||'')||'').trim(); if(!n) return; sessionStorage.setItem(LS_OPERATOR,n); operatorName=n; if(passcode){ $('who').textContent='現場碼｜操作人：'+n+(currentSession&&currentSession.name?'｜'+currentSession.name:''); } showMsg('已切換操作人：'+n); }
async function enterByPasscode(){ const code=($('pcInput').value||'').trim(); if(!/^\d{4}$/.test(code)){ $('loginErr').textContent='請輸入 4 位數字通行碼'; $('loginErr').classList.remove('hidden'); return; } try{ const r=await apiGet('onsitePasscodeVerify',{code}); passcode=code; email='_'; const who=ensureOperatorName(); $('who').innerHTML=esc('現場碼｜操作人：'+who+(r.sessionName?'｜'+r.sessionName:''))+' <a href="javascript:void(0)" onclick="changeOperatorName()" style="text-decoration:underline">換人</a>'; $('logoutBtn').style.display='inline-flex'; $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); $('sessionsView').classList.add('hidden'); const bb=$('backBtn'); if(bb) bb.style.display='none'; currentSession={id:r.sessionId,name:r.sessionName,dates:r.dates||[],seatMapUrl:r.seatMapUrl||'',seatBoard:r.seatBoard||{}}; await openSession(r.sessionId); }catch(e){ $('loginErr').textContent=e.message; $('loginErr').classList.remove('hidden'); } }
function handleCallback(){const u=new URL(location.href); const t=u.searchParams.get('admin_token'); const tenant=u.searchParams.get('tenant'); const err=u.searchParams.get('login_error'); if(err){$('loginErr').textContent='登入失敗：'+err; $('loginErr').classList.remove('hidden')} if(t){localStorage.setItem(LS_TOKEN,t); if(tenant)localStorage.setItem('2bl_onsite_tenant',tenant); history.replaceState({},'',location.pathname);}}
async function boot(){handleCallback(); token=localStorage.getItem(LS_TOKEN)||''; $('googleLogin').href=API+'/auth/google/unified/start?tenant='+encodeURIComponent(TENANT)+'&next=onsite'; if(!token){$('loginView').classList.remove('hidden');return} try{me=await apiGet('adminMe',{email:'_'}); email=me.email; localStorage.setItem(LS_EMAIL,email); $('who').textContent=`${me.display_name||me.email}｜${me.role||''}`; $('logoutBtn').style.display='inline-flex'; $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); await loadSessions();}catch(e){localStorage.removeItem(LS_TOKEN); $('loginView').classList.remove('hidden'); $('loginErr').textContent=e.message; $('loginErr').classList.remove('hidden')}}
async function loadSessions(){try{sessions=sortOnsiteSessions(await apiGet('onsiteSessions')); renderSessions()}catch(e){showMsg(e.message,'err')}}
function renderSessions(){
  const box=$('sessionsList');
  if(!sessions.length){box.innerHTML='<div class="card empty" style="grid-column:1/-1">目前沒有可報到的場次<br><span style="font-size:14px;color:var(--muted)">（僅顯示有已繳費名單、且未封存的場次）</span></div>';return}
  box.innerHTML=sessions.map(s=>{
    const stats=Array.isArray(s.dayStats)&&s.dayStats.length?s.dayStats:[{activityDate:s.activityDate,payable:s.payable||0,checkedIn:s.checkedIn||0,stallCount:s.stallCount||0}];
    const multi=stats.length>1;
    const dayButtons=stats.map((x,i)=>{
      const active=String(x.activityDate||'')===String(s.activityDate||'');
      const depositText=Number(x.depositTotalCount||0)>0
        ?`押金：待處理 ${x.depositPendingCount||0}／已完成 ${x.depositDoneCount||0}`
        :(multi&&i<stats.length-1?'押金：最後一天處理':'押金：本日無需處理');
      return `<button class="session-day-btn ${active?'today':''}" onclick="event.stopPropagation();openSession('${esc(s.id)}','${esc(x.activityDate||'')}')"><b>${esc((x.activityDate||'').replace(/^\d{4}-/,''))}${multi?'｜第'+(i+1)+'天':''}</b><small>品牌 ${x.payable||0}・攤位 ${x.stallCount||0}</small><em class="session-day-enter">進入處理 ›</em><div class="session-day-progress"><span>報到 ${x.checkedIn||0}/${x.payable||0}</span><span>撤場 ${x.teardownDone||0}/${x.payable||0}</span><span class="${Number(x.depositPendingCount||0)>0?'warn':''}">${esc(depositText)}</span></div></button>`;
    }).join('');
    return `<div class="card session"><div class="session-title">${esc(s.name)}</div><div class="sub">${multi?'同一場活動・請直接點日期':'請點日期進入名單'}</div><div class="session-days">${dayButtons}</div>${s.refundFlag?`<span class="tag bad">退費標記 ${s.refundFlag}</span>`:''}</div>`;
  }).join('');
}
function onsiteSessionDays(s){
  let raw=s&&s.dates||[];
  if(typeof raw==='string'){try{raw=JSON.parse(raw)}catch(_e){raw=[raw]}}
  if(!Array.isArray(raw))raw=[raw];
  return raw.map(x=>String((x&&typeof x==='object')?(x.date||x.key||x.value||''):x).slice(0,10)).filter(Boolean);
}
function pickOnsiteDefaultDay(s){
  const ds=onsiteSessionDays(s);if(!ds.length)return '';
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return ds.includes(today)?today:(ds.find(d=>d>=today)||ds[ds.length-1]);
}
function renderOnsiteDayTabs(){
  const box=$('onsiteDayTabs');if(!box)return;
  const ds=onsiteSessionDays(currentSession);
  if(ds.length<=1){box.innerHTML='';return;}
  box.innerHTML='<div class="onsite-day-tabs">'+ds.map((d,i)=>`<button class="onsite-day-btn ${d===currentActivityDate?'active':''}" onclick="switchOnsiteDay('${esc(d)}')">${esc(d.replace(/^\d{4}-/,''))}${ds.length>1?'・第'+(i+1)+'天':''}</button>`).join('')+'</div>';
}
async function switchOnsiteDay(day){
  currentActivityDate=String(day||'').slice(0,10);renderOnsiteDayTabs();await loadOnsiteRegsForDay();
}
async function loadOnsiteRegsForDay(){
  if(!currentSession)return;
  $('sessionSub').textContent=(currentActivityDate?currentActivityDate+'｜':'')+'載入現場報到名單中…';
  try{
    const [list,sum]=await Promise.all([
      apiGet('onsiteRegs',{sessionId:currentSession.id,activityDate:currentActivityDate}),
      apiGet('onsiteDaySummary',{sessionId:currentSession.id,activityDate:currentActivityDate})
    ]);
    regs=Array.isArray(list)?list:[];
    currentDaySummary=sum||{};
    renderOnsiteSeatMap();
    $('sessionSub').textContent=(currentActivityDate?currentActivityDate+'｜':'')+`現場名單 ${regs.length} 筆`;
    renderOnsiteLiveSummary();renderRegs();
  }catch(e){showMsg(e.message,'err')}
}
async function openSession(id,requestedDay=''){
  const found=sessions.find(s=>String(s.id)===String(id));
  currentSession=found||currentSession||{id,name:'',dates:[]};
  if(!currentSession.id)currentSession.id=id;
  const days=onsiteSessionDays(currentSession);
  currentActivityDate=days.includes(String(requestedDay||'').slice(0,10))?String(requestedDay).slice(0,10):pickOnsiteDefaultDay(currentSession);
  $('sessionsView').classList.add('hidden');$('regsView').classList.remove('hidden');
  $('sessionTitle').textContent=currentSession.name||'';
  renderOnsiteDayTabs();renderOnsiteSeatMap();
  await loadOnsiteRegsForDay();
}
function onsiteMapMarkerHtml(m){
  const code=String(m&&m.code||'');
  const label=String(m&&m.specialLabel||m&&m.brand||'空位');
  const equip=(!m.specialLabel&&m.brand)?'<small>設備：'+esc(m.equipmentText||'設備自備')+'</small>':'';
  return '<div class="onsite-map-marker '+(m.specialLabel?'special':'')+'" data-code="'+esc(code)+'" style="left:'+Math.max(1,Math.min(99,Number(m.x)||50))+'%;top:'+Math.max(2,Math.min(98,Number(m.y)||50))+'%"><b>'+esc(code)+'</b><small>'+esc(label)+'</small>'+equip+'</div>';
}
function onsiteMapObjectHtml(o){
  return '<div class="onsite-free-object '+(String(o.kind||'')==='blocked'?'blocked':'')+'" style="left:'+Math.max(1,Math.min(99,Number(o.x)||50))+'%;top:'+Math.max(2,Math.min(98,Number(o.y)||50))+'%">'+esc(o.label||'自訂區塊')+'</div>';
}
function onsiteMapCanvasHtml(cfg,includeBg){
  const markers=Array.isArray(cfg.markers)?cfg.markers:[];
  const freeObjects=Array.isArray(cfg.freeObjects)?cfg.freeObjects:[];
  const markerHtml=markers.filter(m=>(Number(m.x)>0||Number(m.y)>0)).map(onsiteMapMarkerHtml).join('');
  const objectHtml=freeObjects.map(onsiteMapObjectHtml).join('');
  const bg=includeBg&&currentSession&&currentSession.seatMapUrl
    ? '<img src="'+esc(currentSession.seatMapUrl)+'" alt="本場位置圖" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none">'
    : '';
  return bg+markerHtml+objectHtml;
}
function fitOnsiteMap(){
  const fit=$('onsiteMapFit'),canvas=$('onsiteMapVirtual');
  if(!fit||!canvas)return;
  const vw=1200,vh=700;
  const scale=Math.min(fit.clientWidth/vw,fit.clientHeight/vh);
  canvas.style.transform='scale('+scale+')';
  canvas.style.left=Math.max(0,(fit.clientWidth-vw*scale)/2)+'px';
  canvas.style.top=Math.max(0,(fit.clientHeight-vh*scale)/2)+'px';
}
function openOnsiteMapFullscreen(){
  const cfg=(currentSession&&currentSession.seatBoard)||{};
  const modal=$('onsiteMapFullscreen'),body=$('onsiteMapFullscreenBody');
  if(!modal||!body)return;
  $('onsiteMapFullscreenTitle').textContent=(currentSession&&currentSession.name?currentSession.name+'｜':'')+'本場位置圖';
  body.innerHTML='<div id="onsiteMapFullscreenCanvas" class="onsite-map-fullscreen-scroll">'+onsiteMapCanvasHtml(cfg,String(cfg.mode||'')!=='blank')+'</div>';
  modal.classList.remove('hidden');modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  setTimeout(()=>{
    const c=$('onsiteMapFullscreenCanvas'),b=$('onsiteMapFullscreenBody');
    if(!c||!b)return;
    // 手機預設放大到「字可辨識」而不是把 1200px 全塞進 360px。
    const scale=Math.max(.62,Math.min(1,b.clientWidth/760));
    c.style.transform='scale('+scale+')';
    c.parentElement.style.minWidth=(1200*scale+20)+'px';
    c.parentElement.style.minHeight=(700*scale+20)+'px';
  },0);
}
function closeOnsiteMapFullscreen(){
  const modal=$('onsiteMapFullscreen');if(!modal)return;
  modal.classList.add('hidden');modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
function focusOnsiteSeat(regId){
  const r=regs.find(x=>String(x.id)===String(regId));if(!r)return;
  const raw=String(r.stallNumber||'').trim();
  if(!raw){showMsg('這位攤商目前尚未排位','err');return;}
  const codes=raw.split(/[、,，\/\s]+/).map(x=>x.trim()).filter(Boolean);
  const details=document.querySelector('#onsiteSeatMap details');if(details)details.open=true;
  document.querySelectorAll('#onsiteSeatMap .onsite-map-marker').forEach(el=>{
    el.classList.toggle('focused-seat',codes.includes(String(el.dataset.code||'')));
  });
  const map=$('onsiteSeatMap');if(map)map.scrollIntoView({behavior:'smooth',block:'start'});
  showMsg('帶位位置：'+codes.join('、'));
  setTimeout(()=>{
    document.querySelectorAll('#onsiteSeatMap .onsite-map-marker.focused-seat').forEach(el=>el.classList.remove('focused-seat'));
  },7000);
}
function renderOnsiteSeatMap(){
  const box=$('onsiteSeatMap');if(!box)return;
  const cfg=(currentSession&&currentSession.seatBoard)||{};
  const markers=Array.isArray(cfg.markers)?cfg.markers:[];
  const freeObjects=Array.isArray(cfg.freeObjects)?cfg.freeObjects:[];
  const url=String((currentSession&&currentSession.seatMapUrl)||'').trim();
  if(!markers.length&&!freeObjects.length&&!url){box.innerHTML='';return;}
  const equipTotal=String(cfg.equipmentTotalText||'').trim();
  const equipSummary=equipTotal?'<div class="onsite-equip-total"><b>本場設備：</b>'+esc(equipTotal)+'</div>':'';
  const note=cfg.topNote?'<div class="onsite-blank-note">'+esc(cfg.topNote).replace(/\n/g,'<br>')+'</div>':'';
  const includeBg=String(cfg.mode||'')!=='blank';
  box.innerHTML=
    '<details class="onsite-map-card" open>'
      +'<summary>📍 本場位置圖</summary>'
      +equipSummary+note
      +'<div id="onsiteMapFit" class="onsite-map-fit"><div id="onsiteMapVirtual" class="onsite-map-virtual">'
      +onsiteMapCanvasHtml(cfg,includeBg)
      +'</div></div>'
      +'<div class="onsite-map-actions"><button type="button" class="secondary" onclick="fitOnsiteMap()">適合螢幕</button><button type="button" onclick="openOnsiteMapFullscreen()">放大位置圖</button></div>'
    +'</details>';
  requestAnimationFrame(fitOnsiteMap);
}
function backToSessions(){ if(passcode) return; currentSession=null; regs=[]; $('regsView').classList.add('hidden'); $('sessionsView').classList.remove('hidden')}
function canCheckin(r){return r.status==='已錄取' && (String(r.payStatus).includes('已繳費') || r.payStatus==='免費') && !String(r.transferStatus||'').includes('退費')}
function filteredRegs(){
  const kw=$('kw').value.trim().toLowerCase();
  return regs.filter(r=>{
    const hay=[r.brand,r.name,r.phone,r.email,r.stallNumber,r.equipmentText].join(' ').toLowerCase();
    if(kw&&!hay.includes(kw))return false;
    if(onsiteQuickFilter==='unchecked')return r.checkin!=='已報到';
    if(onsiteQuickFilter==='checked')return r.checkin==='已報到';
    if(onsiteQuickFilter==='notTeardown')return String(r.teardown||'未撤場')!=='已撤場';
    if(onsiteQuickFilter==='allDeposit')return r.depositEligible&&Number(r.deposit||0)>0;
    if(onsiteQuickFilter==='refundedDeposit')return r.depositEligible&&Number(r.deposit||0)>0&&String(r.depositRefunded||'')==='已退押金';
    if(onsiteQuickFilter==='notDeposit')return r.depositEligible&&Number(r.deposit||0)>0&&!['已退押金','押金沒收'].includes(String(r.depositRefunded||'未退押金'));
    return true;
  });
}
function toggleRegMore(id){
  const el=document.getElementById('regMore_'+String(id).replace(/[^a-zA-Z0-9_-]/g,'_'));
  if(el)el.classList.toggle('open');
}

function setOnsiteQuickFilter(f){onsiteQuickFilter=f||'all';renderOnsiteLiveSummary();renderRegs();}
function renderOnsiteLiveSummary(){
  const s=currentDaySummary||{},a=s.attendance||{},t=s.teardown||{},d=s.deposit||{};
  const total=Number(a.total)||regs.length,checked=Number(a.checked)||0,unchecked=Number(a.unchecked)||0,notTeardown=Number(t.pending)||0;
  const eq=Array.isArray(s.equipment)?s.equipment:[];
  const nextStep=unchecked>0
    ?`現在先處理：未報到 ${unchecked} 位`
    :(notTeardown>0?`下一步：待撤場 ${notTeardown} 位`:(Number(d.pendingCount||0)>0?`最後一步：待退押金 ${Number(d.pendingCount)||0} 筆`:'本日現場工作已全部完成'));
  if($('onsiteLiveSummary'))$('onsiteLiveSummary').innerHTML=`
    <div class="notice" style="margin:8px 0"><b>${esc(nextStep)}</b></div>
    <div class="onsite-live-summary">
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('all')"><span>應報到</span><b>${total}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('checked')"><span>已報到</span><b>${checked}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('unchecked')"><span>未報到</span><b>${unchecked}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('notTeardown')"><span>待撤場</span><b>${notTeardown}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('notDeposit')"><span>待退押金</span><b>${Number(d.pendingCount)||0}</b></button>
    </div>
    <div class="onsite-live-summary" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('allDeposit')"><span>當日押金總額</span><b>${money(d.totalAmount||0)}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('refundedDeposit')"><span>已退 ${Number(d.refundedCount)||0}</span><b>${money(d.refundedAmount||0)}</b></button>
      <button class="onsite-live-stat" onclick="setOnsiteQuickFilter('notDeposit')"><span>待退 ${Number(d.pendingCount)||0}</span><b>${money(d.pendingAmount||0)}</b></button>
    </div>
    ${Number(d.totalCount||0)===0?`<div class="sub" style="margin:3px 0 6px">本日沒有應退押金；連續多日報名只在最後一個實際參加日退還。</div>`:''}
    ${eq.length?`<div class="sub" style="margin:4px 0 8px"><b>當日設備：</b>${eq.map(x=>`${esc(x.name)} × ${Number(x.qty)||0}`).join('、')}</div>`:''}`;
  const chips=[['all','全部 '+total],['unchecked','未報到 '+unchecked],['checked','已報到 '+checked],['notTeardown','待撤場 '+notTeardown],['allDeposit','全部押金 '+(Number(d.totalCount)||0)],['refundedDeposit','已退押金 '+(Number(d.refundedCount)||0)],['notDeposit','待退押金 '+(Number(d.pendingCount)||0)]];
  if($('onsiteQuickFilters'))$('onsiteQuickFilters').innerHTML=chips.map(([f,label])=>`<button class="onsite-quick-chip ${onsiteQuickFilter===f?'active':''}" onclick="setOnsiteQuickFilter('${f}')">${esc(label)}</button>`).join('');
}

function renderRegs(){
  const box=$('regsList');
  const list=filteredRegs();
  let totDeposit=0,totPartial=0;
  regs.forEach(r=>{
    const dr=String(r.depositRefunded||'');
    if(Number(r.deposit||0)>0&&dr!=='已退押金'&&dr!=='押金沒收')totDeposit+=Number(r.deposit||0);
    if(dr!=='已退押金')totPartial+=Number(r.pendingPartialRefund||0);
  });
  const total=totDeposit+totPartial;
  const totalHtml=total>0
    ? `<div class="onsite-refund-summary"><b>現場待處理退款 ${money(total)}</b>｜押金 ${money(totDeposit)}｜部分退款 ${money(totPartial)}</div>`
    : '';
  if(!list.length){box.innerHTML=totalHtml+'<div class="card empty">沒有符合條件的名單</div>';return}

  box.innerHTML=totalHtml+list.map(r=>{
    const hasDeposit=Number(r.deposit||0)>0;
    const safeId=String(r.id).replace(/[^a-zA-Z0-9_-]/g,'_');
    const equipment=esc(r.equipmentText||equipText(r.equip)||'設備自備');
    const seat=esc(r.stallNumber||'未排位');
    const checkBtn=r.checkin==='已報到'
      ? `<button class="checked" disabled>已報到</button>`
      : `<button onclick="mark('${esc(r.id)}','checkin')" ${canCheckin(r)?'':'disabled'}>報到</button>`;

    const depositTag=hasDeposit
      ? `<span class="tag ${r.depositRefunded==='已退押金'?'ok':r.depositRefunded==='押金沒收'?'bad':'warn'}">${esc(r.depositRefunded||'未退押金')}</span>`
      : '';

    return `<div class="reg">
      <!-- 手機工作小卡 -->
      <div class="mobile-reg-main">
        <div class="mobile-reg-head">
          <div class="mobile-reg-brand">${esc(r.brand||'未填品牌')}</div>
          <div class="mobile-reg-seat ${r.stallNumber?'':'none'}">${seat}</div>
        </div>
        <div class="mobile-reg-equip">設備｜${equipment}</div>
        <div class="mobile-reg-state-tags">
          <span class="tag ${r.checkin==='已報到'?'ok':''}">${esc(r.checkin||'未報到')}</span>
          <span class="tag ${r.teardown==='已撤場'?'ok':''}">${esc(r.teardown||'未撤場')}</span>
          ${hasDeposit?`<span class="tag ${r.depositRefunded==='已退押金'?'ok':r.depositRefunded==='押金沒收'?'bad':'warn'}">${esc(r.depositRefunded||'未退押金')}</span>`:''}
        </div>
        <div class="mobile-reg-buttons">
          ${checkBtn}
          <button class="secondary" onclick="mark('${esc(r.id)}','${r.teardown==='已撤場'?'teardownUndo':'teardownDone'}')">${r.teardown==='已撤場'?'取消撤場':'撤場'}</button>
          ${hasDeposit?`<button class="secondary" onclick="mark('${esc(r.id)}','depositRefund')" ${r.depositEligible&&r.teardown==='已撤場'&&r.depositRefunded!=='已退押金'?'':'disabled'}>${r.depositRefunded==='已退押金'?'押金已退':r.depositEligible?'退押金':'最後一天退'}</button>`:''}
          <button class="secondary" onclick="focusOnsiteSeat('${esc(r.id)}')">帶位</button>
          <button class="secondary" onclick="toggleRegMore('${safeId}')">更多</button>
        </div>
        <div id="regMore_${safeId}" class="reg-more">
          <div class="kv">
            <div class="k">聯絡人</div><div>${esc(r.name)}｜${esc(r.phone)}</div>
            <div class="k">付款</div><div>${esc(r.payStatus||'—')}｜${money(r.amount||r.totalAmount||0)}</div>
            <div class="k">位置</div><div><b>${seat}</b></div>
            <div class="k">攤位數</div><div>${r.stallCount||1}</div>
            <div class="k">設備</div><div><b>${equipment}</b></div>
            ${hasDeposit?`<div class="k">押金</div><div>${money(r.deposit||0)}｜${esc(r.depositRefunded||'未退押金')}</div>`:''}
            ${Number(r.pendingPartialRefund||0)>0?`<div class="k">待退款</div><div>${money(r.pendingPartialRefund)} ${esc(r.pendingPartialNote||'')}</div>`:''}
            <div class="k">備註</div><div>${esc(r.adminNote||'—')}</div>
          </div>
          <div class="row" style="margin-top:7px">
            <span class="tag ${canCheckin(r)?'ok':'bad'}">${esc(r.status||'')}</span>
            <span class="tag ${String(r.payStatus).includes('已繳費')||r.payStatus==='免費'?'ok':'warn'}">${esc(r.payStatus||'')}</span>
            ${depositTag}
            ${r.transferStatus?`<span class="tag bad">${esc(r.transferStatus)}</span>`:''}
          </div>
          <div class="reg-more-actions">
            <button class="secondary" onclick="mark('${esc(r.id)}','undoCheckin')" ${r.checkin==='已報到'?'':'disabled'}>取消報到</button>
            <button class="secondary" onclick="mark('${esc(r.id)}','noShow')">未到</button>
            <button class="warn" onclick="mark('${esc(r.id)}','lateFlag')">遲到</button>
            <button class="warn" onclick="mark('${esc(r.id)}','ruleFlag')">違規</button>
            <button class="warn" onclick="mark('${esc(r.id)}','earlyFlag')">早退</button>
            <button onclick="mark('${esc(r.id)}','teardownDone')" ${r.teardown==='已撤場'?'disabled':''}>已撤場</button>
            <button class="secondary" onclick="mark('${esc(r.id)}','teardownUndo')" ${r.teardown==='已撤場'?'':'disabled'}>取消撤場</button>
            ${hasDeposit?`<button onclick="mark('${esc(r.id)}','depositRefund')" ${r.depositEligible&&r.teardown==='已撤場'&&r.depositRefunded!=='已退押金'?'':'disabled'}>${r.depositRefunded==='已退押金'?'押金已退':r.depositEligible?'退押金':'最後一天退'}</button>${passcode?'':`<button class="danger" onclick="mark('${esc(r.id)}','depositForfeited')" ${r.depositEligible?'':'disabled'}>沒收押金</button>`}`:''}
            <button class="secondary" onclick="mark('${esc(r.id)}','note')">特殊備註</button>
          </div>
        </div>
      </div>

      <!-- 桌機沿用完整資料卡 -->
      <div class="reg-left">
        <h3>${esc(r.brand||'未填品牌')}</h3>
        <div class="position-banner"><span class="position-label">位置</span><span class="position-no ${r.stallNumber?'':'none'}">${seat}</span><span class="position-label">${r.stallCount||1} 攤</span></div>
        <div class="row" style="margin-bottom:8px">
          <span class="tag ${canCheckin(r)?'ok':'bad'}">${esc(r.status||'')}</span>
          <span class="tag ${String(r.payStatus).includes('已繳費')||r.payStatus==='免費'?'ok':'warn'}">${esc(r.payStatus)}</span>
          <span class="tag ${r.checkin==='已報到'?'ok':''}">${esc(r.checkin||'未報到')}</span>
          <span class="tag ${r.teardown==='已撤場'?'ok':''}">${esc(r.teardown||'未撤場')}</span>
          ${r.violation?`<span class="tag bad">違規：${esc(r.violation)}</span>`:''}
          ${depositTag}
          ${r.transferStatus?`<span class="tag bad">${esc(r.transferStatus)}</span>`:''}
        </div>
        <div class="kv">
          <div class="k">聯絡人</div><div>${esc(r.name)}｜${esc(r.phone)}</div>
          <div class="k">已繳金額</div><div>${money(r.amount||r.totalAmount||0)}</div>
          <div class="k">付款時間</div><div>${dt(r.paidAt)}</div>
          <div class="k">攤位數</div><div>${r.stallCount||1}</div>
          <div class="k">設備</div><div><b>${equipment}</b></div>
          <div class="k">押金</div><div>${money(r.deposit||0)}　${esc(r.depositRefunded||'未退押金')}</div>
          ${Number(r.pendingPartialRefund||0)>0?`<div class="k">退部分天（待退）</div><div>${money(r.pendingPartialRefund)}${r.pendingPartialNote?`　<span style="font-size:13px;color:#8a6d3b">${esc(r.pendingPartialNote)}</span>`:''}</div>`:''}
          <div class="k">備註</div><div>${esc(r.adminNote||'—')}</div>
        </div>
      </div>
      <div class="reg-actions">
        <button onclick="mark('${esc(r.id)}','checkin')" ${canCheckin(r)&&r.checkin!=='已報到'?'':'disabled'}>報到</button>
        <button class="secondary" onclick="mark('${esc(r.id)}','undoCheckin')" ${r.checkin==='已報到'?'':'disabled'}>取消報到</button>
        <button class="secondary" onclick="focusOnsiteSeat('${esc(r.id)}')">帶位</button>
        <button class="secondary" onclick="mark('${esc(r.id)}','noShow')">未到</button>
        <button class="warn" onclick="mark('${esc(r.id)}','lateFlag')">遲到</button>
        <button class="warn" onclick="mark('${esc(r.id)}','ruleFlag')">不遵守規定</button>
        <button class="warn" onclick="mark('${esc(r.id)}','earlyFlag')">早退</button>
        <button onclick="mark('${esc(r.id)}','teardownDone')" ${r.teardown==='已撤場'?'disabled':''}>已撤場</button>
        <button class="secondary" onclick="mark('${esc(r.id)}','teardownUndo')" ${r.teardown==='已撤場'?'':'disabled'}>未撤場</button>
        ${hasDeposit?`<button onclick="mark('${esc(r.id)}','depositRefund')" ${r.depositEligible&&r.teardown==='已撤場'&&r.depositRefunded!=='已退押金'?'':'disabled'}>${r.depositRefunded==='已退押金'?'押金已退':r.depositEligible?'退押金':'最後一天退'}</button>${passcode?'':`<button class="danger" onclick="mark('${esc(r.id)}','depositForfeited')" ${r.depositEligible?'':'disabled'}>沒收押金</button>`}`:''}
        <button class="secondary" onclick="mark('${esc(r.id)}','note')">特殊備註</button>
      </div>
    </div>`;
  }).join('');
}
async function mark(id,mode){
  const needNote=['refundFlag','noShow','depositForfeited','note'];
  const confirmMsgs={
    depositRefund:'確認退還押金給攤商？',
    depositForfeited:'確認沒收押金（違約）？押金將轉為收入。'
  };
  if(confirmMsgs[mode] && !confirm(confirmMsgs[mode])) return;
  const note=needNote.includes(mode)?prompt('可輸入現場備註（可留空）',''):'';
  try{await apiPost('onsiteMark',{regId:id,mode,note,operatorName,activityDate:currentActivityDate}); showMsg('已更新'); if(currentSession) await loadOnsiteRegsForDay()}catch(e){showMsg(e.message,'err')}
}
window.addEventListener('resize',()=>{if($('onsiteMapFit'))fitOnsiteMap();});
boot();
</script>
