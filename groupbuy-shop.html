<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>團購購物</title><style>body{font-family:sans-serif;margin:0;background:#fafaf8;padding-bottom:85px}.top{padding:15px;background:#fff;border-bottom:1px solid #eee;font-size:20px;font-weight:900}.w{max-width:900px;margin:auto;padding:12px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#fff;border:1px solid #e8e8e4;border-radius:16px;overflow:hidden}.pic{aspect-ratio:1;background:#f3f3ef}.pic img{width:100%;height:100%;object-fit:contain}.b{padding:10px}.d{font-size:13px;color:#666;height:38px;overflow:hidden}.q{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;margin-top:7px}.q button{border:0;background:#DDEAD1;height:34px;font-weight:900}.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px}.bi{max-width:900px;margin:auto;display:flex;gap:10px;align-items:center}.ct{flex:1;font-weight:900}.btn{border:0;background:#111;color:#fff;padding:12px 16px;border-radius:11px;font-weight:900}.ov{display:none;position:fixed;inset:0;background:#fff;z-index:30;overflow:auto}.ov.open{display:block}.sheet{max-width:650px;margin:auto;padding:18px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.box{padding:12px;border:1px solid #ddd;border-radius:13px;margin:12px 0}.box input{width:100%;padding:10px;margin:4px 0;box-sizing:border-box}.sum{background:#DDEAD1;padding:12px;border-radius:13px;margin:12px 0}.hide{display:none}@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}</style><div class=top id=t>團購購物</div><main class=w><div id=p class=g>載入中…</div></main><div class=bot><div class=bi><div id=ct class=ct>尚未選商品</div><button class=btn onclick=cartOpen()>查看購物車</button></div></div><div id=ov class=ov><div class=sheet><h2>購物車</h2><div id=lines></div><div id=ful class=box></div><div id=addr class="box hide"><input id=rn placeholder=收件人><input id=rp placeholder=收件電話><input id=ra placeholder=宅配地址></div><div id=sum class=sum></div><div id=login class="box hide"><b>結帳前請登入 2BL 會員</b><input id=em placeholder=Email><input id=lp placeholder=手機><button onclick=doLogin()>登入</button></div><button class=btn style="width:100%" onclick=order()>確認訂購</button><button style="width:100%;padding:12px;margin-top:8px" onclick=cartClose()>繼續購物</button></div></div><script>const A="https://2bl-v7.ndiangrace.workers.dev",T="tuibile",K="2bl_member_token",id=new URLSearchParams(location.search).get("id")||"";let S,P=[],C={};async function get(a,e={}){let u=new URL(A);Object.entries({action:a,tenant:T,...e}).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:"no-store"}).then(r=>r.json())}async function post(a,e={}){return fetch(A,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,tenant:T,...e})}).then(r=>r.json())}function m(n){return "NT$ "+Number(n||0).toLocaleString()}function ch(i,d){let x=P.find(z=>z.id===i),n=Math.max(0,(C[i]||0)+d);if(x.stock_qty!=null)n=Math.min(n,+x.stock_qty);if(x.per_member_limit!=null)n=Math.min(n,+x.per_member_limit);C[i]=n;document.getElementById("q"+i).textContent=n;bar()}function am(){return P.reduce((s,x)=>s+(C[x.id]||0)*+x.price,0)}function cnt(){return Object.values(C).reduce((s,n)=>s+n,0)}function bar(){ct.textContent=cnt()?`已選 ${cnt()} 件｜${m(am())}`:"尚未選商品"}function ft(){return document.querySelector("[name=f]:checked")?.value||""}function sf(){let g=S.groupBuySettings||{},a=am();return ft()==="shipping"?((+g.freeShippingThreshold>0&&a>=+g.freeShippingThreshold)?0:+g.shippingFee||0):0}function summary(){let g=S.groupBuySettings||{},m1=am(),s=sf();sum.innerHTML=`商品 ${m(m1)}<br>運費 ${m(s)}<br><b>合計 ${m(m1+s)}</b>`+(ft()==="shipping"&&+g.freeShippingThreshold>m1?`<br><small>再買 ${m(+g.freeShippingThreshold-m1)} 即享免運</small>`:"");addr.classList.toggle("hide",ft()!=="shipping")}function cartOpen(){if(!cnt())return alert("請先選商品");lines.innerHTML=P.filter(x=>C[x.id]).map(x=>`<div class=line><span>${x.name} × ${C[x.id]}</span><b>${m(C[x.id]*x.price)}</b></div>`).join("");let g=S.groupBuySettings||{},h="";if(g.pickupEnabled===true)h+='<label><input type=radio name=f value=pickup> 現場取貨</label><br>';if(g.shippingEnabled===true)h+='<label><input type=radio name=f value=shipping> 宅配</label>';ful.innerHTML=h||"<b>目前沒有可用取貨方式</b>";let z=ful.querySelector("[name=f]");if(z){z.checked=true;ful.querySelectorAll("[name=f]").forEach(a=>a.onchange=summary)}summary();ov.classList.add("open")}function cartClose(){ov.classList.remove("open")}async function doLogin(){let j=await post("memberEmailPhoneLogin",{email:em.value,phone:lp.value});if(j.error)return alert(j.error);localStorage.setItem(K,j.token);login.classList.add("hide");alert("登入成功")}async function order(){if(!ft())return alert("沒有可用取貨方式");let tk=localStorage.getItem(K)||"";if(!tk){login.classList.remove("hide");return}let items=Object.entries(C).filter(x=>x[1]>0).map(([product_id,quantity])=>({product_id,quantity}));let j=await post("placeSessionProductOrder",{memberToken:tk,sessionId:S.id,idempotencyKey:crypto.randomUUID(),fulfillmentType:ft(),recipientName:rn.value,recipientPhone:rp.value,shippingAddress:ra.value,items});if(j.error)return alert(j.error);alert(`訂購成功\n商品 ${m(j.product_amount)}\n運費 ${m(j.shipping_fee)}\n合計 ${m(j.total_amount)}`);location.reload()}async function load(){try{let j=await get("sessionProducts",{sessionId:id});if(j.error)throw Error(j.error);S=j.session;P=j.products||[];t.textContent=S.name||"團購購物";p.innerHTML=P.map(x=>`<div class=c><div class=pic>${x.image_url?`<img src="${x.image_url}">`:""}</div><div class=b><b>${x.name}</b><div class=d>${x.description||""}</div><strong>${m(x.price)}</strong><div class=q><button onclick="ch('${x.id}',-1)">－</button><b id="q${x.id}">0</b><button onclick="ch('${x.id}',1)">＋</button></div></div></div>`).join("")||"目前尚無商品"}catch(e){p.innerHTML=e.message}}load()</script>
