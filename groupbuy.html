<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>團GO</title><style>
:root{--g:#DDEAD1;--y:#FAEEC7;--b:#D9E5EE;--p:#DCD7ED;--line:#e7e7e2;--muted:#666;--bg:#fafaf8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:#111;padding-bottom:86px}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px}.topin{width:calc(100vw - 24px);max-width:none;margin:auto;display:flex;align-items:center;gap:10px;min-height:52px}.brand{display:flex;align-items:center;gap:9px;min-width:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}.logo{display:flex;align-items:center;justify-content:center;min-width:62px;height:38px;padding:0 10px;border:2px solid #111;border-radius:11px;font-weight:1000;font-size:20px;letter-spacing:-1px;background:#fff;cursor:pointer}.tagline{font-size:13px;font-weight:850;color:#515151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topactions{margin-left:auto;display:flex;align-items:center;gap:7px}.topbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:900;white-space:nowrap}.topbtn.recruitbtn{background:var(--g);border-color:var(--g)}@media(max-width:560px){.top{padding:7px 8px}.topin{gap:6px}.logo{min-width:56px;height:36px;font-size:18px;padding:0 8px}.tagline{font-size:11px;max-width:92px}.topbtn{padding:8px 8px;font-size:13px}}.wrap{width:calc(100vw - 20px);max-width:none;margin:auto;padding:12px 0}.storehead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 10px}.storehead h2{font-size:19px;margin:0}.storemeta{min-width:0}.applysmall{display:inline-block;margin-top:5px;border:0;background:transparent;padding:0;color:#586750;font-size:11px;font-weight:850;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.shipnote{flex:0 0 auto;background:var(--y);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}.cover{aspect-ratio:1;background:#f1f1ed}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:7px;display:flex;flex-direction:column;flex:1;min-width:0}.name{font-size:12px;font-weight:950;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}.desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:27px}.price{font-size:13px;font-weight:950;margin-top:5px}.old{text-decoration:line-through;color:#999;font-size:10px;margin-right:3px}.tier{font-size:9px!important;line-height:1.3;min-height:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.qty{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:auto}.qty button{height:30px;border:0;background:var(--g);font-weight:950}.qty b{font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.name{font-size:13px}.desc{font-size:11px}.tier{font-size:10px!important}}@media(min-width:1180px){.grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.body{padding:8px}.name{font-size:13px}.desc{font-size:11px}}.status{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--y);font-size:12px;font-weight:900;margin-top:5px}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.back{border:0;background:transparent;font-weight:900;margin-bottom:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:25}.bottomin{width:calc(100vw - 24px);max-width:none;margin:auto;display:flex;gap:10px;align-items:center}.carttext{flex:1;font-weight:900}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:12px 16px;font-weight:900}.secondary{border:0;background:#eee;border-radius:11px;padding:11px 14px;font-weight:900}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.sheetin{max-width:680px;margin:auto}.field{margin:10px 0}.field label{display:block;font-weight:900;font-size:14px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.summary{background:var(--g);border-radius:14px;padding:13px;margin:12px 0}.recruit{margin-top:24px;background:var(--g);border-radius:18px;padding:18px}.recruit h2{margin:0 0 6px}.recruit p{margin:0 0 12px;color:#42533e;line-height:1.6}.hide{display:none!important}.promo{background:var(--p);border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:14px;font-weight:850}.tier{font-size:12px;color:#755e00;margin-top:4px}

.gb-list{display:flex;flex-direction:column;gap:14px}.gb-row{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;grid-template-columns:clamp(180px,19vw,260px) minmax(0,1fr) clamp(220px,20vw,300px);gap:14px;align-items:start}.gb-main{min-width:0;display:flex;flex-direction:column;min-height:100%}.gb-cover{width:100%;aspect-ratio:1/1;height:auto;align-self:start;justify-self:start;border-radius:7px;overflow:hidden;background:#f2f2ee;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}.gb-cover img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block}.gb-title{font-size:19px;font-weight:1000;line-height:1.3}.gb-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:6px;white-space:pre-wrap}.gb-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;padding:8px 0 3px;margin-top:auto}.gb-products::-webkit-scrollbar{height:5px}.gb-products::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px}.gb-prod{min-width:0;width:auto;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.gb-prod-img{aspect-ratio:1;background:#f3f3ef;overflow:hidden}.gb-prod-img img{width:100%;height:100%;object-fit:cover}.gb-prod-body{padding:8px}.gb-prod-name{font-size:13px;font-weight:900;line-height:1.35;min-height:35px}.gb-prod-price{font-size:13px;font-weight:1000;margin-top:5px}.gb-prod-old{text-decoration:line-through;color:#999;font-size:11px;margin-right:4px}.gb-prod-qty{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:7px}.gb-prod-qty button{height:30px;border:0;background:var(--g);font-weight:1000}.gb-prod-qty button:disabled{background:#eee;color:#aaa}.gb-prod-qty b{font-size:13px}.gb-side{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;justify-content:center}.gb-side-label{font-size:12px;color:var(--muted)}.gb-total{font-size:23px;font-weight:1000;margin:4px 0}.gb-free{font-size:13px;font-weight:850;line-height:1.5}.gb-checkout{margin-top:12px;width:100%}.gb-empty-products{font-size:13px;color:var(--muted);padding:18px 2px}.gb-empty-card{background:#fff;border:1px dashed #ccc;border-radius:9px;padding:28px 18px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.gb-row{grid-template-columns:clamp(140px,24vw,200px) minmax(0,1fr);gap:12px}.gb-side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:10px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}.gb-side .gb-side-label{grid-column:1}.gb-total{grid-column:1;margin:0;font-size:20px}.gb-free{grid-column:1}.gb-checkout{grid-column:2;grid-row:1/4;margin:0;align-self:center}}@media(max-width:760px){.gb-row{grid-template-columns:104px minmax(0,1fr);gap:10px;padding:10px}.gb-title{font-size:17px}.gb-desc{font-size:12px}.gb-products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:430px){.tagline{display:none}.topactions{gap:5px}.topbtn{font-size:11px;padding:7px 6px}.gb-row{grid-template-columns:88px minmax(0,1fr)}.desc{display:none}.tier{min-height:22px}}
</style></head><body><header class=top><div class=topin><div id=brandEntry class=brand><div class=logo aria-label="團GO">團GO</div><div class=tagline>好物一起買，更划算。</div></div><div class=topactions><button class="topbtn recruitbtn" onclick=openApply()>成為團購主</button><button class=topbtn onclick=openMyOrders()>我的訂單</button><button id=loginBtn class=topbtn onclick=openPublicLogin()>團購會員登入</button></div></div></header><main class=wrap><div id=content><div class=empty>載入中…</div></div></main><footer id=cartBar class="bottom hide"><div class=bottomin><div id=cartText class=carttext>尚未選商品</div><button class=primary onclick=openCart()>查看購物車</button></div></footer>
<div id=cartModal class=overlay><div class=sheet><div class=sheetin><h2>購物車</h2><div id=cartLines></div><div id=fulBox class=field></div><div id=shipFields class=hide><div class=field><label>收件人</label><input id=recipient></div><div class=field><label>手機</label><input id=rphone></div><div class=field><label>郵遞區號</label><input id=postal></div><div class=field><label>完整地址</label><input id=address></div><div class=field><label>出貨備註</label><input id=orderNote></div></div><div id=cartSummary class=summary></div><div id=buyerLogin class="hide"><div class=field><label>Email</label><input id=buyerEmail></div><div class=field><label>手機</label><input id=buyerPhone></div><button class=secondary onclick=buyerLoginDo()>登入團購會員</button></div><button class=primary style="width:100%;margin-top:10px" onclick=placeOrder()>確認訂購</button><button class=secondary style="width:100%;margin-top:8px" onclick=closeCart()>繼續購物</button></div></div></div>
<div id=myOrdersModal class=overlay><div class=sheet><div class=sheetin><h2>我的團購訂單</h2><div id=myOrdersList class=muted>載入中…</div><button class=secondary style="width:100%;margin-top:10px" onclick="myOrdersModal.classList.remove('open')">關閉</button></div></div></div><div id=loginModal class=overlay><div class=sheet><div class=sheetin><h2>團購會員登入</h2><div id=publicLoginFields><div class=field><label>Email</label><input id=publicEmail autocomplete=email></div><div class=field><label>手機</label><input id=publicPhone inputmode=tel></div><button class=primary style="width:100%" onclick=publicLoginDo()>登入</button></div><div id=publicLogged class="hide"><div class=summary>目前已登入團購會員</div><button class=secondary style="width:100%" onclick=publicRelogin()>重新登入</button></div><button class=secondary style="width:100%;margin-top:8px" onclick=closePublicLogin()>關閉</button></div></div></div>
<div id=applyModal class=overlay><div class=sheet><div class=sheetin><h2>申請成為團購主</h2><div id=applyGate><div class=summary><b>已經有 2BL 帳號？</b><div style="margin-top:8px"><button class=primary onclick=showApplyLogin()>登入既有帳號</button></div></div><div class=summary style="background:#f1f1ed"><b>還沒有帳號？</b><div style="margin-top:8px"><button class=secondary onclick=showApplyCreate()>建立會員資料</button></div></div></div><div id=applyLoginPanel class=hide><h3>登入既有 2BL 帳號</h3><div class=field><label>Email</label><input id=applyEmail autocomplete=email></div><div class=field><label>手機</label><input id=applyPhone inputmode=tel></div><button class=primary style="width:100%" onclick=applyLoginDo()>登入</button><button class=secondary style="width:100%;margin-top:8px" onclick=showApplyGate()>返回</button></div><div id=applyCreatePanel class=hide><h3>建立會員資料</h3><div class=field><label>姓名 *</label><input id=createName></div><div class=field><label>Email／登入帳號 *</label><input id=createEmail autocomplete=email></div><div class=field><label>手機 *</label><input id=createPhone inputmode=tel></div><div class=field><label>品牌／顯示名稱</label><input id=createBrand></div><button class=primary style="width:100%" onclick=createGroupBuyMember()>建立並登入</button><button class=secondary style="width:100%;margin-top:8px" onclick=showApplyGate()>返回</button></div><div id=applyForm class=hide><div class=summary><b>會員資料</b><div id=applyMemberSummary style="margin-top:6px;line-height:1.7"></div></div><div class=field><label>團購主 ID *</label><input id=applyHandle maxlength=20 placeholder="例如 cat" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_-]/g,'')" onblur=checkApplyHandle()><div id=applyHandleStatus class=desc>3–20 個字元，可用英文、數字、_、-。這會成為你的分享識別。</div></div><div class=field><label>團購主／品牌顯示名稱</label><input id=applyName></div><div class=field><label>主要社群／LINE 群／FB 社團／IG 連結 *</label><input id=applySocial></div><div class=field><label>社群／群組人數</label><input id=applyAudience type=number min=0></div><div class=field><label>平均貼文／團購觸及人數</label><input id=applyReach type=number min=0></div><div class=field><label>過去團購經驗</label><textarea id=applyExp></textarea></div><div class=field><label>希望合作商品類型</label><textarea id=applyCats></textarea></div><div class=field><label>其他說明</label><textarea id=applyNote></textarea></div><button class=primary style="width:100%" onclick=submitApply()>送出申請</button></div><button class=secondary style="width:100%;margin-top:8px" onclick=closeApply()>關閉</button></div></div></div>
<script>
const API='https://2bl-v7.ndiangrace.workers.dev',T='tuibile',TK='2bl_member_token',Q=new URLSearchParams(location.search);let sessions=[],S=null,P=[],C={},ref=Q.get('ref')||'',groupCode=Q.get('g')||'',refToken='',customerPrices={},OrderAttempt={signature:'',key:''};
async function apiFetch(url,opts={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opts,signal:c.signal,cache:'no-store'});const text=await r.text();let j;try{j=JSON.parse(text)}catch(e){throw new Error('伺服器回傳格式錯誤')}if(!r.ok)throw new Error(j&&j.error||('HTTP '+r.status));return j}catch(e){if(e&&e.name==='AbortError')throw new Error('連線逾時，請重新整理後再試');throw e}finally{clearTimeout(tm)}}async function get(a,e={}){const u=new URL(API);Object.entries({action:a,tenant:T,...e}).forEach(([k,v])=>u.searchParams.set(k,v));return apiFetch(u.toString())}async function post(a,e={}){return apiFetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,tenant:T,...e})})}function tk(){return localStorage.getItem(TK)||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return'NT$ '+Number(n||0).toLocaleString()}function settings(){return S&&S.groupBuySettings||{}}function saleState(g){const now=Date.now(),a=g.saleStartAt?Date.parse(g.saleStartAt):0,b=g.saleEndAt?Date.parse(g.saleEndAt):0;if(a&&now<a)return'即將開賣';if(b&&now>b)return'已截止';return'開放中'}
const HomeCarts={};
async function boot(){
 try{
  if(ref){
   const rr=await get('resolveGroupBuyReferral',{ref,g:groupCode});
   if(rr.error){content.innerHTML='<div class=empty>'+esc(rr.error)+'</div>';return}
   refToken=rr.referralToken||'';await openStore(rr.sessionId,true);return
  }
  if(groupCode){
   const j=await get('groupBuySessions');
   if(j.error){content.innerHTML='<div class=empty>'+esc(j.error)+'</div>';return}
   sessions=Array.isArray(j)?j:[];
   const s=sessions.find(x=>String(x.id)===String(groupCode)||String((x.groupBuySettings||{}).publicCode||'').toUpperCase()===String(groupCode).toUpperCase());
   if(!s){content.innerHTML='<div class=empty>找不到這場團購</div>';return}
   await openStore(s.id,true);return
  }
  const id=Q.get('id')||'';
  if(id){await openStore(id,true);return}
  const j=await get('groupBuySessions');
  if(j.error){content.innerHTML='<div class=empty>'+esc(j.error)+'</div>';return}
  sessions=Array.isArray(j)?j:[];
  renderList()
 }catch(e){
  console.error('groupbuy boot failed',e);
  content.innerHTML='<div class=empty>團購載入失敗，請重新整理後再試。</div>';
 }
}
function homeSession(id){return sessions.find(x=>String(x.id)===String(id))}
function homeProduct(sid,pid){return (homeSession(sid)?.products||[]).find(x=>String(x.id)===String(pid))}
function renderList(){
 if(!sessions.length){content.innerHTML='<div class=gb-empty-card>目前還沒有開放中的團購</div>';cartBar.classList.add('hide');return}
 content.innerHTML='<div class=gb-list>'+sessions.map(s=>{
  const g=s.groupBuySettings||{},st=saleState(g),can=st==='開放中',cover=g.coverImageUrl||s.coverUrl||'',desc=g.groupBuyDescription||s.description||'',ps=Array.isArray(s.products)?s.products:[];
  HomeCarts[s.id]=HomeCarts[s.id]||{};
  return `<section class=gb-row>
   <div class=gb-cover>${cover?`<img src="${esc(cover)}" alt="">`:'<span>1:1 團購圖片</span>'}</div>
   <div class=gb-main>
    <div><div class=gb-title>${esc(s.name)}</div><span class=status>${st}</span></div>
    <div class=gb-desc>${esc(desc)}</div>
    <div class=gb-products>${ps.length?ps.map(p=>`<article class=gb-prod>
      <div class=gb-prod-img>${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}</div>
      <div class=gb-prod-body>
       <div class=gb-prod-name>${esc(p.name)}</div>
       <div class=gb-prod-price>${Number(p.original_price||0)>Number(p.price||0)?`<span class=gb-prod-old>${money(p.original_price)}</span>`:''}<span id="hp_${esc(s.id)}_${esc(p.id)}">${money(p.displayPrice??p.price??0)}</span></div>
       <div class=gb-prod-qty><button ${can&&p.status!=='sold_out'?'':'disabled'} onclick="homeChange('${esc(s.id)}','${esc(p.id)}',-1)">－</button><b id="hq_${esc(s.id)}_${esc(p.id)}">0</b><button ${can&&p.status!=='sold_out'?'':'disabled'} onclick="homeChange('${esc(s.id)}','${esc(p.id)}',1)">＋</button></div>
      </div>
    </article>`).join(''):'<div class=gb-empty-products>商品準備中</div>'}</div>
   </div>
   <aside class=gb-side>
    <div class=gb-side-label>目前商品金額</div>
    <div class=gb-total id="ht_${esc(s.id)}">${money(0)}</div>
    <div class=gb-free id="hf_${esc(s.id)}">${g.shippingEnabled?(Number(g.freeShippingThreshold||0)>0?'免運門檻 '+money(g.freeShippingThreshold):'本團宅配無免運門檻'):'本團未開放宅配'}</div>
    <button class="primary gb-checkout" ${can&&ps.length?'':'disabled'} onclick="checkoutHome('${esc(s.id)}')">結帳</button>
   </aside>
  </section>`
 }).join('')+'</div>';
 cartBar.classList.add('hide');
 sessions.forEach(s=>homeQuote(s.id))
}

async function homeChange(sid,pid,d){const s=homeSession(sid),g=s?.groupBuySettings||{};if(saleState(g)!=='開放中')return;const p=homeProduct(sid,pid);if(!p||p.status==='sold_out')return;const c=HomeCarts[sid]||(HomeCarts[sid]={});let n=Math.max(0,(Number(c[pid])||0)+d);if(p.stock_qty!=null)n=Math.min(n,Number(p.stock_qty)||0);if(p.per_member_limit!=null)n=Math.min(n,Number(p.per_member_limit)||0);c[pid]=n;const q=document.getElementById(`hq_${sid}_${pid}`);if(q)q.textContent=n;await homeQuote(sid)}
async function homeQuote(sid){const s=homeSession(sid);if(!s)return;const c=HomeCarts[sid]||{},items=Object.entries(c).filter(x=>Number(x[1])>0).map(([product_id,quantity])=>({product_id,quantity:Number(quantity)}));let q;try{q=await post('sessionCartQuote',{sessionId:sid,items,referralToken:refToken})}catch(e){return}if(!q||q.error)return;for(const it of (q.items||[])){const el=document.getElementById(`hp_${sid}_${it.productId}`);if(el)el.textContent=money(it.unitPrice)}const total=document.getElementById('ht_'+sid);if(total)total.textContent=money(q.productAmount||0);const free=document.getElementById('hf_'+sid);if(free){if(!q.shippingEnabled)free.textContent='本團未開放宅配';else if(!Number(q.freeShippingThreshold||0))free.textContent='本團宅配無免運門檻';else if(q.freeShippingReached)free.textContent='滿 '+money(q.freeShippingThreshold||0)+' 免運｜已達免運';else free.textContent='滿 '+money(q.freeShippingThreshold||0)+' 免運｜再 '+money(q.remainingForFreeShipping||0)}}
function cycleHomeProductImage(sid,pid){const p=homeProduct(sid,pid),a=(p?.images||[]);if(a.length<2)return;const el=document.getElementById(`himg_${sid}_${pid}`);if(!el)return;let i=Number(el.dataset.i||0);i=(i+1)%a.length;el.dataset.i=i;el.src=a[i]}
function cycleDirectProductImage(pid){const p=P.find(x=>String(x.id)===String(pid)),a=(p?.images||[]);if(a.length<2)return;const el=document.getElementById('dimg_'+pid);if(!el)return;let i=Number(el.dataset.i||0);i=(i+1)%a.length;el.dataset.i=i;el.src=a[i]}
function checkoutHome(sid){const s=homeSession(sid);if(!s)return;const c=HomeCarts[sid]||{};if(!Object.values(c).some(v=>Number(v)>0))return alert('請先選擇商品數量');S={id:s.id,name:s.name,groupBuySettings:s.groupBuySettings||{}};P=s.products||[];C={...c};customerPrices={};openCart()}
async function openStore(id,keepUrl=false){const j=await get('sessionProducts',{sessionId:id,referralToken:refToken});if(j.error){content.innerHTML='<div class=empty>'+esc(j.error)+'</div>';return}S=j.session;P=j.products||[];customerPrices=j.customerPrices||{};C={};if(!keepUrl&&!ref)history.pushState({},'',location.pathname+'?id='+encodeURIComponent(id));renderStore()}
function displayUnit(p,qty=1){return qty===1?Number(p.displayPrice??p.price??0):Number(p.price||0)}
function renderStore(){const g=settings(),promo=ref?'<div class=promo>你正在使用團購主專屬連結，訂單來源會由系統自動歸屬。</div>':'';const ship=g.shippingEnabled?(Number(g.freeShippingThreshold||0)>0?'滿 '+money(g.freeShippingThreshold)+' 免運':'宅配無免運門檻'):'未開放宅配';content.innerHTML='<button class=back onclick="goHome()">← 回團購首頁</button>'+promo+'<div class=storehead><div class=storemeta><h2>'+esc(S.name)+'</h2><button class=applysmall type=button onclick="openApply()">想自己開團？申請成為團購主 →</button></div><div class=shipnote id=storeShipNote>'+ship+'</div></div><div class=grid>'+P.map(p=>`<article class=card><div class=cover>${p.image_url?`<img src="${esc(p.image_url)}">`:''}</div><div class=body><div class=name>${esc(p.name)}</div><div class=desc>${esc(p.description||'')}</div><div class=price>${Number(p.original_price||0)>Number(p.price||0)?`<span class=old>${money(p.original_price)}</span>`:''}<span id="price_${p.id}">${money(displayUnit(p,1))}</span></div>${(p.quantityTiers||[]).length?`<div class=tier>${(p.quantityTiers||[]).map(t=>'滿 '+t.minQty+' 個，每個 '+money(t.unitPrice)).join('｜')}</div>`:''}<div class=qty><button onclick="chg('${p.id}',-1)">－</button><b id="q_${p.id}">0</b><button onclick="chg('${p.id}',1)">＋</button></div></div></article>`).join('')+'</div>';cartBar.classList.remove('hide');bar()}
function goHome(){history.pushState({},'',location.pathname);ref='';groupCode='';refToken='';S=null;P=[];C={};renderList()}async function chg(id,d){const p=P.find(x=>x.id===id);let n=Math.max(0,(C[id]||0)+d);if(p.stock_qty!=null)n=Math.min(n,+p.stock_qty);if(p.per_member_limit!=null)n=Math.min(n,+p.per_member_limit);C[id]=n;document.getElementById('q_'+id).textContent=n;await bar()}let CurrentQuote={items:[],productAmount:0,shippingFee:0,totalAmount:0,remainingForFreeShipping:0,freeShippingReached:false};
function count(){return Object.values(C).reduce((a,b)=>a+Number(b||0),0)}
function cartItems(){return Object.entries(C).filter(x=>Number(x[1])>0).map(([product_id,quantity])=>({product_id,quantity:Number(quantity)}))}
async function refreshFormalQuote(){
 if(!S){CurrentQuote={items:[],productAmount:0,shippingFee:0,totalAmount:0};return CurrentQuote;}
 const q=await post('sessionCartQuote',{sessionId:S.id,items:cartItems(),referralToken:refToken,fulfillmentType:ful()});
 if(q&&q.error)throw new Error(q.error);CurrentQuote=q||CurrentQuote;
 for(const it of (CurrentQuote.items||[])){const p=document.getElementById('price_'+it.productId);if(p)p.textContent=money(it.unitPrice)}
 if(count()){const q=CurrentQuote;const free=Number(q.freeShippingThreshold||0)>0?(q.freeShippingReached?'｜已達免運':'｜再 '+money(q.remainingForFreeShipping||0)+' 免運'):'';cartText.textContent=`已選 ${count()} 件｜${money(q.productAmount||0)}${free}`;const sn=document.getElementById('storeShipNote');if(sn&&Number(q.freeShippingThreshold||0)>0)sn.textContent=q.freeShippingReached?'滿 '+money(q.freeShippingThreshold)+' 免運｜已達':'滿 '+money(q.freeShippingThreshold)+' 免運｜差 '+money(q.remainingForFreeShipping||0);}else cartText.textContent='尚未選商品';
 return CurrentQuote;
}
async function bar(){try{await refreshFormalQuote()}catch(e){cartText.textContent='金額載入失敗'}}
function ful(){return document.querySelector('input[name=ful]:checked')?.value||''}
async function renderSummary(){shipFields.classList.toggle('hide',ful()!=='shipping');try{const q=await refreshFormalQuote();cartSummary.innerHTML=`商品 ${money(q.productAmount||0)}<br>運費 ${money(q.shippingFee||0)}<br><b>合計 ${money(q.totalAmount||0)}</b>`+(ful()==='shipping'&&Number(q.freeShippingThreshold||0)>0?`<br><small>滿 ${money(q.freeShippingThreshold)} 免運${q.freeShippingReached?'｜已達免運':'｜再買 '+money(q.remainingForFreeShipping||0)}</small>`:'');cartLines.innerHTML=(q.items||[]).map(it=>`<div class=line><span>${esc(it.name||'商品')} × ${it.quantity}</span><b>${money(it.lineTotal||0)}</b></div>`).join('')}catch(e){cartSummary.textContent='金額載入失敗'}}
async function openCart(){if(!count())return alert('請先選商品');const g=settings();let h='';if(g.pickupEnabled===true)h+='<label><input type=radio name=ful value=pickup> 現場取貨</label><br>';if(g.shippingEnabled===true)h+='<label><input type=radio name=ful value=shipping> 宅配</label>';fulBox.innerHTML=h||'<b>目前沒有可用取貨方式</b>';const first=fulBox.querySelector('input[name=ful]');if(first){first.checked=true;fulBox.querySelectorAll('input[name=ful]').forEach(x=>x.onchange=renderSummary)}buyerLogin.classList.add('hide');cartModal.classList.add('open');await renderSummary()}function closeCart(){cartModal.classList.remove('open')}async function buyerLoginDo(){const j=await post('memberEmailPhoneLogin',{email:buyerEmail.value,phone:buyerPhone.value});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);buyerLogin.classList.add('hide');alert('登入成功')}
async function placeOrder(){if(!ful())return alert('沒有可用取貨方式');if(ful()==='shipping'&&(!recipient.value.trim()||!rphone.value.trim()||!postal.value.trim()||!address.value.trim()))return alert('請完整填寫收件人、手機、郵遞區號與地址');if(!tk()){buyerLogin.classList.remove('hide');buyerLogin.scrollIntoView();return}const items=Object.entries(C).filter(x=>x[1]>0).map(([product_id,quantity])=>({product_id,quantity}));const payload={memberToken:tk(),sessionId:S.id,fulfillmentType:ful(),recipientName:recipient.value,recipientPhone:rphone.value,recipientPostalCode:postal.value,shippingAddress:address.value,fulfillmentNote:orderNote.value,items,referralToken:refToken};const sig=JSON.stringify([payload.sessionId,payload.fulfillmentType,payload.recipientName,payload.recipientPhone,payload.recipientPostalCode,payload.shippingAddress,payload.fulfillmentNote,payload.items,payload.referralToken]);if(OrderAttempt.signature!==sig)OrderAttempt={signature:sig,key:crypto.randomUUID()};const btn=cartModal.querySelector('button.primary[onclick="placeOrder()"]');const oldText=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='建立正式訂單中…'}try{const j=await post('placeSessionProductOrder',{...payload,idempotencyKey:OrderAttempt.key});if(j.error)throw new Error(j.error);location.href=j.paymentUrl||('groupbuy-payment.html?order='+encodeURIComponent(j.order_id||''))}catch(e){alert(e.message||e);if(btn){btn.disabled=false;btn.textContent=oldText||'確認訂購'}}}
let ApplyMember=null,ApplyHandleAvailable=false;
function showApplyGate(){applyGate.classList.remove('hide');applyLoginPanel.classList.add('hide');applyCreatePanel.classList.add('hide');applyForm.classList.add('hide')}
function showApplyLogin(){applyGate.classList.add('hide');applyLoginPanel.classList.remove('hide');applyCreatePanel.classList.add('hide');applyForm.classList.add('hide')}
function showApplyCreate(){applyGate.classList.add('hide');applyLoginPanel.classList.add('hide');applyCreatePanel.classList.remove('hide');applyForm.classList.add('hide')}
async function loadApplyMember(){if(!tk()){showApplyGate();return false}const j=await get('getMember',{memberToken:tk()});if(j&&j.error){localStorage.removeItem(TK);showApplyGate();return false}ApplyMember=j||{};applyMemberSummary.innerHTML='姓名：'+esc(ApplyMember.name||'未填')+'<br>電話：'+esc(ApplyMember.phone||'')+'<br>帳號：'+esc(ApplyMember.email||'');applyName.value=ApplyMember.brand||ApplyMember.brand_name||ApplyMember.name||'';applyGate.classList.add('hide');applyLoginPanel.classList.add('hide');applyCreatePanel.classList.add('hide');applyForm.classList.remove('hide');return true}
async function openApply(){applyModal.classList.add('open');ApplyHandleAvailable=false;if(!(await loadApplyMember()))showApplyGate()}
function closeApply(){applyModal.classList.remove('open')}
async function applyLoginDo(){const j=await post('groupBuyExistingMemberLogin',{email:applyEmail.value,phone:applyPhone.value});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);refreshLoginState();await loadApplyMember()}
async function createGroupBuyMember(){const name=createName.value.trim(),email=createEmail.value.trim(),phone=createPhone.value.trim();if(!name||!email||!phone)return alert('請完整填寫姓名、Email 與手機');const s=await post('saveMember',{email,authPhone:phone,phone,name,brand:createBrand.value.trim()});if(s.error)return alert(s.error);const j=await post('memberEmailPhoneLogin',{email,phone});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);refreshLoginState();await loadApplyMember()}
async function checkApplyHandle(){const code=applyHandle.value.trim();ApplyHandleAvailable=false;if(code.length<3){applyHandleStatus.textContent='團購主 ID 至少 3 個字元';return false}const j=await get('checkGroupBuyPromoterId',{memberToken:tk(),code});if(j.error){applyHandleStatus.textContent=j.error;return false}applyHandle.value=j.code||code;ApplyHandleAvailable=!!j.available;applyHandleStatus.textContent=j.available?'✓ 這個 ID 可以使用':('✕ '+(j.reason||'此 ID 無法使用'));return ApplyHandleAvailable}
async function submitApply(){if(!tk())return showApplyGate();if(!applySocial.value.trim())return alert('請填主要社群連結');if(!(await checkApplyHandle()))return alert('請先確認可用的團購主 ID');const j=await post('applySessionManager',{memberToken:tk(),requestedReferralCode:applyHandle.value,displayName:applyName.value,socialProfiles:[{url:applySocial.value}],audienceSize:Number(applyAudience.value)||0,avgReach:Number(applyReach.value)||0,groupBuyExperience:applyExp.value,preferredCategories:applyCats.value,applyNote:applyNote.value,sourceSessionId:S?.id||''});if(j.error)return alert(j.error);alert('申請已送出，平台審核後會指派可分享的團購。');closeApply()}

let publicLoginAfter='';
async function openMyOrders(){if(!tk()){hiddenAdminIntent=false;publicLoginAfter='orders';openPublicLogin();return}myOrdersModal.classList.add('open');myOrdersList.innerHTML='<div class=empty>載入中…</div>';try{const j=await get('getMyGroupBuyOrders',{memberToken:tk()});const rows=j.orders||[];myOrdersList.innerHTML=rows.length?rows.map(o=>{const st=String(o.payment_status||'unpaid');const label=st==='paid'?'已付款':st==='reported'?'已回報待確認':'待付款';const closed=['cancelled','refunded'].includes(String(o.order_status||''));const actions=closed?'':st==='paid'?`<button class=secondary style="margin-top:7px" onclick="requestRefund('${esc(o.id)}')">申請退款</button>`:st==='reported'?`<button class=secondary style="margin-top:7px" onclick="location.href='groupbuy-payment.html?order=${esc(o.id)}'">查看付款回報</button>`:`<button class=secondary style="margin-top:7px" onclick="location.href='groupbuy-payment.html?order=${esc(o.id)}'">前往付款／回報</button><button class=secondary style="margin-top:7px;margin-left:5px" onclick="cancelOrder('${esc(o.id)}')">取消未付款訂單</button>`;return `<div class=line style="display:block"><b>${esc(o.sessionName||'團購')}</b><div class=muted>${esc(o.created_at||'')}｜${closed?esc(o.order_status):label}｜${money(o.total_amount||0)}${o.refund_status==='requested'?'｜退款申請中':''}</div>${actions}</div>`}).join(''):'<div class=empty>目前還沒有團購訂單</div>'}catch(e){myOrdersList.textContent='載入失敗：'+(e.message||e)}}
async function cancelOrder(id){if(!confirm('確定取消這筆未付款訂單？取消後庫存會立即釋回。'))return;try{const j=await post('cancelGroupBuyOrder',{memberToken:tk(),orderId:id});if(j.error)throw new Error(j.error);alert('訂單已取消');await openMyOrders()}catch(e){alert(e.message||e)}}
async function requestRefund(id){if(!confirm('確定送出退款申請？團GO平台會依這筆訂單的正式付款紀錄處理。'))return;const note=prompt('退款原因／備註（可留空）','')??null;if(note===null)return;try{const j=await post('requestGroupBuyRefund',{memberToken:tk(),orderId:id,note});if(j.error)throw new Error(j.error);alert('退款申請已送出');await openMyOrders()}catch(e){alert(e.message||e)}}
function refreshLoginState(){loginBtn.textContent=tk()?'團購會員':'團購會員登入'}
function openPublicLogin(){loginModal.classList.add('open');const logged=!!tk();publicLoginFields.classList.toggle('hide',logged);publicLogged.classList.toggle('hide',!logged)}
function closePublicLogin(){loginModal.classList.remove('open')}
function publicRelogin(){localStorage.removeItem(TK);publicLoginFields.classList.remove('hide');publicLogged.classList.add('hide');refreshLoginState()}
async function publicLoginDo(){const j=await post('memberEmailPhoneLogin',{email:publicEmail.value,phone:publicPhone.value});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);refreshLoginState();closePublicLogin();if(hiddenAdminIntent){hiddenAdminIntent=false;await tryPromoterAdmin();return}if(publicLoginAfter==='orders'){publicLoginAfter='';await openMyOrders()}}
let logoHoldTimer=0,logoHeld=false,hiddenAdminIntent=false;
function cancelLogoHold(){if(logoHoldTimer){clearTimeout(logoHoldTimer);logoHoldTimer=0}}
async function tryPromoterAdmin(){if(!tk()){hiddenAdminIntent=true;openPublicLogin();return}const j=await post('myPromoterDashboard',{memberToken:tk()});if(j.error||!Array.isArray(j.promoters)||!j.promoters.length)return;location.href='groupbuy-admin.html'}
function bindHiddenAdmin(){const el=document.getElementById('brandEntry');if(!el)return;const start=e=>{logoHeld=false;cancelLogoHold();logoHoldTimer=setTimeout(async()=>{logoHeld=true;logoHoldTimer=0;await tryPromoterAdmin()},3000)};const stop=()=>cancelLogoHold();el.addEventListener('pointerdown',start);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('pointerleave',stop);el.addEventListener('contextmenu',e=>e.preventDefault());el.addEventListener('click',e=>{if(logoHeld){logoHeld=false;e.preventDefault();return}goHome()})}
refreshLoginState();bindHiddenAdmin();boot();
</script></body></html>
