async function loadMemberPanel(token) {
  const welcome=document.getElementById('memberWelcome');
  const actions=document.getElementById('memberActions');
  if(!welcome||!actions) return;
  try {
    const id = await post('groupBuyIdentity',{memberToken:token||localStorage.getItem(TK)||''});
    const name=id.member?.brand_name||id.member?.name||id.member?.email||'';
    welcome.innerHTML=`<b>歡迎，${esc(name)}</b>`;
    const isPromoter=id.isPromoter||(id.promoterAssignments||[]).length>0;
    
    let btns='';
    btns+=`<button class=secondary style="width:100%;margin-bottom:8px;text-align:left;padding:12px 14px;font-size:15px;font-weight:800" onclick="closePublicLogin();openMyOrders()">🧾　我的訂單</button>`;
    if(isPromoter)
      btns+=`<button class=secondary style="width:100%;margin-bottom:8px;text-align:left;padding:12px 14px;font-size:15px;font-weight:800" onclick="closePublicLogin();openPromoterModal()">🤝　我的推廣</button>`;
    
    // 場次管理員：有 promoterAssignments 且在 staff 表 → 顯示管理入口
    // 這裡我們讓有推廣身份的人都看到，進去後後端再把關
    if((id.promoterAssignments||[]).length>0)
      btns+=`<button class=primary style="width:100%;margin-bottom:8px;text-align:left;padding:12px 14px;font-size:15px;font-weight:800" onclick="location.href='groupbuy-admin.html'">⚙️　管理我的場次</button>`;
    
    actions.innerHTML=btns||'<div class=summary>歡迎使用團GO</div>';
    
    // Switch publicLogged visible
    document.getElementById('publicLoginFields')?.classList.add('hide');
    document.getElementById('publicCreateFields')?.classList.add('hide');
    document.getElementById('publicLogged')?.classList.remove('hide');
  } catch(e){
    welcome.innerHTML='已登入';
    actions.innerHTML='<button class=secondary style="width:100%;margin-bottom:8px" onclick="closePublicLogin();openMyOrders()">🧾 我的訂單</button>';
    document.getElementById('publicLogged')?.classList.remove('hide');
  }
}
