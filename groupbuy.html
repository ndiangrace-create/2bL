<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2BL 團購</title><style>
:root{--g:#DDEAD1;--y:#FAEEC7;--b:#D9E5EE;--p:#DCD7ED;--line:#e7e7e2;--muted:#666;--bg:#fafaf8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:#111;padding-bottom:86px}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:15px 16px;font-size:21px;font-weight:950}.wrap{max-width:920px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.cover{aspect-ratio:1;background:#f1f1ed}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.name{font-weight:950;line-height:1.35}.desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}.price{font-weight:950;margin-top:6px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-right:6px}.qty{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}.qty button{height:34px;border:0;background:var(--g);font-weight:950}.status{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--y);font-size:12px;font-weight:900;margin-top:5px}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.back{border:0;background:transparent;font-weight:900;margin-bottom:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:25}.bottomin{max-width:920px;margin:auto;display:flex;gap:10px;align-items:center}.carttext{flex:1;font-weight:900}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:12px 16px;font-weight:900}.secondary{border:0;background:#eee;border-radius:11px;padding:11px 14px;font-weight:900}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.sheetin{max-width:680px;margin:auto}.field{margin:10px 0}.field label{display:block;font-weight:900;font-size:14px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.summary{background:var(--g);border-radius:14px;padding:13px;margin:12px 0}.recruit{margin-top:24px;background:var(--g);border-radius:18px;padding:18px}.recruit h2{margin:0 0 6px}.recruit p{margin:0 0 12px;color:#42533e;line-height:1.6}.hide{display:none!important}.promo{background:var(--p);border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:14px;font-weight:850}.tier{font-size:12px;color:#755e00;margin-top:4px}
</style></head><body><div class=top>2BL 團購</div><main class=wrap><div id=content><div class=empty>載入中…</div></div><section class=recruit><h2>想成為團購主？</h2><p>不用囤貨、不用處理出貨。分享你的專屬連結，消費者仍回 2BL 統一下單，系統自動歸屬你的業績與收益。</p><button class=primary onclick=openApply()>申請成為團購主</button></section></main><footer id=cartBar class="bottom hide"><div class=bottomin><div id=cartText class=carttext>尚未選商品</div><button class=primary onclick=openCart()>查看購物車</button></div></footer>
<div id=cartModal class=overlay><div class=sheet><div class=sheetin><h2>購物車</h2><div id=cartLines></div><div id=fulBox class=field></div><div id=shipFields class=hide><div class=field><label>收件人</label><input id=recipient></div><div class=field><label>手機</label><input id=rphone></div><div class=field><label>郵遞區號</label><input id=postal></div><div class=field><label>完整地址</label><input id=address></div><div class=field><label>出貨備註</label><input id=orderNote></div></div><div id=cartSummary class=summary></div><div id=buyerLogin class="hide"><div class=field><label>Email</label><input id=buyerEmail></div><div class=field><label>手機</label><input id=buyerPhone></div><button class=secondary onclick=buyerLoginDo()>登入 2BL 會員</button></div><button class=primary style="width:100%;margin-top:10px" onclick=placeOrder()>確認訂購</button><button class=secondary style="width:100%;margin-top:8px" onclick=closeCart()>繼續購物</button></div></div></div>
<div id=applyModal class=overlay><div class=sheet><div class=sheetin><h2>申請成為團購主</h2><div id=applyLogin class=hide><p>申請會綁定既有 2BL 會員。</p><div class=field><label>Email</label><input id=applyEmail></div><div class=field><label>手機</label><input id=applyPhone></div><button class=secondary onclick=applyLoginDo()>登入後填寫</button></div><div id=applyForm><div class=field><label>團購主／品牌名稱</label><input id=applyName></div><div class=field><label>主要社群／LINE 群／FB 社團／IG 連結 *</label><input id=applySocial></div><div class=field><label>社群／群組人數</label><input id=applyAudience type=number min=0></div><div class=field><label>平均貼文／團購觸及人數</label><input id=applyReach type=number min=0></div><div class=field><label>過去團購經驗</label><textarea id=applyExp></textarea></div><div class=field><label>希望合作商品類型</label><textarea id=applyCats></textarea></div><div class=field><label>其他說明</label><textarea id=applyNote></textarea></div><button class=primary style="width:100%" onclick=submitApply()>送出申請</button></div><button class=secondary style="width:100%;margin-top:8px" onclick=closeApply()>關閉</button></div></div></div>
<script>
const API='https://2bl-v7.ndiangrace.workers.dev',T='tuibile',TK='2bl_member_token',Q=new URLSearchParams(location.search);let sessions=[],S=null,P=[],C={},ref=Q.get('ref')||'',refToken='',customerPrices={};
async function get(a,e={}){const u=new URL(API);Object.entries({action:a,tenant:T,...e}).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function post(a,e={}){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,tenant:T,...e})}).then(r=>r.json())}function tk(){return localStorage.getItem(TK)||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return'NT$ '+Number(n||0).toLocaleString()}function settings(){return S&&S.groupBuySettings||{}}function saleState(g){const now=Date.now(),a=g.saleStartAt?Date.parse(g.saleStartAt):0,b=g.saleEndAt?Date.parse(g.saleEndAt):0;if(a&&now<a)return'即將開賣';if(b&&now>b)return'已截止';return'開放中'}
async function boot(){if(ref){const rr=await get('resolveGroupBuyReferral',{ref});if(rr.error){content.innerHTML='<div class=empty>'+esc(rr.error)+'</div>';return}refToken=rr.referralToken||'';await openStore(rr.sessionId,true);return}const id=Q.get('id')||'';if(id){await openStore(id,true);return}const j=await get('groupBuySessions');if(j.error){content.innerHTML='<div class=empty>'+esc(j.error)+'</div>';return}sessions=Array.isArray(j)?j:[];renderList()}
function renderList(){content.innerHTML='<div class=grid>'+sessions.map(s=>{const g=s.groupBuySettings||{},st=saleState(g);return`<article class=card onclick="openStore('${esc(s.id)}')"><div class=cover>${s.coverUrl?`<img src="${esc(s.coverUrl)}">`:''}</div><div class=body><div class=name>${esc(s.name)}</div><div class=desc>${esc(s.description||'點進去選購商品')}</div><span class=status>${st}</span></div></article>`}).join('')+'</div>'+(sessions.length?'':'<div class=empty>目前沒有開放中的團購</div>');cartBar.classList.add('hide')}
async function openStore(id,keepUrl=false){const j=await get('sessionProducts',{sessionId:id,referralToken:refToken});if(j.error){content.innerHTML='<div class=empty>'+esc(j.error)+'</div>';return}S=j.session;P=j.products||[];customerPrices=j.customerPrices||{};C={};if(!keepUrl&&!ref)history.pushState({},'',location.pathname+'?id='+encodeURIComponent(id));renderStore()}
function displayUnit(p,qty=1){let v=Number(p.price||0);for(const t of (p.quantityTiers||[])){if(qty>=Number(t.minQty||999999))v=Number(t.unitPrice||v)}const rv=Number(customerPrices[p.id]||0);if(rv>0)v=Math.min(v,rv);return v}
function renderStore(){const g=settings(),promo=ref?'<div class=promo>你正在使用團購主專屬連結，優惠與業績會由系統自動歸屬。</div>':'';content.innerHTML='<button class=back onclick="goHome()">← 回團購首頁</button>'+promo+'<h2>'+esc(S.name)+'</h2><div class=grid>'+P.map(p=>`<article class=card><div class=cover>${p.image_url?`<img src="${esc(p.image_url)}">`:''}</div><div class=body><div class=name>${esc(p.name)}</div><div class=desc>${esc(p.description||'')}</div><div class=price>${Number(p.original_price||0)>Number(p.price||0)?`<span class=old>${money(p.original_price)}</span>`:''}<span id="price_${p.id}">${money(displayUnit(p,1))}</span></div>${(p.quantityTiers||[]).length?`<div class=tier>${(p.quantityTiers||[]).map(t=>'滿 '+t.minQty+' 個，每個 '+money(t.unitPrice)).join('｜')}</div>`:''}<div class=qty><button onclick="chg('${p.id}',-1)">－</button><b id="q_${p.id}">0</b><button onclick="chg('${p.id}',1)">＋</button></div></div></article>`).join('')+'</div>';cartBar.classList.remove('hide');bar()}
function goHome(){history.pushState({},'',location.pathname);ref='';refToken='';S=null;P=[];C={};renderList()}function chg(id,d){const p=P.find(x=>x.id===id);let n=Math.max(0,(C[id]||0)+d);if(p.stock_qty!=null)n=Math.min(n,+p.stock_qty);if(p.per_member_limit!=null)n=Math.min(n,+p.per_member_limit);C[id]=n;document.getElementById('q_'+id).textContent=n;document.getElementById('price_'+id).textContent=money(displayUnit(p,Math.max(1,n)));bar()}function count(){return Object.values(C).reduce((a,b)=>a+b,0)}function productAmount(){return P.reduce((s,p)=>s+(C[p.id]||0)*displayUnit(p,Math.max(1,C[p.id]||0)),0)}function bar(){cartText.textContent=count()?`已選 ${count()} 件｜${money(productAmount())}`:'尚未選商品'}function ful(){return document.querySelector('input[name=ful]:checked')?.value||''}function shippingFee(){const g=settings(),a=productAmount();return ful()==='shipping'?((Number(g.freeShippingThreshold)>0&&a>=Number(g.freeShippingThreshold))?0:Number(g.shippingFee||0)):0}function renderSummary(){const a=productAmount(),sf=shippingFee(),g=settings();cartSummary.innerHTML=`商品 ${money(a)}<br>運費 ${money(sf)}<br><b>合計 ${money(a+sf)}</b>`+(ful()==='shipping'&&Number(g.freeShippingThreshold)>a?`<br><small>再買 ${money(Number(g.freeShippingThreshold)-a)} 即享免運</small>`:'');shipFields.classList.toggle('hide',ful()!=='shipping')}
function openCart(){if(!count())return alert('請先選商品');cartLines.innerHTML=P.filter(p=>C[p.id]).map(p=>`<div class=line><span>${esc(p.name)} × ${C[p.id]}</span><b>${money(C[p.id]*displayUnit(p,C[p.id]))}</b></div>`).join('');const g=settings();let h='';if(g.pickupEnabled===true)h+='<label><input type=radio name=ful value=pickup> 現場取貨</label><br>';if(g.shippingEnabled===true)h+='<label><input type=radio name=ful value=shipping> 宅配 '+money(g.shippingFee||0)+'</label>';fulBox.innerHTML=h||'<b>目前沒有可用取貨方式</b>';const first=fulBox.querySelector('input[name=ful]');if(first){first.checked=true;fulBox.querySelectorAll('input[name=ful]').forEach(x=>x.onchange=renderSummary)}renderSummary();buyerLogin.classList.add('hide');cartModal.classList.add('open')}function closeCart(){cartModal.classList.remove('open')}async function buyerLoginDo(){const j=await post('memberEmailPhoneLogin',{email:buyerEmail.value,phone:buyerPhone.value});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);buyerLogin.classList.add('hide');alert('登入成功')}
async function placeOrder(){if(!ful())return alert('沒有可用取貨方式');if(ful()==='shipping'&&(!recipient.value.trim()||!rphone.value.trim()||!postal.value.trim()||!address.value.trim()))return alert('請完整填寫收件人、手機、郵遞區號與地址');if(!tk()){buyerLogin.classList.remove('hide');buyerLogin.scrollIntoView();return}const items=Object.entries(C).filter(x=>x[1]>0).map(([product_id,quantity])=>({product_id,quantity}));const j=await post('placeSessionProductOrder',{memberToken:tk(),sessionId:S.id,idempotencyKey:crypto.randomUUID(),fulfillmentType:ful(),recipientName:recipient.value,recipientPhone:rphone.value,recipientPostalCode:postal.value,shippingAddress:address.value,fulfillmentNote:orderNote.value,items,referralToken:refToken});if(j.error)return alert(j.error);alert(`訂購成功\n商品 ${money(j.product_amount)}\n運費 ${money(j.shipping_fee)}\n合計 ${money(j.total_amount)}`);location.reload()}
function openApply(){applyModal.classList.add('open');const logged=!!tk();applyLogin.classList.toggle('hide',logged);applyForm.classList.toggle('hide',!logged)}function closeApply(){applyModal.classList.remove('open')}async function applyLoginDo(){const j=await post('memberEmailPhoneLogin',{email:applyEmail.value,phone:applyPhone.value});if(j.error)return alert(j.error);localStorage.setItem(TK,j.token);applyLogin.classList.add('hide');applyForm.classList.remove('hide')}async function submitApply(){if(!applySocial.value.trim())return alert('請填主要社群連結');const j=await post('applySessionManager',{memberToken:tk(),displayName:applyName.value,socialProfiles:[{url:applySocial.value}],audienceSize:Number(applyAudience.value)||0,avgReach:Number(applyReach.value)||0,groupBuyExperience:applyExp.value,preferredCategories:applyCats.value,applyNote:applyNote.value});if(j.error)return alert(j.error);alert('申請已送出，審核通過後會由後台指派可開團的團購場次。');closeApply()}
boot();
</script></body></html>
